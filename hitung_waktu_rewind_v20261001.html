<!DOCTYPE html>
<html lang="id" class="transition-all duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estimasi Waktu Rewind</title>
    <link rel="icon" type="image/png" href="./icons/williyanto_logo_rounded.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        select {
            background-image: none !important;
        }
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gradient-to-tr from-slate-100 via-indigo-50/30 to-slate-100 dark:from-slate-950 dark:via-slate-900/60 dark:to-slate-950 min-h-[100dvh] flex flex-col justify-center items-center py-2 px-3 overflow-x-hidden transition-colors duration-300">

    <!-- Ambient Background Blobs -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40 dark:opacity-20 hidden md:block">
        <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-indigo-400 blur-[100px] animate-pulse"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-purple-400 blur-[100px] animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-3xl border border-slate-200/50 dark:border-slate-800/80 shadow-xl p-4 sm:p-5 transition-all duration-300 flex flex-col w-full max-h-[calc(100dvh-1rem)] my-auto overflow-hidden">
        
        <!-- Header -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-md shadow-indigo-200 dark:shadow-none">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-800 dark:text-slate-100 tracking-tight">Estimasi Waktu Rewind</h1>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">Produksi & Rewinding Kabel</p>
                </div>
            </div>
            
            <!-- Dark Mode Toggle Button -->
            <button id="theme-toggle" type="button" class="p-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 hover:bg-slate-100 dark:hover:bg-slate-750 active:scale-95 transition-all">
                <svg id="theme-toggle-dark-icon" class="w-4 h-4 text-slate-500 dark:text-slate-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <svg id="theme-toggle-light-icon" class="w-4 h-4 text-amber-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
                </svg>
            </button>
        </div>

        <!-- Form & Controls container -->
        <div class="space-y-3 flex-1 flex flex-col justify-between my-2 overflow-y-auto scrollbar-none">
            
            <form id="kalkulatorForm" class="space-y-3">
                <!-- Panjang Total Kabel -->
                <div class="relative group">
                    <label for="panjangKabel" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Panjang Total Kabel (meter)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-indigo-500 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                            </svg>
                        </div>
                        <input type="text" inputmode="numeric" id="panjangKabel" placeholder="Contoh: 1.000" class="pl-9 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-xs font-semibold">
                    </div>
                </div>

                <!-- Kecepatan Mesin -->
                <div class="relative group">
                    <label for="kecepatanMesin" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Kecepatan Mesin (m/menit)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-indigo-500 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                            </svg>
                        </div>
                        <input type="text" inputmode="decimal" id="kecepatanMesin" placeholder="Contoh: 4,5" class="pl-9 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-xs font-semibold">
                    </div>
                </div>

                <!-- Switch Continuation -->
                <div class="flex items-center justify-between p-2.5 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/80 rounded-xl cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" onclick="toggleSwitchDirect(event)">
                    <span class="text-xs font-bold text-slate-700 dark:text-slate-200 select-none">Lanjutkan Produksi Berjalan?</span>
                    <input type="checkbox" id="lanjutkanSwitch" class="w-4 h-4 text-indigo-600 rounded border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900 focus:ring-indigo-500 cursor-pointer">
                </div>

                <!-- Sudah Berjalan Input (Hidden by default) -->
                <div id="lanjutanInputContainer" class="hidden relative group">
                    <label for="sudahBerjalan" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Sudah Berjalan (meter)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-indigo-500 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                            </svg>
                        </div>
                        <input type="text" inputmode="numeric" id="sudahBerjalan" placeholder="Contoh: 100" class="pl-9 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-xs font-semibold">
                    </div>
                </div>
            </form>

            <!-- Dynamic Result Card -->
            <div id="hasilEstimasi" class="hidden my-1"></div>
            
            <!-- Controls Menu -->
            <div class="grid grid-cols-3 gap-3 pt-2.5 border-t border-slate-100 dark:border-slate-800">
                <button type="button" id="kembaliBtn" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Kembali
                </button>
                
                <button type="button" id="hapusBtn" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-transparent rounded-xl text-xs font-bold text-white bg-rose-500 hover:bg-rose-600 active:scale-95 transition-all shadow-md shadow-rose-100 dark:shadow-none">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    Reset
                </button>
                
                <a href="index.html" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    Beranda
                </a>
            </div>

        </div>

        <!-- Footer -->
        <footer class="text-center text-slate-400 dark:text-slate-600 text-[10px] mt-2 pt-2 border-t border-slate-100 dark:border-slate-800 font-medium">
            Williyanto Adi 2026
        </footer>

    </div>

    <!-- Script Logic -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const inputPanjang = document.getElementById('panjangKabel');
        const inputKecepatan = document.getElementById('kecepatanMesin');
        const lanjutkanSwitch = document.getElementById('lanjutkanSwitch');
        const lanjutanContainer = document.getElementById('lanjutanInputContainer');
        const inputSudahBerjalan = document.getElementById('sudahBerjalan');
        const hasilDiv = document.getElementById('hasilEstimasi');
        const kembaliBtn = document.getElementById('kembaliBtn');
        const hapusBtn = document.getElementById('hapusBtn');

        window.toggleSwitchDirect = function(evt) {
          if (evt.target !== lanjutkanSwitch) {
            lanjutkanSwitch.checked = !lanjutkanSwitch.checked;
            lanjutkanSwitch.dispatchEvent(new Event('change'));
          }
        };

        function formatAngkaInteger(inputElement) {
          const start = inputElement.selectionStart;
          const oldLen = inputElement.value.length;
          let nilai = inputElement.value.replace(/\D/g, '');
          inputElement.value = nilai ? Number(nilai).toLocaleString('id-ID') : '';
          const newLen = inputElement.value.length;
          const pos = Math.max(0, (start || 0) + (newLen - oldLen));
          if (inputElement.setSelectionRange) {
            try { inputElement.setSelectionRange(pos, pos); } catch(e) {}
          }
        }

        function formatAngkaDesimal(inputElement) {
          const start = inputElement.selectionStart;
          const oldLen = inputElement.value.length;
          let nilai = inputElement.value;
          let filteredNilai = nilai.replace(/[^\d,]/g, '');
          let parts = filteredNilai.split(',');
          let integerPart = parts[0];
          let decimalPart = parts.slice(1).join('');
          let formattedIntegerPart = integerPart.replace(/\D/g, '');
          if (formattedIntegerPart) {
            formattedIntegerPart = Number(formattedIntegerPart).toLocaleString('id-ID');
          } else if (nilai.startsWith(',')) {
            formattedIntegerPart = '0';
          }
          let finalValue = formattedIntegerPart;
          if (parts.length > 1) {
            finalValue += ',' + decimalPart;
          }
          inputElement.value = finalValue;
          const newLen = inputElement.value.length;
          const pos = Math.max(0, (start || 0) + (newLen - oldLen));
          if (inputElement.setSelectionRange) {
            try { inputElement.setSelectionRange(pos, pos); } catch(e) {}
          }
        }

        function hapusForm() {
          inputPanjang.value = '';
          inputKecepatan.value = '';
          inputSudahBerjalan.value = '';
          
          if (lanjutkanSwitch.checked) {
            lanjutkanSwitch.checked = false;
            lanjutkanSwitch.dispatchEvent(new Event('change'));
          }
          
          hasilDiv.classList.add('hidden');
          inputPanjang.focus();
        }

        inputPanjang.addEventListener('input', () => { formatAngkaInteger(inputPanjang); hitungEstimasi(); });
        inputKecepatan.addEventListener('input', () => { formatAngkaDesimal(inputKecepatan); hitungEstimasi(); });
        inputSudahBerjalan.addEventListener('input', () => { formatAngkaInteger(inputSudahBerjalan); hitungEstimasi(); });
        
        lanjutkanSwitch.addEventListener('change', () => {
          if (lanjutkanSwitch.checked) {
            lanjutanContainer.classList.remove('hidden');
          } else {
            lanjutanContainer.classList.add('hidden');
            inputSudahBerjalan.value = '';
          }
          hitungEstimasi();
        });

        kembaliBtn.addEventListener('click', () => {
          if (window.top !== window.self && window.parent.closePreviewModal) {
            window.parent.closePreviewModal();
          } else {
            history.back();
          }
        });
        hapusBtn.addEventListener('click', hapusForm);

        function hitungEstimasi() {
          const panjangTotal = parseFloat(inputPanjang.value.replace(/\./g, '')) || 0;
          const kecepatanMesin = parseFloat(inputKecepatan.value.replace(/\./g, '').replace(',', '.')) || 0;
          const sudahBerjalan = parseFloat(inputSudahBerjalan.value.replace(/\./g, '')) || 0;

          let panjangDihitung = panjangTotal;
          if (lanjutkanSwitch.checked) {
            panjangDihitung = panjangTotal - sudahBerjalan;
          }

          if (panjangTotal <= 0 || kecepatanMesin <= 0) {
            hasilDiv.classList.add('hidden');
            return;
          }
          
          if (panjangDihitung < 0) {
            hasilDiv.innerHTML = `<div class="p-3 bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-500/40 rounded-2xl text-center text-xs text-rose-600 dark:text-rose-300 font-semibold"><strong>Error:</strong> "Sudah Berjalan" tidak boleh lebih besar dari "Panjang Total Kabel".</div>`;
            hasilDiv.classList.remove('hidden');
            return;
          }

          const waktuMulai = new Date();
          const totalMenit = panjangDihitung / kecepatanMesin;
          const durasiMilidetik = totalMenit * 60 * 1000;
          const waktuSelesai = new Date(waktuMulai.getTime() + durasiMilidetik);

          const jamMulai = String(waktuMulai.getHours()).padStart(2, '0');
          const menitMulai = String(waktuMulai.getMinutes()).padStart(2, '0');
          const jamSelesai = String(waktuSelesai.getHours()).padStart(2, '0');
          const menitSelesai = String(waktuSelesai.getMinutes()).padStart(2, '0');

          const totalMenitRound = Math.round(totalMenit);
          const jam = Math.floor(totalMenitRound / 60);
          const sisaMenit = totalMenitRound % 60;

          let hasilTextDurasi = '';
          if (jam > 0) hasilTextDurasi += `<strong class="text-indigo-600 dark:text-indigo-300 font-extrabold text-base sm:text-lg">${jam}</strong> jam `;
          if (sisaMenit > 0) hasilTextDurasi += `<strong class="text-indigo-600 dark:text-indigo-300 font-extrabold text-base sm:text-lg">${sisaMenit}</strong> menit`;
          if (totalMenit > 0 && hasilTextDurasi === '') hasilTextDurasi = 'Kurang dari 1 menit.';
          if (panjangDihitung <= 0 && panjangTotal > 0) hasilTextDurasi = '<strong class="text-emerald-600 dark:text-emerald-400">Pekerjaan sudah selesai.</strong>';
          
          hasilDiv.innerHTML = `
            <div class="bg-gradient-to-br from-indigo-50/60 via-slate-100 to-purple-50/60 dark:from-indigo-950/60 dark:via-slate-900 dark:to-purple-950/60 border border-indigo-200/50 dark:border-indigo-500/30 rounded-2xl p-3.5 text-center shadow-lg relative overflow-hidden space-y-2">
              <span class="text-[10px] font-bold text-indigo-600 dark:text-indigo-400 uppercase tracking-widest block">Estimasi Waktu Selesai</span>
              <div class="text-sm text-slate-800 dark:text-slate-100 font-bold">${hasilTextDurasi}</div>
              
              <div class="p-2 bg-white/80 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs text-slate-600 dark:text-slate-300 font-medium">
                Mulai <strong class="text-indigo-600 dark:text-indigo-400">${jamMulai}:${menitMulai}</strong> &rarr; Selesai <strong class="text-emerald-600 dark:text-emerald-400">${jamSelesai}:${menitSelesai}</strong>
              </div>

              <p class="text-[10px] text-slate-400 dark:text-slate-500 italic mb-0">(Sisa ${panjangDihitung.toLocaleString('id-ID')} m dari ${panjangTotal.toLocaleString('id-ID')} m)</p>
            </div>`;
          hasilDiv.classList.remove('hidden');
        }

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        function updateThemeIcons() {
            if (document.documentElement.classList.contains('dark')) {
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
            } else {
                themeToggleLightIcon.classList.add('hidden');
                themeToggleDarkIcon.classList.remove('hidden');
            }
        }
        updateThemeIcons();

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
                updateThemeIcons();
            });
        }
    });
    </script>
</body>
</html>
