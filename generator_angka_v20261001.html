<!DOCTYPE html>
<html lang="id" class="transition-all duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Angka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        select {
            background-image: none !important;
        }
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gradient-to-tr from-slate-100 via-violet-50/30 to-slate-100 dark:from-slate-950 dark:via-slate-900/60 dark:to-slate-950 min-h-[100dvh] flex flex-col justify-center items-center py-2 px-3 overflow-x-hidden transition-colors duration-300">

    <!-- Ambient Background Blobs -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40 dark:opacity-20 hidden md:block">
        <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-violet-400 blur-[100px] animate-pulse"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-fuchsia-400 blur-[100px] animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md sm:max-w-lg mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-3xl border border-slate-200/50 dark:border-slate-800/80 shadow-xl p-4 sm:p-5 transition-all duration-300 flex flex-col w-full max-h-[calc(100dvh-1rem)] my-auto overflow-hidden">
        
        <!-- Header -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500 to-fuchsia-600 flex items-center justify-center text-white shadow-md shadow-violet-200 dark:shadow-none">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-800 dark:text-slate-100 tracking-tight">Generator Angka</h1>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">Random Numbers & Statistics</p>
                </div>
            </div>
            
            <!-- Dark Mode Toggle Button -->
            <button id="theme-toggle" type="button" class="p-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 hover:bg-slate-100 dark:hover:bg-slate-750 active:scale-95 transition-all">
                <svg id="theme-toggle-dark-icon" class="w-4 h-4 text-slate-500 dark:text-slate-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <svg id="theme-toggle-light-icon" class="w-4 h-4 text-amber-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
                </svg>
            </button>
        </div>

        <!-- Form & Content container -->
        <div class="space-y-3 flex-1 flex flex-col justify-between my-2 overflow-y-auto scrollbar-none">
            
            <form id="generator-form" class="space-y-3">
                <div class="grid grid-cols-2 gap-3">
                    <div class="relative group">
                        <label for="nilaiTerkecil" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Batas Bawah</label>
                        <input type="text" inputmode="decimal" id="nilaiTerkecil" placeholder="Contoh: 1" class="block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-all text-xs font-semibold">
                    </div>
                    <div class="relative group">
                        <label for="nilaiTerbesar" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Batas Atas</label>
                        <input type="text" inputmode="decimal" id="nilaiTerbesar" placeholder="Contoh: 100" class="block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-all text-xs font-semibold">
                    </div>
                    <div class="relative group">
                        <label for="banyaknya" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Jumlah Angka</label>
                        <input type="text" inputmode="numeric" id="banyaknya" placeholder="Contoh: 50" class="block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-all text-xs font-semibold">
                    </div>
                    <div class="relative group">
                        <label for="jumlahDigit" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Digit Desimal</label>
                        <input type="text" inputmode="numeric" id="jumlahDigit" placeholder="Contoh: 3" class="block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-all text-xs font-semibold">
                    </div>
                </div>

                <div class="relative group">
                    <div class="flex items-center justify-between mb-1">
                        <label for="targetRataRata" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Target Rata-Rata <span class="text-slate-400 font-normal">(Opsional)</span></label>
                        <span class="text-[9px] text-violet-500 dark:text-violet-400 font-bold bg-violet-50 dark:bg-violet-950/40 px-1.5 py-0.5 rounded-md border border-violet-200 dark:border-violet-800/40">Auto Balance</span>
                    </div>
                    <input type="text" inputmode="decimal" id="targetRataRata" placeholder="Contoh: 85.50 (Kosongkan jika acak murni)" class="block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-all text-xs font-semibold">
                </div>

                <!-- Form Action Button -->
                <div class="flex justify-center pt-1">
                    <button type="submit" id="tombolEksekusi" class="w-full max-w-[200px] py-2.5 px-3 bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 active:scale-95 text-white font-bold text-xs rounded-xl transition-all shadow-md shadow-violet-200 dark:shadow-none flex items-center justify-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Generate
                    </button>
                </div>
            </form>

            <!-- Output & Results Section -->
            <div id="hasilFooter" class="hidden space-y-2.5 pt-2 border-t border-slate-100 dark:border-slate-800">
                <!-- Stats Summary Grid -->
                <div class="grid grid-cols-3 gap-2 text-center bg-slate-50 dark:bg-slate-800/40 p-2.5 rounded-2xl border border-slate-200 dark:border-slate-700/50">
                    <div>
                        <span class="block text-[9px] text-slate-400 dark:text-slate-500 font-bold uppercase tracking-wider mb-0.5">Terkecil</span>
                        <span id="hasilMin" class="text-xs font-extrabold text-rose-500 dark:text-rose-400 block font-mono">---</span>
                    </div>
                    <div>
                        <span class="block text-[9px] text-slate-400 dark:text-slate-500 font-bold uppercase tracking-wider mb-0.5">Rata-Rata</span>
                        <span id="hasilRataRata" class="text-xs font-extrabold text-emerald-500 dark:text-emerald-400 block font-mono">---</span>
                    </div>
                    <div>
                        <span class="block text-[9px] text-slate-400 dark:text-slate-500 font-bold uppercase tracking-wider mb-0.5">Terbesar</span>
                        <span id="hasilMax" class="text-xs font-extrabold text-sky-500 dark:text-sky-400 block font-mono">---</span>
                    </div>
                </div>

                <!-- List Toolbar -->
                <div class="flex items-center justify-between px-1">
                    <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-wider">Daftar Hasil:</span>
                    <div class="flex gap-1.5">
                        <button id="tombolSalin" type="button" class="hidden py-1 px-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 active:scale-95 text-slate-700 dark:text-slate-200 font-bold text-[11px] rounded-lg transition-all border border-slate-200 dark:border-slate-700/80 flex items-center gap-1 shadow-sm">
                            <svg class="w-3 h-3 text-slate-400 dark:text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                            </svg>
                            Salin
                        </button>
                        <button id="tombolUnduh" type="button" class="hidden py-1 px-2.5 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold text-[11px] rounded-lg transition-all shadow-sm flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                            </svg>
                            Excel
                        </button>
                    </div>
                </div>

                <!-- Generated Numbers Container -->
                <div id="hasilGenerator" class="max-h-32 overflow-y-auto p-2 bg-slate-50 dark:bg-slate-950/60 border border-slate-200 dark:border-slate-800 rounded-xl grid grid-cols-2 gap-1.5 text-xs font-mono scrollbar-none">
                </div>
            </div>
            
            <!-- Controls Menu -->
            <div class="grid grid-cols-3 gap-3 pt-2.5 border-t border-slate-100 dark:border-slate-800">
                <button type="button" onclick="if(window.top!==window.self&&window.parent.closePreviewModal){window.parent.closePreviewModal();}else{history.back();}" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Kembali
                </button>
                
                <button type="button" id="tombolReset" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-transparent rounded-xl text-xs font-bold text-white bg-rose-500 hover:bg-rose-600 active:scale-95 transition-all shadow-md shadow-rose-100 dark:shadow-none">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    Reset
                </button>
                
                <a href="index.html" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    Beranda
                </a>
            </div>

        </div>

        <!-- Footer -->
        <footer class="text-center text-slate-400 dark:text-slate-600 text-[10px] mt-2 pt-2 border-t border-slate-100 dark:border-slate-800 font-medium">
            Williyanto Adi 2026
        </footer>

    </div>

    <!-- Script Logic -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        let generatedNumbers = [];

        function validateDecimal(event) {
          const input = event.target;
          let value = input.value.replace(/,/g, '.').replace(/[^\d.]/g, '');
          const parts = value.split('.');
          if (parts.length > 2) {
            value = parts[0] + '.' + parts.slice(1).join('');
          }
          input.value = value;
        }

        function validateInteger(event) {
          const input = event.target;
          input.value = input.value.replace(/[^\d]/g, '');
        }

        document.getElementById('nilaiTerkecil').addEventListener('input', validateDecimal);
        document.getElementById('nilaiTerbesar').addEventListener('input', validateDecimal);
        document.getElementById('targetRataRata').addEventListener('input', validateDecimal);
        document.getElementById('banyaknya').addEventListener('input', validateInteger);
        document.getElementById('jumlahDigit').addEventListener('input', validateInteger);

        function copyToClipboard(text) {
          if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
          } else {
            let textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            return new Promise((res, rej) => {
              document.execCommand('copy') ? res() : rej();
              textArea.remove();
            });
          }
        }

        document.getElementById('generator-form').addEventListener('submit', function (event) {
          event.preventDefault();

          const nilaiMin = parseFloat(document.getElementById('nilaiTerkecil').value);
          const nilaiMax = parseFloat(document.getElementById('nilaiTerbesar').value);
          const jumlahAngka = parseInt(document.getElementById('banyaknya').value);
          const jumlahDigit = parseInt(document.getElementById('jumlahDigit').value);
          const targetStr = document.getElementById('targetRataRata').value.trim();
          const hasTarget = targetStr !== '';
          const targetRataRata = parseFloat(targetStr);

          const hasilContainer = document.getElementById('hasilGenerator');
          const hasilRataRataContainer = document.getElementById('hasilRataRata');
          const hasilMinContainer = document.getElementById('hasilMin');
          const hasilMaxContainer = document.getElementById('hasilMax');
          const hasilFooter = document.getElementById('hasilFooter');
          const tombolSalin = document.getElementById('tombolSalin');
          const tombolUnduh = document.getElementById('tombolUnduh');

          tombolSalin.classList.add('hidden');
          tombolUnduh.classList.add('hidden');

          if (isNaN(nilaiMin) || isNaN(nilaiMax) || isNaN(jumlahAngka) || isNaN(jumlahDigit) || jumlahAngka <= 0 || nilaiMin >= nilaiMax || jumlahDigit < 0) {
            hasilFooter.classList.remove('hidden');
            hasilContainer.innerHTML = '<span class="text-rose-500 p-2 col-span-2 text-center text-xs">Input tidak valid! Periksa kembali angka dan digit.</span>';
            hasilMinContainer.textContent = '---';
            hasilRataRataContainer.textContent = '---';
            hasilMaxContainer.textContent = '---';
            generatedNumbers = [];
            return;
          }

          if (hasTarget) {
            if (isNaN(targetRataRata) || targetRataRata < nilaiMin || targetRataRata > nilaiMax) {
              hasilFooter.classList.remove('hidden');
              hasilContainer.innerHTML = `<span class="text-rose-500 p-2 col-span-2 text-center text-xs font-semibold">Target Rata-Rata (${isNaN(targetRataRata) ? targetStr : targetRataRata}) harus berada di antara Batas Bawah (${nilaiMin}) dan Batas Atas (${nilaiMax})!</span>`;
              hasilMinContainer.textContent = '---';
              hasilRataRataContainer.textContent = '---';
              hasilMaxContainer.textContent = '---';
              generatedNumbers = [];
              return;
            }
          }

          hasilFooter.classList.remove('hidden');

          let hasilAngka = [];

          if (!hasTarget) {
            let totalAngka = 0;
            for (let i = 0; i < jumlahAngka; i++) {
              const angkaAcak = Math.random() * (nilaiMax - nilaiMin) + nilaiMin;
              const valStr = angkaAcak.toFixed(jumlahDigit);
              hasilAngka.push(valStr);
              totalAngka += parseFloat(valStr);
            }
          } else {
            let arr = [];
            const spread = Math.min(targetRataRata - nilaiMin, nilaiMax - targetRataRata);
            for (let i = 0; i < jumlahAngka; i++) {
              const noise = (Math.random() * 2 - 1) * spread * 0.75;
              let val = targetRataRata + noise;
              val = Math.max(nilaiMin, Math.min(nilaiMax, val));
              arr.push(val);
            }

            const targetSum = jumlahAngka * targetRataRata;
            for (let iter = 0; iter < 200; iter++) {
              const currentSum = arr.reduce((a, b) => a + b, 0);
              const diff = targetSum - currentSum;
              if (Math.abs(diff) < 1e-9) break;

              const step = diff / jumlahAngka;
              let possibleToAdjust = false;
              for (let i = 0; i < jumlahAngka; i++) {
                const oldVal = arr[i];
                const newVal = Math.max(nilaiMin, Math.min(nilaiMax, oldVal + step));
                if (newVal !== oldVal) possibleToAdjust = true;
                arr[i] = newVal;
              }
              if (!possibleToAdjust) break;
            }

            let formatted = arr.map(v => parseFloat(v.toFixed(jumlahDigit)));

            const factor = Math.pow(10, jumlahDigit);
            const stepVal = 1 / factor;
            const targetSumInt = Math.round(targetSum * factor);
            let currentSumInt = Math.round(formatted.reduce((a, b) => a + b, 0) * factor);
            let diffInt = targetSumInt - currentSumInt;

            let indices = Array.from({ length: jumlahAngka }, (_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [indices[i], indices[j]] = [indices[j], indices[i]];
            }

            let ptr = 0;
            let maxAttempts = 10000;
            while (diffInt !== 0 && maxAttempts > 0) {
              maxAttempts--;
              const idx = indices[ptr % jumlahAngka];
              ptr++;
              if (diffInt > 0) {
                if (formatted[idx] + stepVal <= nilaiMax + 1e-9) {
                  formatted[idx] = parseFloat((formatted[idx] + stepVal).toFixed(jumlahDigit));
                  diffInt--;
                }
              } else if (diffInt < 0) {
                if (formatted[idx] - stepVal >= nilaiMin - 1e-9) {
                  formatted[idx] = parseFloat((formatted[idx] - stepVal).toFixed(jumlahDigit));
                  diffInt++;
                }
              }
            }

            hasilAngka = formatted.map(v => v.toFixed(jumlahDigit));
          }

          generatedNumbers = [...hasilAngka];

          const numericArr = hasilAngka.map(Number);
          const totalSum = numericArr.reduce((a, b) => a + b, 0);
          const rataRata = totalSum / jumlahAngka;

          let nilaiMinHasil = numericArr[0];
          let nilaiMaxHasil = numericArr[0];
          for (let j = 1; j < numericArr.length; j++) {
            if (numericArr[j] < nilaiMinHasil) nilaiMinHasil = numericArr[j];
            if (numericArr[j] > nilaiMaxHasil) nilaiMaxHasil = numericArr[j];
          }

          hasilRataRataContainer.innerHTML = hasTarget ? `${rataRata.toFixed(jumlahDigit)} <span class="text-[9px] text-violet-500 font-bold bg-violet-500/10 px-1 py-0.5 rounded border border-violet-500/20">🎯 Target</span>` : rataRata.toFixed(jumlahDigit);
          hasilMinContainer.textContent = nilaiMinHasil.toFixed(jumlahDigit);
          hasilMaxContainer.textContent = nilaiMaxHasil.toFixed(jumlahDigit);

          hasilContainer.innerHTML = '';
          hasilAngka.forEach((angka, index) => {
            const item = document.createElement('div');
            item.className = 'flex items-center justify-between p-1.5 bg-white dark:bg-slate-900 rounded-lg border border-slate-200 dark:border-slate-800 shadow-xs';
            item.innerHTML = `<span class="text-slate-400 text-[10px]">${index + 1}.</span><span class="font-bold text-slate-700 dark:text-slate-200">${angka}</span>`;
            hasilContainer.appendChild(item);
          });

          if (generatedNumbers.length > 0) {
            tombolSalin.classList.remove('hidden');
            tombolUnduh.classList.remove('hidden');
          }
        });

        document.getElementById('tombolReset').addEventListener('click', function () {
          document.getElementById('nilaiTerkecil').value = '';
          document.getElementById('nilaiTerbesar').value = '';
          document.getElementById('banyaknya').value = '';
          document.getElementById('jumlahDigit').value = '';
          document.getElementById('targetRataRata').value = '';
          document.getElementById('hasilFooter').classList.add('hidden');
          generatedNumbers = [];
        });

        document.getElementById('tombolSalin').addEventListener('click', function () {
          if (generatedNumbers.length === 0) return;
          const textToCopy = generatedNumbers.join('\n');
          copyToClipboard(textToCopy).then(() => {
            this.innerHTML = `Disalin!`;
            this.classList.add('bg-emerald-500', 'text-white');
            setTimeout(() => {
              this.innerHTML = `<svg class="w-3 h-3 text-slate-400 dark:text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg> Salin`;
              this.classList.remove('bg-emerald-500', 'text-white');
            }, 2000);
          }).catch(err => {
            alert('Gagal menyalin teks.');
          });
        });

        document.getElementById('tombolUnduh').addEventListener('click', function () {
          if (generatedNumbers.length === 0) return;
          const data = [
            ["No", "Angka"],
            ...generatedNumbers.map((angka, index) => [index + 1, parseFloat(angka)])
          ];
          const ws = XLSX.utils.aoa_to_sheet(data);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, "Hasil Angka");
          XLSX.writeFile(wb, "HasilGenerateAngka.xlsx");
        });

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        function updateThemeIcons() {
            if (document.documentElement.classList.contains('dark')) {
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
            } else {
                themeToggleLightIcon.classList.add('hidden');
                themeToggleDarkIcon.classList.remove('hidden');
            }
        }
        updateThemeIcons();

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
                updateThemeIcons();
            });
        }
    });
    </script>
</body>
</html>
