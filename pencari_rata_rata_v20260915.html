    <!-- JavaScript Code -->
    <script>
        // ----------------- Dark Mode Controller -----------------
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            if (localStorage.getItem('color-theme') === 'light') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            }
        });

        // ----------------- Tab Navigation -----------------
        function switchTab(tabId) {
            const tabs = ['tab-kalkulator', 'tab-statistik', 'tab-riwayat'];
            tabs.forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('block');
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(tabId).classList.add('block');

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // ----------------- Generator Logic -----------------
        let currentDecimals = 3;
        let currentSeparator = 'id';
        let generatedResults = [];
        let calculationHistory = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadHistoryFromStorage();
            generateNumbers();
        });

        function setDecimalSeparator(sep) {
            currentSeparator = sep;
            const btnId = document.getElementById('btnSepId');
            const btnEn = document.getElementById('btnSepEn');
            
            if (sep === 'id') {
                btnId.className = "px-2 py-1 rounded-lg transition-all duration-200 bg-green-500 text-white shadow-sm font-bold";
                btnEn.className = "px-2 py-1 rounded-lg transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
            } else {
                btnEn.className = "px-2 py-1 rounded-lg transition-all duration-200 bg-green-500 text-white shadow-sm font-bold";
                btnId.className = "px-2 py-1 rounded-lg transition-all duration-200 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white";
            }

            const inputAvg = document.getElementById('inputAverage');
            if (sep === 'id') {
                inputAvg.value = inputAvg.value.replace(/\./g, ',');
            } else {
                inputAvg.value = inputAvg.value.replace(/,/g, '.');
            }

            renderResults();
            updateStatistics();
            renderHistoryTable();
            showToast('Format angka diubah', 'success');
        }

        function adjustCount(delta) {
            const el = document.getElementById('inputCount');
            let val = parseInt(el.value, 10) || 6;
            val = Math.max(2, Math.min(500, val + delta));
            el.value = val;
            generateNumbers();
        }

        function adjustDecimals(delta) {
            const el = document.getElementById('inputDecimals');
            let val = parseInt(el.value, 10) || 3;
            val = Math.max(0, Math.min(10, val + delta));
            el.value = val;
            generateNumbers();
        }

        function updateVarianceLabel() {
            const sel = document.getElementById('inputVariance');
            const badge = document.getElementById('varianceBadge');
            const textMap = { 'low': 'Tipis', 'normal': 'Normal', 'high': 'Lebar', 'wide': 'Sangat Lebar' };
            badge.textContent = textMap[sel.value] || 'Normal';
            generateNumbers();
        }

        function resetForm() {
            document.getElementById('inputAverage').value = currentSeparator === 'id' ? '1,239' : '1.239';
            document.getElementById('inputCount').value = 6;
            document.getElementById('inputDecimals').value = 3;
            document.getElementById('inputVariance').value = 'normal';
            updateVarianceLabel();
            generateNumbers();
            showToast('Form direset ke default', 'info');
        }

        function validateNumberInput(input) {
            input.value = input.value.replace(/[^0-9.,-]/g, '');
        }

        function generateNumbers() {
            const avgStr = document.getElementById('inputAverage').value.trim();
            const count = parseInt(document.getElementById('inputCount').value, 10) || 6;
            const decimals = parseInt(document.getElementById('inputDecimals').value, 10) || 3;
            const varianceType = document.getElementById('inputVariance').value;

            currentDecimals = decimals;
            let parsedAvg = parseFloat(avgStr.replace(/,/g, '.'));
            if (isNaN(parsedAvg)) parsedAvg = 1.239;

            const factor = Math.pow(10, decimals);
            const targetSumInt = Math.round(parsedAvg * factor * count);
            const baseInt = Math.floor(targetSumInt / count);
            const remainder = targetSumInt - (baseInt * count);

            let intArr = new Array(count).fill(baseInt);
            let indices = Array.from({ length: count }, (_, i) => i);
            for (let i = indices.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [indices[i], indices[j]] = [indices[j], indices[i]];
            }
            for (let i = 0; i < remainder; i++) {
                intArr[indices[i]] += 1;
            }

            let maxStep = Math.round(factor * 0.015);
            if (varianceType === 'low') maxStep = Math.max(1, Math.round(factor * 0.004));
            if (varianceType === 'normal') maxStep = Math.max(3, Math.round(factor * 0.025));
            if (varianceType === 'high') maxStep = Math.max(10, Math.round(factor * 0.08));
            if (varianceType === 'wide') maxStep = Math.max(25, Math.round(factor * 0.25));

            const iterations = count * 35;
            for (let k = 0; k < iterations; k++) {
                let idxA = Math.floor(Math.random() * count);
                let idxB = Math.floor(Math.random() * count);
                if (idxA === idxB) continue;
                let delta = Math.floor(Math.random() * maxStep) + 1;
                let targetInt = Math.round(parsedAvg * factor);
                if (intArr[idxA] + delta - targetInt <= maxStep * 1.8 && targetInt - (intArr[idxB] - delta) <= maxStep * 1.8) {
                    intArr[idxA] += delta;
                    intArr[idxB] -= delta;
                }
            }

            generatedResults = intArr.map(val => val / factor);
            renderResults();
            updateStatistics(parsedAvg);
            saveToHistory(parsedAvg, count, decimals);
        }

        function formatNum(num, decimals = currentDecimals) {
            if (isNaN(num)) return "0";
            let str = num.toFixed(decimals);
            if (currentSeparator === 'id') return str.replace(/\./g, ',');
            return str;
        }

        function renderResults() {
            const container = document.getElementById('resultsContainer');
            document.getElementById('badgeCount').textContent = `(${generatedResults.length})`;
            container.innerHTML = '';
            generatedResults.forEach((val, index) => {
                const formatted = formatNum(val, currentDecimals);
                const card = document.createElement('div');
                card.className = "bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-green-500 dark:hover:border-green-500 rounded-xl p-2 cursor-pointer transition-all text-center group active:scale-95 shadow-sm";
                card.onclick = () => copySingleNumber(formatted);
                card.innerHTML = `<div class="text-[9px] font-bold text-slate-400 mb-0.5">#${index + 1}</div><div class="text-xs sm:text-sm font-bold text-slate-800 dark:text-slate-100 group-hover:text-green-500">${formatted}</div>`;
                container.appendChild(card);
            });
        }

        function updateStatistics(targetAvg = parseFloat(document.getElementById('inputAverage').value.replace(/,/g, '.'))) {
            if (generatedResults.length === 0) return;
            const sum = generatedResults.reduce((a, b) => a + b, 0);
            const actualAvg = sum / generatedResults.length;
            const min = Math.min(...generatedResults);
            const max = Math.max(...generatedResults);

            document.getElementById('statTargetAvg').textContent = formatNum(targetAvg, currentDecimals);
            document.getElementById('statActualAvg').textContent = formatNum(actualAvg, currentDecimals);
            document.getElementById('statTotalSum').textContent = formatNum(sum, Math.max(currentDecimals, 2));
            document.getElementById('statMinMax').textContent = `${formatNum(min, currentDecimals)} - ${formatNum(max, currentDecimals)}`;
        }

        // Copy & Export
        function copySingleNumber(text) {
            navigator.clipboard.writeText(text).then(() => showToast(`Berhasil disalin: ${text}`));
        }
        function copyAllVertical() {
            if (generatedResults.length === 0) return;
            const text = generatedResults.map(v => formatNum(v, currentDecimals)).join('\n');
            navigator.clipboard.writeText(text).then(() => showToast(`Disalin baris`));
        }
        function copyAllHorizontal() {
            if (generatedResults.length === 0) return;
            const separator = currentSeparator === 'id' ? '; ' : ', ';
            const text = generatedResults.map(v => formatNum(v, currentDecimals)).join(separator);
            navigator.clipboard.writeText(text).then(() => showToast(`Disalin mendatar`));
        }
        function exportToExcel() {
            if (generatedResults.length === 0) return;
            const targetAvg = document.getElementById('inputAverage').value;
            const data = generatedResults.map((val, i) => ({
                "No": i + 1, "Angka Hasil": formatNum(val, currentDecimals), "Raw": val
            }));
            const worksheet = XLSX.utils.json_to_sheet(data);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Hasil");
            XLSX.writeFile(workbook, `AveragePro_${targetAvg}.xlsx`);
            showToast(`Excel berhasil diekspor`);
        }

        // History
        function saveToHistory(targetAvg, count, decimals) {
            const entry = {
                id: Date.now(),
                time: new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                targetAvg, count, decimals, results: [...generatedResults]
            };
            calculationHistory.unshift(entry);
            if (calculationHistory.length > 15) calculationHistory.pop();
            localStorage.setItem('avgpro_history_v2', JSON.stringify(calculationHistory));
            renderHistoryTable();
        }
        function loadHistoryFromStorage() {
            const stored = localStorage.getItem('avgpro_history_v2');
            if (stored) {
                calculationHistory = JSON.parse(stored);
                renderHistoryTable();
            }
        }
        function renderHistoryTable() {
            const tbody = document.getElementById('historyTableBody');
            if (calculationHistory.length === 0) {
                tbody.innerHTML = '<tr><td colSpan="3" class="text-center py-4 text-slate-400 italic">Belum ada riwayat.</td></tr>';
                return;
            }
            tbody.innerHTML = '';
            calculationHistory.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-100 dark:hover:bg-slate-800/40 transition-colors";
                tr.innerHTML = `
                    <td class="py-2 px-2 text-slate-500">${item.time}</td>
                    <td class="py-2 px-2 font-bold text-green-600 dark:text-green-400">${formatNum(item.targetAvg, item.decimals)}</td>
                    <td class="py-2 px-2 text-right">
                        <button onclick="reloadHistory(${item.id})" class="px-2 py-1 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 rounded text-slate-700 dark:text-slate-300">Muat</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }
        function reloadHistory(id) {
            const found = calculationHistory.find(x => x.id === id);
            if (!found) return;
            document.getElementById('inputAverage').value = formatNum(found.targetAvg, found.decimals);
            document.getElementById('inputCount').value = found.count;
            document.getElementById('inputDecimals').value = found.decimals;
            currentDecimals = found.decimals;
            generatedResults = [...found.results];
            renderResults();
            updateStatistics(found.targetAvg);
            switchTab('tab-kalkulator');
            showToast('Riwayat dimuat');
        }
        function clearHistory() {
            if (confirm('Hapus seluruh riwayat?')) {
                calculationHistory = [];
                localStorage.removeItem('avgpro_history_v2');
                renderHistoryTable();
            }
        }

        // Toast
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-2 rounded-xl bg-slate-900 dark:bg-slate-100 text-white dark:text-slate-900 shadow-xl text-xs font-bold transition-all transform scale-95 opacity-0`;
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('scale-95', 'opacity-0');
                toast.classList.add('scale-100', 'opacity-100');
            });
            setTimeout(() => {
                toast.classList.remove('scale-100', 'opacity-100');
                toast.classList.add('scale-95', 'opacity-0');
                setTimeout(() => { if (toast.parentNode) container.removeChild(toast); }, 300);
            }, 2000);
        }
    </script>
</body>
</html>
