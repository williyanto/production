<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator Persentase Pro v20260915</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
  <style>
    .scrollbar-none::-webkit-scrollbar {
      display: none;
    }
    .scrollbar-none {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-[100dvh] w-full flex flex-col justify-center items-center py-2 px-3 bg-slate-950 text-slate-100 font-sans relative overflow-hidden select-none">

  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
  <!-- Ambient Glow Background -->
  <div class="absolute -top-20 -left-20 w-72 h-72 bg-amber-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-20 -right-20 w-72 h-72 bg-orange-500/20 rounded-full blur-3xl pointer-events-none"></div>

  
</div>

  <!-- Main Card Component -->
  <div class="w-full max-w-md max-h-[calc(100dvh-1rem)] mx-auto flex flex-col my-auto bg-slate-900/85 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-3 sm:p-4 shadow-2xl overflow-hidden relative z-10">

    <!-- Header Section (Shrink-0) -->
    <div class="shrink-0">
      <div class="flex items-center justify-between mb-3 border-b border-slate-800/80 pb-2.5">
        <div class="flex items-center gap-2.5">
          <div class="p-2 bg-amber-500/10 rounded-xl text-amber-400 border border-amber-500/20">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-bold text-slate-100 leading-tight">Kalkulator Persentase</h1>
            <p class="text-xs text-slate-400">Quick Percent & Markup</p>
          </div>
        </div>
        <span class="text-[10px] font-semibold tracking-wider text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-full border border-amber-500/20">v20260915</span>
      </div>
    </div>

    <!-- Inputs & Results Area (Scrollable Flex-1) -->
    <div class="flex-1 overflow-y-auto scrollbar-none py-1 space-y-3">
      <div class="space-y-3 mb-4">
        <!-- Main Value Input -->
        <div class="group relative">
          <label for="mainNumber" class="block text-xs font-medium text-slate-300 mb-1">Angka Utama (Nilai)</label>
          <div class="relative flex items-center">
            <span class="absolute left-3 text-slate-400 group-focus-within:text-amber-400 transition-colors duration-200">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </span>
            <input type="text" inputmode="decimal" id="mainNumber" oninput="calculate()" placeholder="Contoh: 1000" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl py-2.5 pl-9 pr-3 text-sm font-semibold text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all duration-200">
          </div>
        </div>

        <!-- Quick Percent Buttons Grid -->
        <div>
          <label class="block text-xs font-medium text-slate-300 mb-1.5">Pilih Persentase Cepat</label>
          <div id="btnGroup" class="grid grid-cols-5 gap-1.5"></div>
        </div>

        <!-- Custom Percent Input -->
        <div class="group relative">
          <label for="percentInput" class="block text-xs font-medium text-slate-300 mb-1">Custom Persen (%)</label>
          <div class="relative flex items-center">
            <span class="absolute left-3 text-slate-400 group-focus-within:text-amber-400 transition-colors duration-200">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14"/>
              </svg>
            </span>
            <input type="text" inputmode="decimal" id="percentInput" oninput="calculate()" placeholder="Masukkan %" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl py-2.5 pl-9 pr-3 text-sm font-semibold text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all duration-200">
          </div>
        </div>

        <!-- Unit Selection -->
        <div class="group relative">
          <label for="unitSelect" class="block text-xs font-medium text-slate-300 mb-1">Satuan Hasil (Opsional)</label>
          <div class="relative flex items-center">
            <select id="unitSelect" onchange="calculate()" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl py-2.5 px-3 text-sm font-semibold text-slate-100 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all duration-200 appearance-none">
              <option value="">-- Tanpa Satuan --</option>
              <option value=" m">Panjang (Meter - m)</option>
              <option value=" kg">Berat (Kilogram - kg)</option>
              <option value=" liter">Volume (Liter)</option>
              <option value=" pcs">Barang (Pieces - pcs)</option>
              <option value=" jam">Waktu (Jam)</option>
              <option value="Rp ">Mata Uang (Rupiah - Rp)</option>
            </select>
            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Results Display Cards Grid -->
      <div class="grid grid-cols-3 gap-2 mb-2 text-center">
        <!-- Pure Value -->
        <div class="bg-amber-950/40 border border-amber-500/30 rounded-xl p-2.5">
          <span class="block text-[10px] text-amber-400 font-semibold mb-0.5 uppercase tracking-wide">Nilai Persen</span>
          <span id="pureVal" class="text-xs sm:text-sm font-extrabold text-amber-300 block truncate">0</span>
        </div>
        <!-- Down Value -->
        <div class="bg-rose-950/40 border border-rose-500/30 rounded-xl p-2.5">
          <span class="block text-[10px] text-rose-400 font-semibold mb-0.5 uppercase tracking-wide">Hasil (-%)</span>
          <span id="downVal" class="text-xs sm:text-sm font-extrabold text-rose-300 block truncate">0</span>
        </div>
        <!-- Up Value -->
        <div class="bg-emerald-950/40 border border-emerald-500/30 rounded-xl p-2.5">
          <span class="block text-[10px] text-emerald-400 font-semibold mb-0.5 uppercase tracking-wide">Hasil (+%)</span>
          <span id="upVal" class="text-xs sm:text-sm font-extrabold text-emerald-300 block truncate">0</span>
        </div>
      </div>
    </div>

    <!-- Bottom Actions & Footer (Shrink-0) -->
    <div class="shrink-0 mt-2">
      <div class="grid grid-cols-3 gap-2 mb-3">
        <button onclick="if(window.top!==window.self&&window.parent.closePreviewModal){window.parent.closePreviewModal();}else{history.back();}" class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-300 font-medium text-xs rounded-xl transition-all duration-150 border border-slate-700/50 shadow-sm">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Kembali
        </button>
        <button type="button" id="hapusBtn" onclick="document.getElementById('mainNumber').value=''; document.getElementById('percentInput').value=''; document.getElementById('unitSelect').value=''; calculate();" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-transparent rounded-xl text-xs font-bold text-white bg-rose-500/90 hover:bg-rose-600 active:scale-95 transition-all shadow-md">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
          Hapus
        </button>
        <a href="index.html" target="_top" class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-amber-600/90 hover:bg-amber-500 active:scale-95 text-white font-medium text-xs rounded-xl transition-all duration-150 shadow-lg shadow-amber-600/20">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Beranda
        </a>
      </div>

      
    </div>

  
        <!-- Footer -->
        <footer class="text-center text-slate-400 dark:text-slate-600 text-[10px] mt-4 pt-3 pb-2 border-t border-slate-200 dark:border-slate-800 font-medium no-print">
            Williyanto Adi 2026
        </footer>

</div>

  <script>
    const btnGroup = document.getElementById('btnGroup');
    const percents = [5, 10, 15, 20, 25, 30, 35, 40, 45, 50];

    percents.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'py-1.5 px-1 bg-slate-950/60 hover:bg-amber-600 hover:text-white border border-slate-800 active:scale-95 text-amber-400 font-bold text-xs rounded-lg transition-all duration-150 text-center';
      btn.innerText = p + '%';
      btn.onclick = () => {
        document.getElementById('percentInput').value = p;
        calculate();
      };
      btnGroup.appendChild(btn);
    });

    function calculate() {
      let mainStr = document.getElementById('mainNumber').value.replace(/,/g, '.');
      let percentStr = document.getElementById('percentInput').value.replace(/,/g, '.');
      let unit = document.getElementById('unitSelect').value;

      const num = parseFloat(mainStr);
      const percent = parseFloat(percentStr);

      const pureDisplay = document.getElementById('pureVal');
      const downDisplay = document.getElementById('downVal');
      const upDisplay = document.getElementById('upVal');
      
      const formatVal = (val) => {
        let str = val.toLocaleString('id-ID', { maximumFractionDigits: 4 });
        if (unit) {
          if (unit === 'Rp ') return unit + str;
          return str + unit;
        }
        return str;
      };

      if (!isNaN(num) && !isNaN(percent)) {
        const fraction = (percent / 100) * num;
        pureDisplay.innerText = formatVal(fraction);
        downDisplay.innerText = formatVal(num - fraction);
        upDisplay.innerText = formatVal(num + fraction);
      } else {
        pureDisplay.innerText = '0';
        downDisplay.innerText = '0';
        upDisplay.innerText = '0';
      }
    }
  </script>
</body>
</html>
