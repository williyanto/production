<!DOCTYPE html>
<html lang="id" class="transition-all duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Panjang Kabel dalam Drum - CableMetrics</title>
    <link rel="icon" type="image/png" href="../icons/williyanto_logo_rounded.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        /* Sembunyikan scrollbar agar tampilan sleek layaknya native app */
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        select {
            background-image: none !important;
        }
    </style>
</head>
<body class="bg-gradient-to-tr from-slate-100 via-blue-50/30 to-slate-100 dark:from-slate-950 dark:via-slate-900/80 dark:to-slate-950 min-h-[100dvh] flex flex-col justify-center items-center py-2 px-3 overflow-x-hidden transition-colors duration-300">

    <!-- Ambient Background Glow (Glow Effect yang menghidupkan suasana) -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-50 dark:opacity-20 hidden md:block">
        <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-blue-500 blur-[120px] animate-pulse"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-indigo-500 blur-[120px] animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <!-- Main Card Container: Zero-Scroll & Dynamic Viewport Height (100dvh) -->
    <div class="w-full max-w-md mx-auto bg-white/95 dark:bg-slate-900/90 backdrop-blur-xl rounded-3xl border border-slate-200/60 dark:border-slate-800/80 shadow-2xl shadow-blue-500/5 dark:shadow-none p-4 sm:p-5 transition-all duration-300 flex flex-col max-h-[calc(100dvh-1rem)] my-auto overflow-hidden">
        
        <!-- Header Section (Locked at top) -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/25 dark:shadow-none">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-extrabold text-slate-800 dark:text-slate-100 tracking-tight leading-tight">Panjang Kabel di Drum</h1>
                    <p class="text-[11px] text-blue-600 dark:text-blue-400 font-semibold tracking-wider uppercase">CableMetrics Pro</p>
                </div>
            </div>
            
            <!-- Dark Mode Toggle Button -->
            <button id="theme-toggle" type="button" aria-label="Toggle Dark Mode" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700/60 hover:bg-slate-200/70 dark:hover:bg-slate-750 active:scale-95 transition-all text-slate-600 dark:text-slate-300">
                <svg id="theme-toggle-dark-icon" class="w-4 h-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <svg id="theme-toggle-light-icon" class="w-4 h-4 text-amber-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
                </svg>
            </button>
        </div>

        <!-- Scrollable Form & Interactive Area (Middle) -->
        <div class="flex-1 overflow-y-auto scrollbar-none py-3 space-y-4">
            
            <!-- Toggle Input Drum Mode (Segmented Button) -->
            <div class="p-1 bg-slate-100 dark:bg-slate-800/80 rounded-2xl border border-slate-200/40 dark:border-slate-700/40 flex">
                <button type="button" id="btnDiameter" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all duration-200 bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm border border-slate-200/50 dark:border-slate-600/30 flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M9 9l6 6" /></svg>
                    Diameter Drum
                </button>
                <button type="button" id="btnKeliling" class="flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 flex items-center justify-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    Keliling Drum
                </button>
            </div>

            <!-- Group 1: Dimensi Drum & Kabel -->
            <div class="space-y-3">
                <span class="text-[11px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest block">Parameter Drum & Kabel</span>
                
                <!-- Diameter / Keliling Drum Input -->
                <div id="groupDiameter" class="relative group transition-all">
                    <label for="diameterDrum" class="block text-[11px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Diameter Drum (Meter)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-blue-600 dark:group-focus-within:text-blue-400 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
                        </div>
                        <input type="text" inputmode="decimal" id="diameterDrum" class="pl-10 block w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-xs font-bold" placeholder="Contoh: 1.25">
                    </div>
                </div>

                <div id="groupKeliling" class="relative group transition-all hidden">
                    <label for="kelilingDrum" class="block text-[11px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Keliling Drum (Meter)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-blue-600 dark:group-focus-within:text-blue-400 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                        </div>
                        <input type="text" inputmode="decimal" id="kelilingDrum" class="pl-10 block w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-xs font-bold" placeholder="Contoh: 3.92">
                    </div>
                </div>

                <!-- Lebar Drum + Satuan -->
                <div class="relative group">
                    <label for="lebarDrum" class="block text-[11px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Lebar Drum</label>
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-blue-600 dark:group-focus-within:text-blue-400 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                            </div>
                            <input type="text" inputmode="decimal" id="lebarDrum" class="pl-10 block w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-xs font-bold" placeholder="Contoh: 0.85">
                        </div>
                        <select id="satuanLebarDrum" class="w-24 px-3 py-2.5 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-200 text-xs font-bold text-center focus:outline-none focus:ring-2 focus:ring-blue-500/20 cursor-pointer">
                            <option value="m" selected>meter</option>
                            <option value="cm">cm</option>
                            <option value="mm">mm</option>
                        </select>
                    </div>
                </div>

                <!-- Diameter Kabel + Satuan -->
                <div class="relative group">
                    <label for="nilaiDiameterKabel" class="block text-[11px] font-bold text-slate-600 dark:text-slate-300 uppercase tracking-wider mb-1">Diameter Kabel</label>
                    <div class="flex gap-2">
                        <div class="relative flex-1">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-blue-600 dark:group-focus-within:text-blue-400 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                            </div>
                            <input type="text" inputmode="decimal" id="nilaiDiameterKabel" class="pl-10 block w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-xs font-bold" placeholder="Contoh: 25">
                        </div>
                        <select id="satuanDiameterKabel" class="w-24 px-3 py-2.5 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-slate-800 dark:text-slate-200 text-xs font-bold text-center focus:outline-none focus:ring-2 focus:ring-blue-500/20 cursor-pointer">
                            <option value="mm" selected>mm</option>
                            <option value="cm">cm</option>
                            <option value="m">m</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Group 2: Opsi Estimasi Tambahan -->
            <div class="space-y-3 pt-2 border-t border-slate-100 dark:border-slate-800/60">
                <span class="text-[11px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest block">Opsi Estimasi Spesifik (Opsional)</span>
                
                <div class="grid grid-cols-2 gap-3">
                    <!-- Hitung Hingga Lilitan Ke- -->
                    <div class="relative group">
                        <label for="lilitanTanda" class="block text-[11px] font-bold text-slate-600 dark:text-slate-300 tracking-tight mb-1 truncate" title="Hitung Hingga Lilitan Ke-">Lilitan Ke-</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-indigo-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7 20l4-16m2 16l4-16M6 9h14M4 15h14" /></svg>
                            </div>
                            <input type="number" inputmode="numeric" min="1" id="lilitanTanda" class="pl-9 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-xs font-semibold" placeholder="Opsional">
                        </div>
                        <p class="text-[9px] text-slate-400 dark:text-slate-500 mt-1">Kosongkan utk default.</p>
                    </div>

                    <!-- Hitung Total Layer Penuh -->
                    <div class="relative group">
                        <label for="jumlahLayer" class="block text-[11px] font-bold text-slate-600 dark:text-slate-300 tracking-tight mb-1 truncate" title="Hitung Total Layer Penuh">Total Layer</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-indigo-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                            </div>
                            <input type="number" inputmode="numeric" min="1" id="jumlahLayer" class="pl-9 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800/70 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-xs font-semibold" placeholder="Opsional">
                        </div>
                        <p class="text-[9px] text-slate-400 dark:text-slate-500 mt-1">Kosongkan utk 1 layer.</p>
                    </div>
                </div>
            </div>

            <!-- Papan Hasil Reaktif (Dynamic Output Cards) -->
            <div id="hasil" class="space-y-2 pt-1 transition-all duration-300"></div>

        </div>

        <!-- Menu Tombol & Footer (Fixed at Bottom inside main container) -->
        <div class="pt-3 border-t border-slate-100 dark:border-slate-800/80 shrink-0 space-y-2.5 text-center">
            <button type="button" id="btnReset" class="w-full py-2.5 px-4 rounded-xl font-bold text-xs bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200/80 dark:hover:bg-slate-750 active:scale-95 transition-all flex items-center justify-center gap-1.5 shadow-sm">
                <svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                Reset Form
            </button>
            <span class="text-[10px] font-semibold text-slate-400 dark:text-slate-500 tracking-wider block">&copy; Williyanto Adi 2026</span>
        </div>

    </div>

    <script>
        // --- sistem reaktivitas bebas dependensi (Vanilla JS) ---
        let modeInput = 'diameter'; // 'diameter' atau 'keliling'

        const btnDiameter = document.getElementById('btnDiameter');
        const btnKeliling = document.getElementById('btnKeliling');
        const groupDiameter = document.getElementById('groupDiameter');
        const groupKeliling = document.getElementById('groupKeliling');
        const diameterDrumInput = document.getElementById('diameterDrum');
        const kelilingDrumInput = document.getElementById('kelilingDrum');
        const lebarDrumInput = document.getElementById('lebarDrum');
        const satuanLebarDrum = document.getElementById('satuanLebarDrum');
        const nilaiDiameterKabelInput = document.getElementById('nilaiDiameterKabel');
        const satuanDiameterKabel = document.getElementById('satuanDiameterKabel');
        const lilitanTandaInput = document.getElementById('lilitanTanda');
        const jumlahLayerInput = document.getElementById('jumlahLayer');
        const hasilDiv = document.getElementById('hasil');
        const btnReset = document.getElementById('btnReset');

        // Fungsi parsing input dengan penukaran tanda koma (',') menjadi titik ('.')
        function parseVal(inputElement) {
            if (!inputElement || !inputElement.value) return NaN;
            const cleaned = inputElement.value.replace(/,/g, '.').trim();
            return parseFloat(cleaned);
        }

        function setMode(newMode) {
            modeInput = newMode;
            if (modeInput === 'diameter') {
                groupDiameter.classList.remove('hidden');
                groupKeliling.classList.add('hidden');
                btnDiameter.className = "flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all duration-200 bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm border border-slate-200/50 dark:border-slate-600/30 flex items-center justify-center gap-1.5";
                btnKeliling.className = "flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 flex items-center justify-center gap-1.5";
            } else {
                groupDiameter.classList.add('hidden');
                groupKeliling.classList.remove('hidden');
                btnKeliling.className = "flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all duration-200 bg-white dark:bg-slate-700 text-blue-600 dark:text-blue-400 shadow-sm border border-slate-200/50 dark:border-slate-600/30 flex items-center justify-center gap-1.5";
                btnDiameter.className = "flex-1 py-2 px-3 rounded-xl text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 flex items-center justify-center gap-1.5";
            }
            hitungPanjang();
        }

        btnDiameter.addEventListener('click', () => setMode('diameter'));
        btnKeliling.addEventListener('click', () => setMode('keliling'));

        // Helper fungsi UI Kartu Alert Hasil
        function makeAlert(type, title, message) {
            const styles = {
                error: 'bg-red-50 dark:bg-red-500/10 border-red-200 dark:border-red-500/30 text-red-700 dark:text-red-400',
                info: 'bg-blue-50 dark:bg-blue-500/10 border-blue-200 dark:border-blue-500/30 text-blue-800 dark:text-blue-300',
                success: 'bg-emerald-50 dark:bg-emerald-500/10 border-emerald-200 dark:border-emerald-500/30 text-emerald-800 dark:text-emerald-300',
                warning: 'bg-amber-50 dark:bg-amber-500/10 border-amber-200 dark:border-amber-500/30 text-amber-800 dark:text-amber-300'
            };
            const icons = {
                error: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />',
                info: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />',
                success: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />',
                warning: '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />'
            };

            return `
                <div class="p-3.5 rounded-2xl border ${styles[type]} shadow-sm flex items-start gap-3 transition-all duration-200 animate-fadeIn">
                    <svg class="w-5 h-5 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">${icons[type]}</svg>
                    <div class="flex-1 text-xs">
                        <span class="font-extrabold block mb-0.5 text-sm">${title}</span>
                        <div class="leading-relaxed font-medium opacity-90">${message}</div>
                    </div>
                </div>
            `;
        }

        function hitungPanjang() {
            const lebarDrumNilai = parseVal(lebarDrumInput);
            const nilaiDiameterKabel = parseVal(nilaiDiameterKabelInput);
            const lilitanVal = lilitanTandaInput.value ? parseInt(lilitanTandaInput.value) : NaN;
            const layerVal = jumlahLayerInput.value ? parseInt(jumlahLayerInput.value) : NaN;

            let diameterDrum = modeInput === 'diameter' ? parseVal(diameterDrumInput) : parseVal(kelilingDrumInput) / Math.PI;

            // Bersihkan hasil sebelumnya
            hasilDiv.innerHTML = "";

            // Proteksi nilai kosong atau belum terisi
            if (isNaN(diameterDrum) || isNaN(lebarDrumNilai) || isNaN(nilaiDiameterKabel)) {
                if (diameterDrumInput.value || kelilingDrumInput.value || lebarDrumInput.value || nilaiDiameterKabelInput.value) {
                    hasilDiv.innerHTML = makeAlert('info', 'Siaga Menghitung', 'Silakan lengkapi parameter Dimensi Drum dan Diameter Kabel untuk melihat estimasi.');
                }
                return;
            }

            if (diameterDrum <= 0 || lebarDrumNilai <= 0 || nilaiDiameterKabel <= 0) {
                hasilDiv.innerHTML = makeAlert('error', 'Input Tidak Valid', 'Pastikan semua nilai dimensi bernilai positif (lebih besar dari nol).');
                return;
            }

            // Konversi Satuan Lebar Drum ke Meter
            let lebarDrumMeter = lebarDrumNilai;
            if (satuanLebarDrum.value === "cm") lebarDrumMeter /= 100;
            if (satuanLebarDrum.value === "mm") lebarDrumMeter /= 1000;

            // Konversi Satuan Diameter Kabel ke Meter
            let diameterKabelMeter = nilaiDiameterKabel;
            if (satuanDiameterKabel.value === "mm") diameterKabelMeter /= 1000;
            if (satuanDiameterKabel.value === "cm") diameterKabelMeter /= 100;

            // Hitung kapasitas maksimal lilitan per layer terlebih dahulu (satu kali hitung untuk semua mode)
            const jumlahLilitanPerLayer = Math.floor(lebarDrumMeter / diameterKabelMeter);
            if (jumlahLilitanPerLayer <= 0) {
                hasilDiv.innerHTML = makeAlert('error', 'Kapasitas Drum Tidak Cukup', 'Diameter kabel melebihi lebar drum yang tersedia. Kabel tidak dapat digulung.');
                return;
            }

            let hasOutput = false;

            // 1. Hitung panjang hingga lilitan ke-X (mengelompokkan ke layer yang tepat)
            if (lilitanTandaInput.value !== "") {
                if (!isNaN(lilitanVal) && lilitanVal > 0) {
                    let panjangKabelTanda = 0;
                    for (let i = 1; i <= lilitanVal; i++) {
                        const currentLayer = Math.ceil(i / jumlahLilitanPerLayer);
                        const diameterLilitan = diameterDrum + (2 * currentLayer - 1) * diameterKabelMeter;
                        panjangKabelTanda += Math.PI * diameterLilitan;
                    }
                    const layerAkhir = Math.ceil(lilitanVal / jumlahLilitanPerLayer);
                    hasilDiv.innerHTML += makeAlert('info', `Panjang Hingga Lilitan Ke-${lilitanVal}`, `Perkiraan panjang ${lilitanVal} lilitan (mencapai <strong class="text-blue-700 dark:text-blue-300">Layer ke-${layerAkhir}</strong>) sekitar <span class="font-black text-sm text-blue-600 dark:text-blue-400 underline decoration-2">${panjangKabelTanda.toFixed(2)} meter</span>.`);
                    hasOutput = true;
                } else {
                    hasilDiv.innerHTML += makeAlert('warning', 'Peringatan Lilitan', 'Nilai lilitan yang terisi tidak valid (harus angka positif).');
                }
            }

            // 2. Hitung panjang total untuk N layer penuh
            if (jumlahLayerInput.value !== "") {
                if (!isNaN(layerVal) && layerVal > 0) {
                    let panjangTotalKabel = 0;
                    for (let layer = 1; layer <= layerVal; layer++) {
                        const diameterLayer = diameterDrum + (2 * layer - 1) * diameterKabelMeter;
                        const panjangLayer = jumlahLilitanPerLayer * (Math.PI * diameterLayer);
                        panjangTotalKabel += panjangLayer;
                    }
                    hasilDiv.innerHTML += makeAlert('success', `Estimasi ${layerVal} Layer Penuh`, `Total kapasitas kabel untuk ${layerVal} layer (±${jumlahLilitanPerLayer} lilitan/layer) sekitar <span class="font-black text-sm text-emerald-600 dark:text-emerald-400 underline decoration-2">${panjangTotalKabel.toFixed(2)} meter</span>.`);
                    hasOutput = true;
                } else {
                    hasilDiv.innerHTML += makeAlert('warning', 'Peringatan Layer', 'Jumlah layer yang dimasukkan tidak valid.');
                }
            }

            // 3. Jika kedua input spesifik kosong, tampilkan estimasi default (1 Layer Penuh)
            if (!hasOutput && !lilitanTandaInput.value && !jumlahLayerInput.value) {
                const diameterLayer1 = diameterDrum + diameterKabelMeter;
                const panjangSatuLayer = jumlahLilitanPerLayer * (Math.PI * diameterLayer1);
                hasilDiv.innerHTML = makeAlert('info', 'Estimasi Default (1 Layer Penuh)', `Kapasitas 1 layer drum (±${jumlahLilitanPerLayer} lilitan sejajar horizontal) menampung sekitar <span class="font-black text-sm text-blue-600 dark:text-blue-400 underline decoration-2">${panjangSatuLayer.toFixed(2)} meter</span> kabel.`);
            }
        }

        // Pasang pendengar event real-time (Reactive)
        [diameterDrumInput, kelilingDrumInput, lebarDrumInput, nilaiDiameterKabelInput, lilitanTandaInput, jumlahLayerInput].forEach(el => {
            el.addEventListener('input', hitungPanjang);
        });
        [satuanLebarDrum, satuanDiameterKabel].forEach(el => {
            el.addEventListener('change', hitungPanjang);
        });

        // Reset Tombol
        btnReset.addEventListener('click', () => {
            [diameterDrumInput, kelilingDrumInput, lebarDrumInput, nilaiDiameterKabelInput, lilitanTandaInput, jumlahLayerInput].forEach(el => el.value = '');
            satuanLebarDrum.value = 'm';
            satuanDiameterKabel.value = 'mm';
            hasilDiv.innerHTML = '';
            setMode('diameter');
        });

        // --- Dark Mode System (LocalStorage + System Preference) ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function updateIcons(isDark) {
            if (isDark) {
                darkIcon.classList.add('hidden');
                lightIcon.classList.remove('hidden');
            } else {
                lightIcon.classList.add('hidden');
                darkIcon.classList.remove('hidden');
            }
        }

        function initTheme() {
            const isDark = localStorage.getItem('theme') === 'dark' || 
                (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
            updateIcons(isDark);
        }

        themeToggleBtn.addEventListener('click', function() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateIcons(isDark);
        });

        // Inisialisasi awal
        initTheme();
        setMode('diameter');
    </script>
</body>
</html>
