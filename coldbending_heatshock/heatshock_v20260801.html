<body class="min-h-[100dvh] w-full flex items-center justify-center p-3 sm:p-4 bg-slate-950 text-slate-100 font-sans relative overflow-hidden select-none">

    <div>
      <div class="flex items-center justify-between mb-4 border-b border-slate-800/80 pb-3">
        <div class="flex items-center gap-2.5">
          <div class="p-2 bg-amber-500/10 rounded-xl text-amber-400 border border-amber-500/20">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-bold text-slate-100 leading-tight">Pengujian Heatshock</h1>
            <p class="text-xs text-slate-400">Kalkulator Ukuran Mandrel</p>
          </div>
        </div>
        <span class="text-[10px] font-semibold tracking-wider text-amber-400 bg-amber-500/10 px-2.5 py-1 rounded-full border border-amber-500/20">v20260801</span>
      </div>

      <!-- Input Section -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4">
        <!-- Diameter Input -->
        <div class="group relative">
          <label for="diameterKabel" class="block text-xs font-medium text-slate-300 mb-1">Diameter Kabel (mm)</label>
          <div class="relative flex items-center">
            <span class="absolute left-3 text-slate-400 group-focus-within:text-amber-400 transition-colors duration-200">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
              </svg>
            </span>
            <input type="text" inputmode="decimal" id="diameterKabel" oninput="updatePerkalian()" placeholder="0.00" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl py-2.5 pl-9 pr-3 text-sm font-semibold text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-all duration-200">
          </div>
        </div>

        <!-- Mandrel Output -->
        <div class="relative">
          <label for="manrel" class="block text-xs font-medium text-slate-300 mb-1">Ukuran Mandrel</label>
          <div class="relative flex items-center">
            <span class="absolute left-3 text-emerald-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
              </svg>
            </span>
            <input type="text" id="manrel" readonly placeholder="---" class="w-full bg-emerald-950/20 border border-emerald-500/30 rounded-xl py-2.5 pl-9 pr-3 text-sm font-bold text-emerald-400 placeholder-slate-600 focus:outline-none cursor-default">
          </div>
        </div>
      </div>

      <!-- Live Formula Note -->
      <div class="bg-slate-950/50 border border-slate-800/80 rounded-xl p-3 mb-4 text-center">
        <span id="catatanPerkalian" class="text-xs text-slate-400 italic block">
          Untuk diameter input kalikan dengan <span class="text-amber-400 font-semibold">3</span>, <span class="text-amber-400 font-semibold">8</span>, atau <span class="text-amber-400 font-semibold">12</span>
        </span>
      </div>

      <!-- Specs Summary Cards Grid -->
      <div class="grid grid-cols-3 gap-2 mb-4 text-center">
        <div class="bg-slate-950/40 border border-slate-800/60 rounded-xl p-2.5">
          <span class="block text-[10px] text-slate-400 font-medium mb-1">Suhu Pengujian</span>
          <span class="text-xs font-bold text-amber-400 block">121°C ± 1°C</span>
        </div>
        <div class="bg-slate-950/40 border border-slate-800/60 rounded-xl p-2.5">
          <span class="block text-[10px] text-slate-400 font-medium mb-1">Durasi</span>
          <span class="text-xs font-bold text-emerald-400 block">60 Menit</span>
        </div>
        <div class="bg-slate-950/40 border border-slate-800/60 rounded-xl p-2.5">
          <span class="block text-[10px] text-slate-400 font-medium mb-1">Spesifikasi</span>
          <span class="text-xs font-bold text-emerald-400 block leading-tight">No Crack</span>
        </div>
      </div>
    </div>

    <!-- Bottom Actions & Footer -->
    <div class="mt-4 pt-3 border-t border-slate-800/80">
      <div class="grid grid-cols-3 gap-2 mb-3">
        <button onclick="if(window.top!==window.self&&window.parent.closePreviewModal){window.parent.closePreviewModal();}else{history.back();}" class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-300 font-medium text-xs rounded-xl transition-all duration-150 border border-slate-700/50">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Kembali
        </button>
        <a href="index.html" target="_top" class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-amber-600/90 hover:bg-amber-500 active:scale-95 text-white font-medium text-xs rounded-xl transition-all duration-150 shadow-lg shadow-amber-600/20">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Beranda
        </a>
        <a href="coldbending_heatshock_v20260801.html" class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-indigo-400 font-medium text-xs rounded-xl transition-all duration-150 border border-slate-700/50">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          Cold Bending
        </a>
      </div>

      <footer class="text-center">
        <p class="text-[11px] text-slate-500 font-medium">Williyanto Adi 2026 • v20260801</p>
      </footer>
    </div>

  </div>

  <script>
    function updatePerkalian() {
      const inputEl = document.getElementById("diameterKabel");
      let rawVal = inputEl.value.replace(/,/g, '.');
      
      const diameter = parseFloat(rawVal);
      const manrel = document.getElementById("manrel");
      const catatan = document.getElementById("catatanPerkalian");

      let faktor = null;
      if (!isNaN(diameter) && diameter >= 0) {
        if (diameter <= 19.05) {
          faktor = 3;
        } else if (diameter <= 38.10) {
          faktor = 8;
        } else {
          faktor = 12;
        }

        if (faktor) {
          const hasil = (diameter * faktor).toFixed(2);
          manrel.value = hasil + " mm";
          catatan.innerHTML = `Untuk diameter <strong class="text-emerald-400">${diameter}</strong> mm kalikan dengan <strong class="text-amber-400">${faktor}</strong>`;
        } else {
          manrel.value = "---";
          catatan.innerHTML = `Untuk diameter input kalikan dengan <span class="text-amber-400 font-semibold">3</span>, <span class="text-amber-400 font-semibold">8</span>, atau <span class="text-amber-400 font-semibold">12</span>`;
        }
      } else {
        manrel.value = "---";
        catatan.innerHTML = `Untuk diameter input kalikan dengan <span class="text-amber-400 font-semibold">3</span>, <span class="text-amber-400 font-semibold">8</span>, atau <span class="text-amber-400 font-semibold">12</span>`;
      }
    }
  </script>
</body>
</html>
