                <div class="overflow-x-auto rounded-2xl border border-slate-200/60 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-800/20">
                    <table class="w-full text-left border-collapse">

            <!-- Section 3: Kalkulasi & Paramater -->
            <div class="bg-slate-50/60 dark:bg-slate-800/40 p-4 rounded-2xl border border-slate-200/60 dark:border-slate-800 space-y-3">

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label for="tarif" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Tarif per kWh (Rp)</label>

                            <input type="number" id="tarif" value="1445" placeholder="Contoh: 1445" class="pl-9 block w-full px-3 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500 transition-all text-xs font-semibold">
                        </div>
                    </div>
                    <div>
                        <label for="periode-hitung" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Pilih Periode Total</label>

                            <select id="periode-hitung" class="appearance-none block w-full pl-3 pr-8 py-2 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500 transition-all text-xs font-bold">

                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2.5 text-slate-400 dark:text-slate-500">

                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" /></svg>

            <!-- Dynamic Result Card -->

        <!-- Controls Action Bar -->
            <div class="grid grid-cols-3 gap-2.5 pt-1">
                <button type="button" onclick="history.back()" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Kembali
                </button>
                <button type="button" id="tombol-hapus-semua" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-transparent rounded-xl text-xs font-bold text-white bg-rose-500 hover:bg-rose-600 active:scale-95 transition-all shadow-md shadow-rose-100 dark:shadow-none">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>

                <a href="index.html" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>

        <!-- Footer -->

    <script>
        const formAlat = document.getElementById('form-alat');
        const daftarAlatBody = document.getElementById('daftar-alat');
        const tombolHitung = document.getElementById('hitung-biaya');
        const hasilDiv = document.getElementById('hasil-kalkulasi');
        const tarifInput = document.getElementById('tarif');
        const periodeSelect = document.getElementById('periode-hitung');
        const tombolHapusSemua = document.getElementById('tombol-hapus-semua');
        const formatRupiah = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 });

        function simpanDataKeLocalStorage() {
            const barisAlat = daftarAlatBody.getElementsByTagName('tr');
            const dataAlat = [];
            for (let i = 0; i < barisAlat.length; i++) {
                if (barisAlat[i].querySelector('td[colspan="5"]')) continue;
                const sel = barisAlat[i].getElementsByTagName('td');
                const alat = {
                    nama: sel[0].textContent,
                    daya: sel[1].getAttribute('data-daya'),
                    durasi: sel[2].getAttribute('data-durasi')
                };
                dataAlat.push(alat);
            }
            localStorage.setItem('daftarAlatListrik', JSON.stringify(dataAlat));
        }

        function muatDataDariLocalStorage() {
            const dataTersimpan = localStorage.getItem('daftarAlatListrik');
            if (dataTersimpan) {
                const dataAlat = JSON.parse(dataTersimpan);
                if (dataAlat && dataAlat.length > 0) {
                    daftarAlatBody.innerHTML = '';
                    dataAlat.forEach(alat => {
                        tambahAlatKeTabel(alat.nama, alat.daya, alat.durasi);
                    });
                }
            }
            cekTabelKosong();
        }
        
        function tambahAlatKeTabel(nama, daya, durasi) {
            const placeholder = daftarAlatBody.querySelector('td[colspan="5"]');
            if (placeholder) {
                daftarAlatBody.innerHTML = '';
            }
            const barisBaru = document.createElement('tr');
            barisBaru.className = "border-b border-slate-100 dark:border-slate-800/50 hover:bg-slate-100/40 dark:hover:bg-slate-800/40 transition-colors";
            barisBaru.innerHTML = `
                <td class="px-3.5 py-2.5 text-xs font-semibold text-slate-700 dark:text-slate-200">${nama}</td>
                <td class="px-3.5 py-2.5 text-xs text-right font-medium text-slate-600 dark:text-slate-300 hidden sm:table-cell" data-daya="${daya}">
                    <span class="inline-block px-2 py-0.5 rounded-md bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 text-[11px] font-bold border border-emerald-200/50 dark:border-emerald-800/40">${daya} W</span>
                </td>
                <td class="px-3.5 py-2.5 text-xs text-right font-medium text-slate-600 dark:text-slate-300 hidden sm:table-cell" data-durasi="${durasi}">${durasi} jam</td>
                <td class="px-3.5 py-2.5 text-xs text-right font-mono font-bold text-slate-800 dark:text-slate-100 biaya-alat">${formatRupiah.format(0)}</td>
                <td class="px-3.5 py-2.5 text-center">
                    <button type="button" class="p-1.5 rounded-lg text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 hover:text-rose-600 transition-colors btn-remove" title="Hapus">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                </td>
            `;
            daftarAlatBody.appendChild(barisBaru);
        }

        function cekTabelKosong() {
            if (daftarAlatBody.children.length === 0) {
                daftarAlatBody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-xs text-slate-400 dark:text-slate-500 italic">Belum ada alat yang ditambahkan.</td></tr>';
            }
        }

        function calculateAndDisplay() {
            const tarifPerKwh = parseFloat(tarifInput.value);
            const periode = periodeSelect.value;
            const barisAlat = daftarAlatBody.getElementsByTagName('tr');
            let totalKwhHarian = 0;
            if (barisAlat.length === 0 || daftarAlatBody.querySelector('td[colspan="5"]') || isNaN(tarifPerKwh) || tarifPerKwh <= 0){
                hasilDiv.style.display = 'none';
                for (let i = 0; i < barisAlat.length; i++) {
                    if (barisAlat[i].querySelector('.biaya-alat')) {
                        barisAlat[i].querySelector('.biaya-alat').textContent = formatRupiah.format(0);
                    }
                }
                return;
            }
            
            for (let i = 0; i < barisAlat.length; i++) {
                const sel = barisAlat[i].getElementsByTagName('td');
                const daya = parseFloat(sel[1].getAttribute('data-daya'));
                const durasi = parseFloat(sel[2].getAttribute('data-durasi'));
                
                const kwhHarianAlat = (daya * durasi) / 1000;
                totalKwhHarian += kwhHarianAlat;
                
                const biayaBulananAlat = kwhHarianAlat * 30 * tarifPerKwh;
                
                barisAlat[i].querySelector('.biaya-alat').textContent = formatRupiah.format(biayaBulananAlat);
            }
            
            let multiplier = 1, namaPeriode = 'satu hari', labelPeriode = 'Harian';
            switch (periode) {
                case 'mingguan': multiplier = 7; namaPeriode = 'satu minggu'; labelPeriode = 'Mingguan'; break;
                case 'bulanan': multiplier = 30; namaPeriode = 'satu bulan'; labelPeriode = 'Bulanan (30 hari)'; break;
                case 'tahunan': multiplier = 365; namaPeriode = 'satu tahun'; labelPeriode = 'Tahunan (365 hari)'; break;
            }

            const totalKwhPeriode = totalKwhHarian * multiplier;
            const totalBiaya = totalKwhPeriode * tarifPerKwh;
            hasilDiv.style.display = 'block';
            hasilDiv.innerHTML = `
                <div class="transition-all duration-300 rounded-2xl p-4 bg-gradient-to-br from-emerald-500/10 via-teal-500/10 to-emerald-500/5 dark:from-emerald-950/40 dark:to-slate-900/60 border border-emerald-500/30 dark:border-emerald-500/25 shadow-lg shadow-emerald-500/5 relative overflow-hidden">
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-[10px] font-extrabold text-emerald-600 dark:text-emerald-400 uppercase tracking-widest flex items-center gap-1.5">
                            <svg class="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                            Estimasi Total Biaya Anda
                        </span>
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 border border-emerald-200/50 dark:border-emerald-800/40">${labelPeriode}</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2 my-2 py-2 border-y border-emerald-500/20 dark:border-emerald-800/30 text-xs">
                        <div>
                            <span class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block uppercase">Pemakaian Harian</span>
                            <span class="font-bold text-slate-800 dark:text-slate-200 text-sm font-mono">${totalKwhHarian.toFixed(2)} <span class="text-xs text-slate-500">kWh</span></span>
                        </div>
                        <div>
                            <span class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block uppercase">Total Pemakaian (${labelPeriode})</span>
                            <span class="font-bold text-slate-800 dark:text-slate-200 text-sm font-mono">${totalKwhPeriode.toFixed(2)} <span class="text-xs text-slate-500">kWh</span></span>
                        </div>
                    </div>
                    <div class="mt-2 text-center">
                        <span class="text-[11px] font-semibold text-slate-600 dark:text-slate-300 block">Estimasi total biaya untuk ${namaPeriode}:</span>
                        <span class="font-extrabold text-2xl sm:text-3xl text-emerald-600 dark:text-emerald-400 tracking-tight block mt-0.5">${formatRupiah.format(totalBiaya)}</span>
                    </div>
                </div>
            `;
        }
        
        function hapusSemuaData() {
            daftarAlatBody.innerHTML = '';
            cekTabelKosong();
            calculateAndDisplay();
            localStorage.removeItem('daftarAlatListrik');
        }

        formAlat.addEventListener('submit', function(event) {
            event.preventDefault();
            
            const nama = document.getElementById('nama-alat').value;
            const daya = document.getElementById('daya').value;
            const durasi = document.getElementById('durasi').value;

            tambahAlatKeTabel(nama, daya, durasi);
            
            formAlat.reset();
            setTimeout(() => {
                calculateAndDisplay();
                simpanDataKeLocalStorage();
            }, 0);
        });

        daftarAlatBody.addEventListener('click', function(event) {
            if (event.target.closest('.btn-remove')) {
                event.target.closest('tr').remove();
                cekTabelKosong();
                calculateAndDisplay();
                simpanDataKeLocalStorage();
            }
        });

        tombolHitung.addEventListener('click', calculateAndDisplay);
        tarifInput.addEventListener('input', calculateAndDisplay);
        periodeSelect.addEventListener('change', calculateAndDisplay);
        tombolHapusSemua.addEventListener('click', hapusSemuaData);

        // Dark Mode Controller
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            if (localStorage.getItem('color-theme') === 'light') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            muatDataDariLocalStorage();
            calculateAndDisplay();
        });
    </script>
</body>
</html>
