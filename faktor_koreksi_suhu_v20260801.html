<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kalkulator Faktor Koreksi Suhu v20260801</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>
</head>
<body class="min-h-[100dvh] w-full flex items-center justify-center p-3 sm:p-4 bg-slate-950 text-slate-100 font-sans relative overflow-hidden select-none">

  <!-- Ambient Glow Background -->
  <div class="absolute -top-20 -left-20 w-72 h-72 bg-sky-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-20 -right-20 w-72 h-72 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Main Card -->
  <div class="w-full max-w-md max-h-[calc(100dvh-1.5rem)] flex flex-col justify-between bg-slate-900/85 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-5 sm:p-6 shadow-2xl overflow-y-auto relative z-10">

    <!-- Header -->
    <div>
      <div class="flex items-center justify-between mb-4 border-b border-slate-800/80 pb-3">
        <div class="flex items-center gap-2.5">
          <div class="p-2 bg-sky-500/10 rounded-xl text-sky-400 border border-sky-500/20">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
            </svg>
          </div>
          <div>
            <h1 class="text-lg font-bold text-slate-100 leading-tight">Faktor Koreksi Suhu</h1>
            <p class="text-xs text-slate-400">IEC • ICEA • AS/NZS • SPLN</p>
          </div>
        </div>
        <span class="text-[10px] font-semibold tracking-wider text-sky-400 bg-sky-500/10 px-2.5 py-1 rounded-full border border-sky-500/20">v20260801</span>
      </div>

      <!-- Controls Form -->
      <div class="space-y-3 mb-4">
        <!-- Spec Select -->
        <div class="group relative">
          <label for="specSelect" class="block text-xs font-medium text-slate-300 mb-1">Spesifikasi Standard</label>
          <select id="specSelect" onchange="hitungKoreksi()" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl py-2.5 px-3 text-sm font-semibold text-slate-100 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all duration-200 cursor-pointer">
            <option value="IEC" selected class="bg-slate-900">IEC Standard</option>
            <option value="ICEA" class="bg-slate-900">ICEA Standard</option>
            <option value="AS/NZS" class="bg-slate-900">AS/NZS Standard</option>
            <option value="SPLN" class="bg-slate-900">SPLN Standard</option>
          </select>
        </div>

        <!-- Conductor Select -->
        <div class="group relative">
          <label for="conductorTypeSelect" class="block text-xs font-medium text-slate-300 mb-1">Jenis Konduktor</label>
          <select id="conductorTypeSelect" onchange="hitungKoreksi()" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl py-2.5 px-3 text-sm font-semibold text-slate-100 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all duration-200 cursor-pointer">
            <option value="Cu" selected class="bg-slate-900">Tembaga (Cu)</option>
            <option value="Al" class="bg-slate-900">Aluminium (Al)</option>
          </select>
        </div>

        <!-- Temperature Input -->
        <div class="group relative">
          <label for="suhuInput" class="block text-xs font-medium text-slate-300 mb-1">Suhu Pengujian (°C)</label>
          <div class="relative flex items-center">
            <span class="absolute left-3 text-slate-400 group-focus-within:text-sky-400 transition-colors duration-200">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
              </svg>
            </span>
            <input type="text" inputmode="decimal" id="suhuInput" oninput="hitungKoreksi()" placeholder="-40°C s/d 300°C" class="w-full bg-slate-950/60 border border-slate-800 rounded-xl py-2.5 pl-9 pr-3 text-sm font-semibold text-slate-100 placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all duration-200">
          </div>
        </div>
      </div>

      <!-- Result Display Card -->
      <div id="resultCard" class="bg-gradient-to-br from-sky-900/40 via-slate-900 to-indigo-900/40 border border-sky-500/30 rounded-2xl p-4 mb-3 text-center shadow-lg relative overflow-hidden">
        <span class="text-xs font-semibold text-sky-400 tracking-wider uppercase block mb-1">Faktor Koreksi (k)</span>
        <h2 id="hasilKoreksi" class="text-3xl sm:text-4xl font-extrabold text-sky-300 tracking-tight transition-all duration-200">---</h2>
        <div class="mt-2 pt-2 border-t border-slate-800/80">
          <small id="formulaText" class="text-xs text-slate-400 font-mono italic">Rumus: k = 254.5 / (234.5 + t)</small>
        </div>
      </div>
    </div>

    <!-- Actions & Footer -->
    <div class="mt-4 pt-3 border-t border-slate-800/80">
      <div class="grid grid-cols-2 gap-2 mb-3">
        <button onclick="if(window.top!==window.self&&window.parent.closePreviewModal){window.parent.closePreviewModal();}else{history.back();}" class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-slate-800/80 hover:bg-slate-700 active:scale-95 text-slate-300 font-medium text-xs rounded-xl transition-all duration-150 border border-slate-700/50">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Kembali
        </button>
        <a href="index.html" target="_top" class="flex items-center justify-center gap-1.5 py-2.5 px-3 bg-sky-600/90 hover:bg-sky-500 active:scale-95 text-white font-medium text-xs rounded-xl transition-all duration-150 shadow-lg shadow-sky-600/20">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
          Beranda
        </a>
      </div>

      <footer class="text-center">
        <p class="text-[11px] text-slate-500 font-medium">Williyanto Adi 2026 • v20260801</p>
      </footer>
    </div>

  </div>

  <script>
    const specSelect = document.getElementById('specSelect');
    const conductorTypeSelect = document.getElementById('conductorTypeSelect');
    const inputSuhu = document.getElementById('suhuInput');
    const displayHasil = document.getElementById('hasilKoreksi');
    const formulaDisplay = document.getElementById('formulaText');

    const specs = {
      IEC: {
        Cu: { base: 'k = 254.5 / (234.5 + t)', constant1: 254.5, constant2: 234.5 },
        Al: { base: 'k = 248 / (228 + t)', constant1: 248, constant2: 228 }
      },
      ICEA: {
        Cu: { base: 'k = 259.5 / (234.5 + t)', constant1: 259.5, constant2: 234.5 },
        Al: { base: 'k = 253.0 / (228.0 + t)', constant1: 253.0, constant2: 228.0 }
      },
      'AS/NZS': {
        Cu: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 },
        Al: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 }
      },
      SPLN: {
        Cu: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 },
        Al: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 }
      }
    };

    function hitungKoreksi() {
      const spesifikasi = specSelect.value;
      const conductorType = conductorTypeSelect.value;
      let rawVal = inputSuhu.value.replace(/,/g, '.');
      const suhu = parseFloat(rawVal);
      const currentFormulaData = specs[spesifikasi][conductorType];

      displayHasil.classList.remove('text-rose-400');
      displayHasil.classList.add('text-sky-300');
      inputSuhu.classList.remove('border-rose-500');

      if (isNaN(suhu)) {
        displayHasil.textContent = '---';
        formulaDisplay.textContent = 'Rumus: ' + currentFormulaData.base;
        return;
      }

      const penyebut = currentFormulaData.constant2 + suhu;

      if (penyebut === 0 || suhu < -40 || suhu > 300) {
        displayHasil.textContent = 'Tidak Valid';
        displayHasil.classList.remove('text-sky-300');
        displayHasil.classList.add('text-rose-400');
        inputSuhu.classList.add('border-rose-500');
        formulaDisplay.textContent = 'Rumus: ' + currentFormulaData.base.replace('t', suhu);
        return;
      }

      const faktorKoreksi = currentFormulaData.constant1 / penyebut;

      if (spesifikasi === 'ICEA' || spesifikasi === 'AS/NZS' || spesifikasi === 'SPLN') {
        displayHasil.textContent = faktorKoreksi.toFixed(3);
      } else {
        displayHasil.textContent = faktorKoreksi.toFixed(4);
      }

      formulaDisplay.textContent = 'Rumus: ' + currentFormulaData.base.replace('t', suhu);
    }

    hitungKoreksi();
  </script>
</body>
</html>
