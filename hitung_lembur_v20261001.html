<!DOCTYPE html>
<html lang="id" class="transition-all duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Lembur</title>
    <link rel="icon" type="image/png" href="./icons/williyanto_logo_rounded.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        select {
            background-image: none !important;
        }
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gradient-to-tr from-slate-100 via-green-50/30 to-slate-100 dark:from-slate-950 dark:via-slate-900/60 dark:to-slate-950 min-h-[100dvh] flex flex-col justify-center items-center py-2 px-3 overflow-x-hidden transition-colors duration-300">

    <!-- Ambient Background Blobs -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40 dark:opacity-20 hidden md:block">
        <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-green-400 blur-[100px] animate-pulse"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-teal-400 blur-[100px] animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-3xl border border-slate-200/50 dark:border-slate-800/80 shadow-xl p-4 sm:p-5 transition-all duration-300 flex flex-col w-full max-h-[calc(100dvh-1rem)] my-auto overflow-hidden">
        
        <!-- Header -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-green-500 to-emerald-600 flex items-center justify-center text-white shadow-md shadow-green-200 dark:shadow-none">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-800 dark:text-slate-100 tracking-tight">Kalkulator Lembur</h1>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">Perhitungan Upah Lembur</p>
                </div>
            </div>
            
            <!-- Dark Mode Toggle Button -->
            <button id="theme-toggle" type="button" class="p-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 hover:bg-slate-100 dark:hover:bg-slate-750 active:scale-95 transition-all">
                <svg id="theme-toggle-dark-icon" class="w-4 h-4 text-slate-500 dark:text-slate-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <svg id="theme-toggle-light-icon" class="w-4 h-4 text-amber-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
                </svg>
            </button>
        </div>

        <!-- Body content container -->
        <div class="space-y-3 flex-1 flex flex-col justify-between my-2 overflow-y-auto scrollbar-none">
            
            <div class="space-y-3">
                <!-- Input Gaji Pokok -->
                <div class="relative group">
                    <label for="salaryInput" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Gaji Pokok + Tunjangan Tetap</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <span class="text-slate-400 dark:text-slate-500 text-xs font-bold">Rp</span>
                        </div>
                        <input type="text" id="salaryInput" placeholder="Masukkan total gaji" class="pl-9 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500 transition-all text-xs font-bold">
                    </div>
                </div>

                <!-- Input Jam Lembur -->
                <div class="relative group">
                    <label for="hours" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Total Jam Lembur</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-green-500 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <input type="number" id="hours" min="0" step="0.1" placeholder="Masukkan total jam" class="pl-9 pr-12 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-green-500/20 focus:border-green-500 transition-all text-xs font-bold">
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                            <span class="text-slate-400 dark:text-slate-500 text-[10px] font-bold uppercase">Jam</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Dynamic Result Card -->
            <div id="resultCardWrapper" class="flex-1 flex flex-col justify-center my-1">
                <div id="placeholderResult" class="transition-all duration-300 rounded-2xl p-4 bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/50 text-center relative overflow-hidden flex flex-col justify-center items-center py-6">
                    <span class="text-2xl mb-1.5 opacity-60">⏳</span>
                    <h3 class="text-xs font-bold text-slate-500 dark:text-slate-400">Menunggu Input Data</h3>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 mt-0.5">Isi gaji dan jam lembur di atas</p>
                </div>

                <div id="realResult" class="hidden flex flex-col gap-2.5 transition-all duration-300">
                    <!-- Upah Diterima Banner -->
                    <div class="bg-gradient-to-br from-green-500 to-emerald-600 p-3.5 rounded-2xl shadow-md text-white text-center relative overflow-hidden">
                        <div class="absolute -right-6 -bottom-6 w-20 h-20 rounded-full bg-white/10 blur-md pointer-events-none"></div>
                        <span class="text-[10px] text-green-100 uppercase font-bold tracking-wider block mb-0.5">Total Upah Diterima</span>
                        <h2 id="resTotalEarnings" class="text-2xl sm:text-3xl font-extrabold tracking-tight">Rp 0</h2>
                    </div>

                    <!-- Breakdown Grid -->
                    <div class="grid grid-cols-2 gap-2.5">
                        <div class="bg-slate-50 dark:bg-slate-800/40 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/50 text-center">
                            <span class="text-[9px] text-slate-400 dark:text-slate-500 font-bold uppercase tracking-wider block mb-0.5">Upah per Jam</span>
                            <div id="resHourlyRate" class="text-xs font-bold text-slate-800 dark:text-slate-100 font-mono">Rp 0</div>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-800/40 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700/50 text-center">
                            <span class="text-[9px] text-slate-400 dark:text-slate-500 font-bold uppercase tracking-wider block mb-0.5">Durasi Lembur</span>
                            <div id="resTotalHours" class="text-xs font-bold text-slate-800 dark:text-slate-100">0 Jam</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Metode / Info Box -->
            <div class="bg-amber-500/10 dark:bg-amber-500/5 p-2.5 rounded-xl border border-amber-500/20 flex items-start gap-2">
                <span class="text-amber-500 text-xs mt-0.5">ℹ️</span>
                <p class="text-[10px] text-amber-700 dark:text-amber-300/80 font-medium leading-relaxed">
                    <strong class="font-bold">Metode:</strong> Total Jam Lembur × (Gaji ÷ 173). Pembulatan rupiah dilakukan pada hasil akhir.
                </p>
            </div>
            
            <!-- Controls Menu -->
            <div class="grid grid-cols-3 gap-3 pt-2.5 border-t border-slate-100 dark:border-slate-800">
                <button type="button" onclick="if(window.top!==window.self&&window.parent.closePreviewModal){window.parent.closePreviewModal();}else{history.back();}" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Kembali
                </button>
                
                <button type="button" id="btnReset" onclick="clearData()" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-transparent rounded-xl text-xs font-bold text-white bg-rose-500 hover:bg-rose-600 active:scale-95 transition-all shadow-md shadow-rose-100 dark:shadow-none">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    Reset
                </button>
                
                <a href="index.html" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    Beranda
                </a>
            </div>

        </div>

        <!-- Footer -->
        <footer class="text-center text-slate-400 dark:text-slate-600 text-[10px] mt-2 pt-2 border-t border-slate-100 dark:border-slate-800 font-medium">
            Williyanto Adi 2026
        </footer>

    </div>

    <!-- Script Logic -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const salaryInput = document.getElementById("salaryInput");
        const hoursInput = document.getElementById("hours");

        salaryInput.addEventListener("input", function (e) {
            let value = this.value.replace(/\D/g, "");
            if (value !== "") {
                this.value = new Intl.NumberFormat("id-ID").format(parseInt(value));
            } else {
                this.value = "";
            }
            hitungLemburOtomatis();
        });

        hoursInput.addEventListener("input", hitungLemburOtomatis);

        function hitungLemburOtomatis() {
            const rawSalary = salaryInput.value.replace(/\./g, "");
            const salary = parseFloat(rawSalary);
            const hours = parseFloat(hoursInput.value);

            if (!salary || isNaN(salary) || isNaN(hours) || hours <= 0) {
                document.getElementById("placeholderResult").classList.remove("hidden");
                document.getElementById("realResult").classList.add("hidden");
                return;
            }

            const hourlyRateExact = salary / 173;
            const hourlyRateDisplay = Math.round(hourlyRateExact);
            const totalEarnings = Math.round(hours * hourlyRateExact);

            document.getElementById("resHourlyRate").innerText = formatRupiahOutput(hourlyRateDisplay);
            document.getElementById("resTotalHours").innerText = hours + " Jam";
            document.getElementById("resTotalEarnings").innerText = formatRupiahOutput(totalEarnings);

            document.getElementById("placeholderResult").classList.add("hidden");
            document.getElementById("realResult").classList.remove("hidden");
        }

        function formatRupiahOutput(number) {
            return new Intl.NumberFormat("id-ID", {
                style: "currency",
                currency: "IDR",
                maximumFractionDigits: 0,
            }).format(number);
        }

        window.clearData = function() {
            salaryInput.value = "";
            hoursInput.value = "";
            hitungLemburOtomatis();
            salaryInput.focus();
        };

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        function updateThemeIcons() {
            if (document.documentElement.classList.contains('dark')) {
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
            } else {
                themeToggleLightIcon.classList.add('hidden');
                themeToggleDarkIcon.classList.remove('hidden');
            }
        }
        updateThemeIcons();

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
                updateThemeIcons();
            });
        }
    });
    </script>
</body>
</html>
