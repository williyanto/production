            <option value="30" class="bg-white dark:bg-slate-900">Rak Single Burner (30 cm)</option>

            <option value="custom" class="bg-white dark:bg-slate-900">Custom (Ukuran Lain)</option>
          </select>
        </div>

        <!-- Custom Lebar (Hidden by default) -->
        <div id="customInputDiv" class="hidden group relative">
          <label for="lebarCustom" class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">Lebar Rak Custom (cm)</label>

        </div>

        <!-- Diameter Kabel -->
        <div class="group relative">
          <label for="diameterKabel" class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">Diameter Kabel (cm)</label>
          <div class="relative flex items-center">
            <span
              class="absolute left-3 text-slate-500 dark:text-slate-400 group-focus-within:text-emerald-600 dark:text-emerald-400 transition-colors duration-200">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
              </svg>
            </span>
            <input type="text" inputmode="decimal" id="diameterKabel" value="5.5" oninput="handleInputChange()"
              placeholder="5.5"
              class="w-full bg-slate-50 dark:bg-slate-950/60 border border-slate-300 dark:border-slate-800 rounded-xl py-2.5 pl-9 pr-3 text-sm font-semibold text-slate-700 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all duration-200">
          </div>
        </div>

        <!-- Toggle Spasi Switch -->
        <label for="pakaiSpasi"
          class="flex items-center justify-between p-3 bg-slate-100 dark:bg-slate-950/40 border border-slate-300 dark:border-slate-800/80 rounded-xl cursor-pointer hover:bg-slate-200 dark:hover:bg-slate-950/60 transition-colors">
          <div class="flex items-center gap-2">
            <svg class="w-4 h-4 text-emerald-600 dark:text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            </svg>
            <span class="text-xs font-medium text-slate-700 dark:text-slate-200 select-none">Gunakan Jarak / Gap Antar Kabel</span>
          </div>
          <input type="checkbox" id="pakaiSpasi" onchange="handleInputChange()"

        </label>

        <!-- Spasi Input (Hidden by default) -->
        <div id="spasiInputDiv" class="hidden group relative">
          <label for="jarakKabel" class="block text-xs font-medium text-slate-600 dark:text-slate-300 mb-1">Jarak / Gap (cm)</label>
          <input type="text" inputmode="decimal" id="jarakKabel" value="1.0" oninput="handleInputChange()"
            placeholder="1.0"
            class="w-full bg-slate-50 dark:bg-slate-950/60 border border-slate-300 dark:border-slate-800 rounded-xl py-2.5 px-3 text-sm font-semibold text-slate-700 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-600 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all duration-200">
        </div>

      <!-- Result Card -->
      <div
        class="bg-gradient-to-br from-emerald-50/60 via-slate-100 to-teal-50/60 dark:from-emerald-950/60 dark:via-slate-900 dark:to-teal-950/60 border border-emerald-200/50 dark:border-emerald-500/30 rounded-2xl p-4 mb-3 text-center shadow-lg relative overflow-hidden">
        <span class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 tracking-wider uppercase block mb-1">Kapasitas
          Maksimal</span>
        <span id="jumlahKabel"
          class="text-4xl sm:text-5xl font-extrabold text-emerald-700 dark:text-emerald-300 tracking-tight block my-1">0</span>
        <span class="text-xs font-medium text-slate-600 dark:text-slate-300 uppercase tracking-widest block">Batang Kabel</span>
        <p id="keterangan" class="text-[11px] text-slate-500 dark:text-slate-400 italic mt-2 pt-2">Masukkan
          data yang valid</p>

    <!-- Actions & Footer (Shrink-0) -->

          onclick="if(window.top!==window.self&&window.parent.closePreviewModal){window.parent.closePreviewModal();}else{history.back();}"

        <button type="button" id="btnReset" class="flex items-center justify-center gap-1.5 py-2 px-3 bg-rose-50 dark:bg-rose-900/20 hover:bg-rose-100 dark:hover:bg-rose-900/40 active:scale-95 text-rose-600 dark:text-rose-400 font-medium text-xs rounded-xl border border-rose-200 dark:border-rose-800/50 transition-all shadow-sm">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

    </div>

  
        <!-- Footer -->

            Williyanto Adi 2026
        </footer>

</div>

  <script>
    function handleInputChange() {
      const tipeRak = document.getElementById('tipeRak').value;
      const customDiv = document.getElementById('customInputDiv');
      const spasiDiv = document.getElementById('spasiInputDiv');
      const pakaiSpasi = document.getElementById('pakaiSpasi').checked;

      customDiv.classList.toggle('hidden', tipeRak !== 'custom');
      spasiDiv.classList.toggle('hidden', !pakaiSpasi);

      hitungKabel();
    }

    function hitungKabel() {
      const tipeRakValue = document.getElementById('tipeRak').value;
      let rawDia = document.getElementById('diameterKabel').value.replace(/,/g, '.');
      const diameterKabel = parseFloat(rawDia);
      const pakaiSpasi = document.getElementById('pakaiSpasi').checked;

      let rawJarak = document.getElementById('jarakKabel').value.replace(/,/g, '.');
      const jarak = pakaiSpasi ? (parseFloat(rawJarak) || 0) : 0;

      let lebarRak;
      if (tipeRakValue === 'custom') {
        let rawCustom = document.getElementById('lebarCustom').value.replace(/,/g, '.');
        lebarRak = parseFloat(rawCustom);
      } else {
        lebarRak = parseFloat(tipeRakValue);
      }

      if (lebarRak > 0 && diameterKabel > 0) {
        let jumlah;
        if (pakaiSpasi && jarak > 0) {
          jumlah = Math.floor((lebarRak + jarak) / (diameterKabel + jarak));
        } else {
          jumlah = Math.floor(lebarRak / diameterKabel);
        }

        document.getElementById('jumlahKabel').innerText = (isNaN(jumlah) || jumlah < 0) ? "0" : jumlah;
        document.getElementById('keterangan').innerText = `Rak ${lebarRak}cm, Cable Ø${diameterKabel}cm ${pakaiSpasi ? '(Gap ' + jarak + 'cm)' : '(Rapat)'}`;
      } else {
        document.getElementById('jumlahKabel').innerText = "0";
        document.getElementById('keterangan').innerText = "Masukkan data yang valid";
      }
    }

    window.onload = handleInputChange;

    // Dark Mode
    const themeToggleBtn = document.getElementById('theme-toggle');
    if(themeToggleBtn) {
        themeToggleBtn.addEventListener('click', function () {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });
    }

    const btnReset = document.getElementById('btnReset');
    if(btnReset) {
      btnReset.addEventListener('click', () => {
        document.getElementById('tipeRak').value = '30';
        document.getElementById('lebarCustom').value = '';
        document.getElementById('diameterKabel').value = '5.5';
        document.getElementById('pakaiSpasi').checked = true;
        document.getElementById('jarakKabel').value = '1.0';
        handleInputChange();
        hitungKabel();
      });
    }
  </script>
</body>
