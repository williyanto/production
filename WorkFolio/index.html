<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WorkFolio — Timeline Rekam Jejak Kerja</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- 1. Top App Header (Sticky Compact) -->
    <header class="app-header">
      <button class="header-switcher" id="headerSwitcherBtn" type="button" aria-label="Pilih atau kelola profil pengguna">
        <div class="header-avatar" id="headerAvatar" aria-hidden="true">WA</div>
        <div class="header-identity">
          <div class="header-title-row">
            <span class="header-title" id="headerUserName">Williyanto Adi</span>
            <svg class="icon icon-xs chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <span class="header-subtitle" id="headerCompanyName">PT Mengkoding Indonesia</span>
        </div>
      </button>

      <div class="header-actions">
        <button class="status-chip" id="headerOvertimeChip" type="button" title="Status Lembur Mingguan (PP 35/2021)">
          <svg class="icon icon-xs" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span id="headerOvertimeText">0/18j</span>
        </button>
        <button class="icon-btn" id="headerExportBtn" type="button" aria-label="Ekspor laporan bulanan" title="Ekspor Laporan">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        </button>
        <button class="icon-btn" id="themeToggleBtn" type="button" aria-label="Ubah tema" title="Ubah Tema">
          <svg class="icon" id="themeIconSun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="icon hidden" id="themeIconMoon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
      </div>
    </header>

    <!-- 2. Scrollable App Content -->
    <main class="app-content" id="appContent">
      <section class="tab-view active" id="view-activities" aria-label="Aktivitas Kerja"></section>
      <section class="tab-view" id="view-calendar" aria-label="Kalender Aktivitas"></section>
      <section class="tab-view" id="view-stats" aria-label="Statistik Tahunan"></section>
      <section class="tab-view" id="view-docs" aria-label="Pengingat Dokumen"></section>
      <section class="tab-view" id="view-profile" aria-label="Profil dan Pengaturan"></section>
    </main>

    <!-- Floating Quick Add Button -->
    <button class="fab-btn" id="fabAddBtn" type="button" aria-label="Catat Aktivitas Baru" title="Catat Aktivitas Baru">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    </button>

    <!-- Floating Toast / Undo Banner -->
    <div class="toast-banner" id="toastBanner" role="status" aria-live="polite">
      <div class="toast-content">
        <span class="toast-dot"></span>
        <span class="toast-message" id="toastMessage">Aktivitas tersimpan</span>
      </div>
      <button class="toast-action hidden" id="toastUndoBtn" type="button">Urungkan</button>
    </div>

    <!-- 3. Bottom Navigation Bar (5 Tabs) -->
    <nav class="bottom-nav" aria-label="Navigasi Utama">
      <button class="nav-item active" data-tab="activities" type="button">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
        <span>Aktivitas</span>
      </button>
      <button class="nav-item" data-tab="calendar" type="button">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
        <span>Kalender</span>
      </button>
      <button class="nav-item" data-tab="stats" type="button">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16v-5"/><path d="M12 16V8"/><path d="M17 16v-8"/></svg>
        <span>Statistik</span>
      </button>
      <button class="nav-item" data-tab="docs" type="button">
        <span class="nav-icon-wrap">
          <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
          <span class="nav-badge-dot hidden" id="docsBadgeDot"></span>
        </span>
        <span>Dokumen</span>
      </button>
      <button class="nav-item" data-tab="profile" type="button">
        <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Profil</span>
      </button>
    </nav>

    <!-- Bottom Sheet Modal Container -->
    <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true">
      <div class="bottom-sheet" id="bottomSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 class="sheet-title" id="sheetTitle">Judul</h2>
          <button class="icon-btn" id="sheetCloseBtn" type="button" aria-label="Tutup">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
