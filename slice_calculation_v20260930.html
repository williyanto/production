<!DOCTYPE html>
<html lang="id" class="transition-all duration-300">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Presisi Bagian Kabel</title>
    <link rel="icon" type="image/png" href="./icons/logo_icea.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        select {
            background-image: none !important;
        }

        /* Hide arrows in number inputs */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Custom Scrollbar for layer list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #334155;
        }
    </style>
</head>

<body
    class="bg-gradient-to-tr from-slate-100 via-blue-50/30 to-slate-100 dark:from-slate-950 dark:via-slate-900/60 dark:to-slate-950 min-h-[100dvh] flex flex-col justify-center items-center py-4 px-3 overflow-x-hidden transition-colors duration-300">

    <!-- Ambient Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40 dark:opacity-20 hidden md:block">
        <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-blue-400 blur-[100px] animate-pulse"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-indigo-400 blur-[100px] animate-pulse"
            style="animation-delay: 2s;"></div>
    </div>

    <!-- Main Container -->
    <div
        class="w-full max-w-md mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-3xl border border-slate-200/50 dark:border-slate-800/80 shadow-xl p-4 sm:p-5 transition-all duration-300 flex flex-col max-h-[calc(100dvh-2rem)] overflow-hidden">

        <!-- Header -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <div
                    class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-blue-200 dark:shadow-none">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 5.758a3 3 0 10-4.243-4.243 3 3 0 004.243 4.243z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-800 dark:text-slate-100 tracking-tight">Kalkulator Potong
                    </h1>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">
                        Presisi Layer Kabel</p>
                </div>
            </div>
            <button id="theme-toggle" type="button"
                class="p-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 hover:bg-slate-100 dark:hover:bg-slate-750 active:scale-95 transition-all">
                <svg id="theme-toggle-dark-icon" class="w-4 h-4 text-slate-500 dark:text-slate-400 hidden" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <svg id="theme-toggle-light-icon" class="w-4 h-4 text-amber-500 hidden" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
                </svg>
            </button>
        </div>

        <!-- Inputs container -->
        <div class="space-y-4 flex-1 flex flex-col py-3 overflow-y-auto custom-scrollbar pr-1">

            <!-- Pengaturan Utama -->
            <div>
                <span
                    class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest block mb-1.5">Pengaturan
                    Utama</span>
                <div class="grid grid-cols-2 gap-3">
                    <div class="relative group">
                        <label for="panjangTotal"
                            class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Panjang
                            Sampel (cm)</label>
                        <div class="relative">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-blue-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                    stroke-width="1.5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
                                </svg>
                            </div>
                            <input type="number" step="0.1" name="panjangTotal" id="panjangTotal"
                                class="pl-9 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-xs font-semibold"
                                placeholder="Contoh: 20">
                        </div>
                    </div>
                    <div class="relative group">
                        <label for="jumlahLayer"
                            class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Jumlah
                            Layer</label>
                        <div class="relative">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-blue-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                    stroke-width="1.5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                                </svg>
                            </div>
                            <input type="number" min="2" max="15" name="jumlahLayer" id="jumlahLayer"
                                class="pl-9 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-xs font-semibold"
                                placeholder="Berapa layer?">
                        </div>
                    </div>
                    <div class="relative group col-span-2">
                        <label for="panjangPerLayer"
                            class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Potongan
                            Tiap Layer (cm)</label>
                        <div class="relative">
                            <div
                                class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-blue-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                    stroke-width="1.5">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M12 6v12m-3-2.818l.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                            </div>
                            <input type="number" step="0.1" name="panjangPerLayer" id="panjangPerLayer"
                                class="pl-9 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-xs font-semibold"
                                placeholder="Isi ini jika potongan seragam (misal: 2)">
                        </div>
                    </div>
                </div>
            </div>

            <!-- List Layer Dinamis -->
            <div id="layerContainerWrapper" class="hidden flex-1 flex flex-col overflow-hidden">
                <div class="flex items-center justify-between mb-1.5">
                    <span
                        class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest block">Dimensi
                        Tiap Layer (cm)</span>
                    <span id="sisaPanjangLabel"
                        class="text-[10px] font-bold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded border border-blue-100 dark:border-blue-800/50">Sisa:
                        -</span>
                </div>

                <div id="layerList" class="space-y-2 overflow-y-auto custom-scrollbar pr-1 pb-1">
                    <!-- Layer inputs will be generated here -->
                </div>
            </div>

            <!-- Warning Alerts -->
            <div id="warningAlert"
                class="hidden items-center gap-2 p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900/50 text-rose-600 dark:text-rose-400 text-[11px] font-semibold transition-all">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span>Total panjang layer melebihi panjang sampel!</span>
            </div>

            <div id="thinLayerAlert"
                class="hidden items-center gap-2 p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900/50 text-amber-600 dark:text-amber-400 text-[11px] font-semibold transition-all">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span>Perhatian: Ada layer yang terlalu pendek (< 1 cm). Ini mungkin akan sulit untuk
                        diklem/diuji.</span>
            </div>



        </div>

        <!-- Controls Menu -->
        <div class="grid grid-cols-3 gap-3 pt-3 border-t border-slate-200 dark:border-slate-800">
            <button type="button" onclick="history.back()"
                class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Kembali
            </button>
            <button type="button" id="resetBtn"
                class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-transparent rounded-xl text-xs font-bold text-white bg-rose-500 hover:bg-rose-600 active:scale-95 transition-all shadow-md shadow-rose-100 dark:shadow-none">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Reset
            </button>
            <a href="./index.html"
                class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Beranda
            </a>
        </div>

        <!-- Footer -->
        <footer
            class="text-center text-slate-400 dark:text-slate-600 text-[10px] mt-3 pt-2 border-t border-slate-200 dark:border-slate-800 font-medium">
            Williyanto Adi 2026
        </footer>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const panjangTotalInput = document.getElementById('panjangTotal');
            const jumlahLayerInput = document.getElementById('jumlahLayer');
            const panjangPerLayerInput = document.getElementById('panjangPerLayer');
            const layerContainerWrapper = document.getElementById('layerContainerWrapper');
            const layerList = document.getElementById('layerList');
            const sisaPanjangLabel = document.getElementById('sisaPanjangLabel');
            const warningAlert = document.getElementById('warningAlert');
            const thinLayerAlert = document.getElementById('thinLayerAlert');
            const resetBtn = document.getElementById('resetBtn');

            function generateLayerInputs() {
                const jumlah = parseInt(jumlahLayerInput.value);
                const total = parseFloat(panjangTotalInput.value) || 0;

                if (isNaN(jumlah) || jumlah < 2 || jumlah > 20) {
                    layerContainerWrapper.classList.add('hidden');
                    return;
                }

                layerContainerWrapper.classList.remove('hidden');

                // Simpan value lama jika ada
                const oldValues = [];
                const oldNames = [];
                document.querySelectorAll('.layer-input').forEach(input => oldValues.push(input.value));
                document.querySelectorAll('.layer-name').forEach(input => oldNames.push(input.value));

                layerList.innerHTML = '';

                const globalValRaw = parseFloat(panjangPerLayerInput.value);
                const globalVal = !isNaN(globalValRaw) ? globalValRaw : null;

                for (let i = 0; i < jumlah; i++) {
                    const isLast = (i === jumlah - 1);

                    const defaultName = oldNames[i] || `Layer ${i + 1}`;
                    let val = oldValues[i];
                    if (val === undefined || val === '') {
                        val = (globalVal !== null && !isLast) ? globalVal : '';
                    }

                    const div = document.createElement('div');
                    div.className = "flex gap-2 items-center bg-slate-50/50 dark:bg-slate-800/30 p-1.5 rounded-xl border border-slate-200/50 dark:border-slate-700/50";

                    div.innerHTML = `
                        <div class="flex-shrink-0 w-6 h-6 rounded bg-slate-200 dark:bg-slate-700 flex items-center justify-center text-[10px] font-bold text-slate-600 dark:text-slate-300">
                            ${i + 1}
                        </div>
                        <input type="text" class="layer-name flex-1 bg-white/60 dark:bg-slate-900/40 border border-slate-200/60 dark:border-slate-700/60 focus:border-blue-400 dark:focus:border-blue-500 focus:bg-white dark:focus:bg-slate-800 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-0 text-xs font-semibold text-slate-700 dark:text-slate-200 placeholder-slate-400 transition-colors" placeholder="Nama Layer" value="${defaultName}">
                        <div class="relative w-20 flex items-center">
                            <input type="number" step="0.1" class="layer-input w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg py-2 px-1 text-xs font-bold text-center focus:outline-none focus:border-blue-500 transition-colors ${isLast ? 'text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/20 pointer-events-none' : 'text-slate-800 dark:text-slate-100'}" placeholder="cm" value="${val}" ${isLast ? 'readonly tabindex="-1"' : ''}>
                        </div>
                    `;
                    layerList.appendChild(div);
                }

                attachInputListeners();
                calculateRemaining();
            }

            function attachInputListeners() {
                document.querySelectorAll('.layer-input').forEach((input, index, arr) => {
                    if (index !== arr.length - 1) { // Skip last element
                        input.addEventListener('input', calculateRemaining);
                    }
                });
            }

            function calculateRemaining() {
                const totalStr = panjangTotalInput.value;
                const total = parseFloat(totalStr) || 0;
                const inputs = document.querySelectorAll('.layer-input');

                if (inputs.length === 0) return;

                let sum = 0;
                let hasThinLayer = false;

                for (let i = 0; i < inputs.length - 1; i++) {
                    const val = parseFloat(inputs[i].value) || 0;
                    sum += val;
                    if (val > 0 && val < 1.0) hasThinLayer = true;
                }

                const remaining = total - sum;
                const lastInput = inputs[inputs.length - 1];

                if (!totalStr || total <= 0) {
                    lastInput.value = '';
                    lastInput.classList.remove('text-rose-500', 'dark:text-rose-400', 'border-rose-300', 'dark:border-rose-700');
                    sisaPanjangLabel.innerText = `Sisa: - cm`;
                    sisaPanjangLabel.className = "text-[10px] font-bold text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded border border-slate-200 dark:border-slate-700";
                    warningAlert.classList.add('hidden');
                    warningAlert.classList.remove('flex');
                    thinLayerAlert.classList.add('hidden');
                    thinLayerAlert.classList.remove('flex');
                    return;
                }

                if (remaining >= 0 && remaining < 1.0 && total > 0) hasThinLayer = true;

                if (remaining < 0) {
                    lastInput.value = '0';
                    lastInput.classList.add('text-rose-500', 'dark:text-rose-400', 'border-rose-300', 'dark:border-rose-700');
                    sisaPanjangLabel.innerText = `Sisa: ${Number(remaining.toFixed(2))} cm`;
                    sisaPanjangLabel.className = "text-[10px] font-bold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-900/30 px-2 py-0.5 rounded border border-rose-100 dark:border-rose-800/50";
                    warningAlert.classList.remove('hidden');
                    warningAlert.classList.add('flex');
                } else {
                    lastInput.value = total > 0 ? Number(remaining.toFixed(2)) : '';
                    lastInput.classList.remove('text-rose-500', 'dark:text-rose-400', 'border-rose-300', 'dark:border-rose-700');
                    sisaPanjangLabel.innerText = `Sisa: ${Number(remaining.toFixed(2))} cm`;
                    sisaPanjangLabel.className = "text-[10px] font-bold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-900/30 px-2 py-0.5 rounded border border-blue-100 dark:border-blue-800/50";
                    warningAlert.classList.add('hidden');
                    warningAlert.classList.remove('flex');
                }

                // Validasi thin layer
                if (hasThinLayer && remaining >= 0) {
                    thinLayerAlert.classList.remove('hidden');
                    thinLayerAlert.classList.add('flex');
                } else {
                    thinLayerAlert.classList.add('hidden');
                    thinLayerAlert.classList.remove('flex');
                }
            }

            jumlahLayerInput.addEventListener('input', generateLayerInputs);
            panjangTotalInput.addEventListener('input', calculateRemaining);

            panjangPerLayerInput.addEventListener('input', () => {
                const val = parseFloat(panjangPerLayerInput.value);
                const inputs = document.querySelectorAll('.layer-input');
                if (!isNaN(val)) {
                    // update all except the last one
                    for (let i = 0; i < inputs.length - 1; i++) {
                        inputs[i].value = val;
                    }
                } else {
                    // clear all except the last one if input is empty
                    for (let i = 0; i < inputs.length - 1; i++) {
                        inputs[i].value = '';
                    }
                }
                calculateRemaining();
            });

            resetBtn.addEventListener('click', () => {
                panjangTotalInput.value = '';
                jumlahLayerInput.value = '';
                panjangPerLayerInput.value = '';
                layerContainerWrapper.classList.add('hidden');
                warningAlert.classList.add('hidden');
                thinLayerAlert.classList.add('hidden');
            });

            // Dark Mode
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                themeToggleLightIcon.classList.remove('hidden');
            } else {
                themeToggleDarkIcon.classList.remove('hidden');
            }

            themeToggleBtn.addEventListener('click', function () {
                themeToggleDarkIcon.classList.toggle('hidden');
                themeToggleLightIcon.classList.toggle('hidden');
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            });

        });
    </script>
</body>

</html>
