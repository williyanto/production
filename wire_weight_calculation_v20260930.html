<!DOCTYPE html>
<html lang="id" class="transition-all duration-300">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Berat Kawat (Stranding)</title>
    <link rel="icon" type="image/png" href="../icons/logo_icea.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Custom Scrollbar for list */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #334155;
        }
    </style>
</head>

<body
    class="bg-gradient-to-tr from-slate-100 via-blue-50/30 to-slate-100 dark:from-slate-950 dark:via-slate-900/60 dark:to-slate-950 min-h-[100dvh] flex flex-col justify-center items-center py-4 px-3 overflow-x-hidden transition-colors duration-300">

    <!-- Ambient Background -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40 dark:opacity-20 hidden md:block">
        <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-blue-400 blur-[100px] animate-pulse"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-indigo-400 blur-[100px] animate-pulse"
            style="animation-delay: 2s;"></div>
    </div>

    <!-- Main Container -->
    <div
        class="w-full max-w-md mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-3xl border border-slate-200/50 dark:border-slate-800/80 shadow-xl p-4 sm:p-5 transition-all duration-300 flex flex-col max-h-[calc(100dvh-2rem)] overflow-hidden">

        <!-- Header -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <div
                    class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-md shadow-indigo-200 dark:shadow-none">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-800 dark:text-slate-100 tracking-tight">Kalkulator Berat
                    </h1>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">
                        Kawat (Stranding)</p>
                </div>
            </div>
            <button id="theme-toggle" type="button"
                class="p-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 hover:bg-slate-100 dark:hover:bg-slate-750 active:scale-95 transition-all">
                <svg id="theme-toggle-dark-icon" class="w-4 h-4 text-slate-500 dark:text-slate-400 hidden" fill="none"
                    viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <svg id="theme-toggle-light-icon" class="w-4 h-4 text-amber-500 hidden" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
                </svg>
            </button>
        </div>

        <!-- Inputs container -->
        <div class="space-y-4 flex-1 flex flex-col py-3 overflow-y-auto custom-scrollbar pr-1">

            <!-- Mode Selector -->
            <div
                class="bg-slate-100 dark:bg-slate-800/50 p-1.5 rounded-xl flex gap-1 border border-slate-200/50 dark:border-slate-700/50">
                <button type="button" id="modeWireBtn"
                    class="flex-1 py-1.5 px-3 text-[11px] font-bold rounded-lg bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm transition-all border border-slate-200/50 dark:border-slate-600">Wire
                    Tunggal</button>
                <button type="button" id="modeKonduktorBtn"
                    class="flex-1 py-1.5 px-3 text-[11px] font-bold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all border border-transparent">Konduktor
                    (Stranded)</button>
            </div>

            <!-- Data Referensi -->
            <div>
                <span id="labelBagianReferensi"
                    class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest block mb-1.5">Referensi
                    Kawat Tunggal</span>
                <div class="grid grid-cols-2 gap-3">
                    <div class="relative group">
                        <label id="labelBeratInput" for="beratSatuan"
                            class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Berat
                            Kawat</label>
                        <div class="relative">
                            <input type="number" step="0.01" id="beratSatuan"
                                class="block w-full pl-3 pr-16 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-xs font-semibold"
                                placeholder="Contoh: 20">
                            <div class="absolute inset-y-0 right-0 flex items-center">
                                <select id="satuanBerat"
                                    class="h-full rounded-r-xl border-transparent bg-transparent py-0 pl-2 pr-6 text-slate-500 dark:text-slate-400 focus:ring-0 focus:outline-none text-xs font-bold appearance-none cursor-pointer">
                                    <option value="gram"
                                        class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200">g</option>
                                    <option value="kg"
                                        class="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200">kg
                                    </option>
                                </select>
                                <div
                                    class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-2 text-slate-400 dark:text-slate-500">
                                    <svg class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"
                                            d="M19 9l-7 7-7-7" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="relative group">
                        <label for="panjangAcuan"
                            class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Panjang
                            Acuan (meter)</label>
                        <input type="number" step="0.01" id="panjangAcuan"
                            class="block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-xs font-semibold"
                            placeholder="Contoh: 1" value="1">
                    </div>
                </div>
            </div>

            <!-- Parameter -->
            <div>
                <span id="labelParameter"
                    class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest block mb-1.5">Parameter
                    Stranding</span>
                <div class="grid grid-cols-2 gap-3">
                    <div class="relative group" id="jumlahWireContainer">
                        <label for="jumlahWire"
                            class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Jumlah
                            Wire</label>
                        <input type="number" step="1" id="jumlahWire"
                            class="block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-xs font-semibold"
                            placeholder="Contoh: 50">
                    </div>
                    <div class="relative group" id="panjangTotalContainer">
                        <label for="panjangTotal"
                            class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Panjang
                            Total (meter)</label>
                        <input type="number" step="0.01" id="panjangTotal"
                            class="block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all text-xs font-semibold"
                            placeholder="Contoh: 1" value="1">
                    </div>
                </div>
            </div>

            <!-- Warning Alert (if any error) -->
            <div id="warningAlert"
                class="hidden items-center gap-2 p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/30 border border-rose-200 dark:border-rose-900/50 text-rose-600 dark:text-rose-400 text-[11px] font-semibold transition-all">
                <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                    stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
                <span id="warningText">Pastikan semua kolom diisi dengan angka yang valid.</span>
            </div>

            <!-- Hasil Card -->
            <div id="resultCard"
                class="hidden transition-all duration-300 rounded-2xl p-4 bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/50 mt-auto">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-[11px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">Hasil
                        Kalkulasi</h3>
                    <div
                        class="px-2 py-0.5 rounded border border-indigo-100 dark:border-indigo-800/50 bg-indigo-50 dark:bg-indigo-900/30 text-[10px] font-bold text-indigo-600 dark:text-indigo-400 flex items-center gap-1">
                        <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                        </svg>
                        Tersimpan
                    </div>
                </div>

                <div
                    class="bg-white dark:bg-slate-900 rounded-xl p-4 border border-slate-200/50 dark:border-slate-700/50 shadow-sm flex flex-col items-center justify-center text-center">
                    <p class="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest mb-1">
                        Total Berat Kawat</p>
                    <div class="flex items-baseline gap-1.5">
                        <span id="totalBeratVal"
                            class="text-3xl font-extrabold text-slate-800 dark:text-slate-100 tracking-tight">0</span>
                        <span class="text-sm font-bold text-slate-500 dark:text-slate-400">gram</span>
                    </div>
                    <div id="kgConversion" class="text-xs font-semibold text-indigo-500 dark:text-indigo-400 mt-1">
                        (~ 0 kg)
                    </div>
                </div>

                <div
                    class="mt-4 pt-3 border-t border-slate-200/50 dark:border-slate-700/50 text-[11px] text-slate-500 dark:text-slate-400 font-medium">
                    <span class="block mb-1 font-bold text-slate-700 dark:text-slate-300">Rincian Perhitungan:</span>
                    <span id="rumusDetail"></span>
                </div>
            </div>

        </div>

        <!-- Controls Menu -->
        <div class="grid grid-cols-3 gap-3 pt-3 border-t border-slate-200 dark:border-slate-800">
            <button type="button" onclick="history.back()"
                class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                </svg>
                Kembali
            </button>
            <button type="button" id="resetBtn"
                class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-transparent rounded-xl text-xs font-bold text-white bg-rose-500 hover:bg-rose-600 active:scale-95 transition-all shadow-md shadow-rose-100 dark:shadow-none">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Reset
            </button>
            <a href="./index.html"
                class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Beranda
            </a>
        </div>

        <!-- Footer -->
        <footer
            class="text-center text-slate-400 dark:text-slate-600 text-[10px] mt-3 pt-2 border-t border-slate-200 dark:border-slate-800 font-medium">
            Williyanto Adi 2026
        </footer>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {

            const beratSatuanInput = document.getElementById('beratSatuan');
            const satuanBeratSelect = document.getElementById('satuanBerat');
            const panjangAcuanInput = document.getElementById('panjangAcuan');
            const jumlahWireInput = document.getElementById('jumlahWire');
            const panjangTotalInput = document.getElementById('panjangTotal');

            const resetBtn = document.getElementById('resetBtn');
            const resultCard = document.getElementById('resultCard');
            const warningAlert = document.getElementById('warningAlert');
            const warningText = document.getElementById('warningText');

            const totalBeratVal = document.getElementById('totalBeratVal');
            const kgConversion = document.getElementById('kgConversion');
            const rumusDetail = document.getElementById('rumusDetail');

            const modeWireBtn = document.getElementById('modeWireBtn');
            const modeKonduktorBtn = document.getElementById('modeKonduktorBtn');
            const labelBagianReferensi = document.getElementById('labelBagianReferensi');
            const labelBeratInput = document.getElementById('labelBeratInput');
            const labelParameter = document.getElementById('labelParameter');
            const jumlahWireContainer = document.getElementById('jumlahWireContainer');
            const panjangTotalContainer = document.getElementById('panjangTotalContainer');

            let currentMode = 'wire';

            function updateUIForMode() {
                if (currentMode === 'wire') {
                    // Update buttons
                    modeWireBtn.className = "flex-1 py-1.5 px-3 text-[11px] font-bold rounded-lg bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm transition-all border border-slate-200/50 dark:border-slate-600";
                    modeKonduktorBtn.className = "flex-1 py-1.5 px-3 text-[11px] font-bold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all border border-transparent";

                    // Update labels
                    labelBagianReferensi.innerText = "Referensi Kawat Tunggal";
                    labelBeratInput.innerText = "Berat Kawat";
                    labelParameter.innerText = "Parameter Stranding";

                    // Show jumlah wire
                    jumlahWireContainer.classList.remove('hidden');
                    panjangTotalContainer.classList.remove('col-span-2');
                } else {
                    // Update buttons
                    modeKonduktorBtn.className = "flex-1 py-1.5 px-3 text-[11px] font-bold rounded-lg bg-white dark:bg-slate-700 text-indigo-600 dark:text-indigo-400 shadow-sm transition-all border border-slate-200/50 dark:border-slate-600";
                    modeWireBtn.className = "flex-1 py-1.5 px-3 text-[11px] font-bold rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 transition-all border border-transparent";

                    // Update labels
                    labelBagianReferensi.innerText = "Referensi Konduktor";
                    labelBeratInput.innerText = "Berat Konduktor";
                    labelParameter.innerText = "Parameter Kalkulasi";

                    // Hide jumlah wire, make panjang total full width
                    jumlahWireContainer.classList.add('hidden');
                    panjangTotalContainer.classList.add('col-span-2');
                }
                triggerCalculation();
            }

            modeWireBtn.addEventListener('click', () => {
                if (currentMode !== 'wire') {
                    currentMode = 'wire';
                    updateUIForMode();
                }
            });

            modeKonduktorBtn.addEventListener('click', () => {
                if (currentMode !== 'konduktor') {
                    currentMode = 'konduktor';
                    updateUIForMode();
                }
            });

            function hitungBerat() {
                let berat = parseFloat(beratSatuanInput.value);
                const satuan = satuanBeratSelect.value;
                const pAcuan = parseFloat(panjangAcuanInput.value);
                let jmlWire = currentMode === 'wire' ? parseInt(jumlahWireInput.value) : 1;
                const pTotal = parseFloat(panjangTotalInput.value);

                if (isNaN(berat) || isNaN(pAcuan) || isNaN(jmlWire) || isNaN(pTotal) || pAcuan <= 0) {
                    warningText.innerText = "Pastikan semua kolom diisi dengan angka yang valid (Panjang acuan harus > 0).";
                    warningAlert.classList.remove('hidden');
                    warningAlert.classList.add('flex');
                    resultCard.classList.add('hidden');
                    return;
                }

                warningAlert.classList.add('hidden');
                warningAlert.classList.remove('flex');

                // Convert to grams if kg is selected
                if (satuan === 'kg') {
                    berat = berat * 1000;
                }

                // Formula: (berat per satuan panjang) * jumlah wire * panjang total
                const beratPerMeter = berat / pAcuan;
                const totalBeratGram = beratPerMeter * jmlWire * pTotal;

                totalBeratVal.innerText = totalBeratGram.toLocaleString('id-ID', { maximumFractionDigits: 2 });

                if (totalBeratGram >= 1000) {
                    kgConversion.innerText = `(~ ${(totalBeratGram / 1000).toLocaleString('id-ID', { maximumFractionDigits: 3 })} kg)`;
                    kgConversion.classList.remove('hidden');
                } else {
                    kgConversion.classList.add('hidden');
                }

                const originalBeratStr = `${parseFloat(beratSatuanInput.value)}${satuan === 'kg' ? 'kg' : 'g'}`;
                if (currentMode === 'wire') {
                    rumusDetail.innerHTML = `(${originalBeratStr} / ${pAcuan}m) &times; ${jmlWire} wire &times; ${pTotal}m = <b>${totalBeratGram.toLocaleString('id-ID', { maximumFractionDigits: 2 })} gram</b>`;
                } else {
                    rumusDetail.innerHTML = `(${originalBeratStr} / ${pAcuan}m) &times; ${pTotal}m = <b>${totalBeratGram.toLocaleString('id-ID', { maximumFractionDigits: 2 })} gram</b>`;
                }

                resultCard.classList.remove('hidden');
                resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            function triggerCalculation() {
                const canCalculateWire = currentMode === 'wire' && beratSatuanInput.value && panjangAcuanInput.value && jumlahWireInput.value && panjangTotalInput.value;
                const canCalculateKonduktor = currentMode === 'konduktor' && beratSatuanInput.value && panjangAcuanInput.value && panjangTotalInput.value;

                if (canCalculateWire || canCalculateKonduktor) {
                    hitungBerat();
                } else {
                    resultCard.classList.add('hidden');
                    warningAlert.classList.add('hidden');
                }
            }

            // Real-time calculation if all filled
            [beratSatuanInput, panjangAcuanInput, jumlahWireInput, panjangTotalInput, satuanBeratSelect].forEach(input => {
                input.addEventListener('input', triggerCalculation);
            });

            resetBtn.addEventListener('click', () => {
                beratSatuanInput.value = '';
                satuanBeratSelect.value = 'gram';
                panjangAcuanInput.value = '1';
                jumlahWireInput.value = '';
                panjangTotalInput.value = '1';
                resultCard.classList.add('hidden');
                warningAlert.classList.add('hidden');
            });

            // Dark Mode Logic
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                themeToggleLightIcon.classList.remove('hidden');
            } else {
                themeToggleDarkIcon.classList.remove('hidden');
            }

            themeToggleBtn.addEventListener('click', function () {
                themeToggleDarkIcon.classList.toggle('hidden');
                themeToggleLightIcon.classList.toggle('hidden');
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            });

        });
    </script>
</body>

</html>
