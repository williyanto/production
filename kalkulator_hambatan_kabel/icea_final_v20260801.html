                "35": "0.962", "36": "0.955", "37": "0.947", "38": "0.940", "39": "0.932",
                "40": "0.925"
            }
        };

        // Spek Maksimum (ICEA) basis Ω/kfeet
        const specMaxValues = {
            CU: {
                "8": "0,66504", "7": "0,52938", "6": "0,41922", "5": "0,33150", "4": "0,26316", "3": "0,20910", "2": "0,16524", "1": "0,13158", "1/0": "0,10404", "2/0": "0,08262", "3/0": "0,06548", "4/0": "0,05202", "250": "0,04396", "300": "0,03672", "350": "0,03142", "400": "0,02744", "450": "0,02448", "500": "0,02203", "550": "0,01999", "600": "0,01836", "650": "0,01693", "700": "0,01571", "750": "0,01469", "800": "0,01377", "900": "0,01224", "1000": "0,01102", "1100": "0,01001", "1200": "0,00917", "1250": "0,00880", "1300": "0,00847", "1400": "0,00786", "1500": "0,00733", "1600": "0,00687", "1700": "0,00647", "1750": "0,00628", "1800": "0,00611", "1900": "0,00579", "2000": "0,00550", "2500": "0,00445", "3000": "0,00370"
            },
            AL: {
                "8": "1,09140", "7": "0,86802", "6": "0,68850", "5": "0,54468", "4": "0,43248", "3": "0,34068", "2": "0,27132", "1": "0,21522", "1/0": "0,17136", "2/0": "0,13566", "3/0": "0,10710", "4/0": "0,08527", "250": "0,07211", "300": "0,06018", "350": "0,05151", "400": "0,04508", "450": "0,04009", "500": "0,03611", "550": "0,03274", "600": "0,03009", "650": "0,02774", "700": "0,02581", "750": "0,02407", "800": "0,02254", "900": "0,01999", "1000": "0,01805", "1100": "0,01642", "1200": "0,01499", "1250": "0,01438", "1300": "0,01387", "1400": "0,01285", "1500": "0,01204", "1600": "0,01132", "1700": "0,01061", "1750": "0,01030", "1800": "0,01002", "1900": "0,00950", "2000": "0,00903", "2500": "0,00729", "3000": "0,00608"
            }
        };

        // Spek Sesuai Tabel (nilai tabel langsung)
        const specSesuaiTabelValues = {
            CU: {
                "8": "0,652", "7": "0,519", "6": "0,411", "5": "0,325", "4": "0,258", "3": "0,205", "2": "0,162", "1": "0,129", "1/0": "0,102", "2/0": "0,0810", "3/0": "0,0642", "4/0": "0,0510", "250": "0,0431", "300": "0,0360", "350": "0,0308", "400": "0,0269", "450": "0,0240", "500": "0,0216", "550": "0,0196", "600": "0,0180", "650": "0,0166", "700": "0,0154", "750": "0,0144", "800": "0,0135", "900": "0,0120", "1000": "0,0108", "1100": "0,00981", "1200": "0,00899", "1250": "0,00863", "1300": "0,00830", "1400": "0,00771", "1500": "0,00719", "1600": "0,00674", "1700": "0,00634", "1750": "0,00616", "1800": "0,00599", "1900": "0,00568", "2000": "0,00539", "2500": "0,00436", "3000": "0,00363"
            },
            AL: {
                "8": "1,07", "7": "0,851", "6": "0,675", "5": "0,534", "4": "0,424", "3": "0,334", "2": "0,266", "1": "0,211", "1/0": "0,168", "2/0": "0,133", "3/0": "0,105", "4/0": "0,0836", "250": "0,0707", "300": "0,0590", "350": "0,0505", "400": "0,0442", "450": "0,0393", "500": "0,0354", "550": "0,0321", "600": "0,0295", "650": "0,0272", "700": "0,0253", "750": "0,0236", "800": "0,0221", "900": "0,0196", "1000": "0,0177", "1100": "0,0161", "1200": "0,0147", "1250": "0,0141", "1300": "0,0136", "1400": "0,0126", "1500": "0,0118", "1600": "0,0111", "1700": "0,0104", "1750": "0,0101", "1800": "0,00982", "1900": "0,00931", "2000": "0,00885", "2500": "0,00715", "3000": "0,00596"
            }
        };

        // DOM elements
        const pembacaanAlatInput = document.getElementById('pembacaanAlat');
        const panjangInput = document.getElementById('panjang');
        const suhuInput = document.getElementById('suhu');
        const faktorKoreksiInput = document.getElementById('faktorKoreksi');
        const konduktorSelect = document.getElementById('konduktor');
        const penampangSelect = document.getElementById('penampang');
        const spekMaxInput = document.getElementById('spekMax');
        const hasilKalkulasiInput = document.getElementById('hasilKalkulasi');
        const pesanHasil = document.getElementById('pesanHasil');
        const spekTabelSpan = document.getElementById('spekTabel');
        const hapusBtn = document.getElementById('hapusBtn');

        function validateNumericInput(event) {
            let val = event.target.value.replace(/,/g, '.');
            const parts = val.split('.');
            if (parts.length > 2) val = parts[0] + '.' + parts.slice(1).join('');
            event.target.value = val.replace(/[^0-9.]/g, '');
        }

        let currentMode = 'hambatan';

        function hitungHasil() {
            hasilKalkulasiInput.classList.remove('text-green-500', 'text-red-500', 'text-green-600', 'dark:text-green-400', 'text-slate-750', 'dark:text-slate-250');
            pesanHasil.className = 'text-center text-xs font-semibold leading-snug min-h-[1.1rem] transition-colors duration-300 mt-auto';
            pesanHasil.innerText = '';

            if (currentMode === 'panjang') {
                const pembacaan = parseFloat(pembacaanAlatInput.value.replace(',', '.'));
                const acuan = parseFloat(panjangInput.value.replace(',', '.'));
                const koreksi = parseFloat(faktorKoreksiInput.value.replace(',', '.'));
                
                if (!isNaN(pembacaan) && !isNaN(acuan) && !isNaN(koreksi) && acuan !== 0) {
                    const estimasiFeet = (pembacaan * koreksi) / acuan;
                    const estimasiMeter = estimasiFeet * 0.3048;
                    hasilKalkulasiInput.value = estimasiFeet.toFixed(2);
                    hasilKalkulasiInput.classList.add('text-green-600', 'dark:text-green-400');
                    
                    pesanHasil.innerText = `Setara dengan ${estimasiMeter.toFixed(2)} Meter (${(estimasiMeter/1000).toFixed(3)} km).`;
                    pesanHasil.classList.add('text-emerald-600', 'dark:text-emerald-400');
                } else {
                    hasilKalkulasiInput.value = '';
                    hasilKalkulasiInput.classList.add('text-slate-750', 'dark:text-slate-250');
                }
                updateResultCardVisuals();
                return;
            }

            const pembacaan = parseFloat(pembacaanAlatInput.value.replace(',', '.'));
            const panjang = parseFloat(panjangInput.value.replace(',', '.'));
            const koreksi = parseFloat(faktorKoreksiInput.value.replace(',', '.'));

            if (!isNaN(pembacaan) && !isNaN(panjang) && !isNaN(koreksi) && panjang !== 0) {
                const hasil = (pembacaan / panjang) * koreksi;
                hasilKalkulasiInput.value = hasil.toFixed(4);

                const spekMaxRaw = spekMaxInput.value.trim();
                const spekMax = parseFloat(spekMaxRaw.replace(',', '.'));

                if (!isNaN(spekMax)) {
                    if (hasil <= spekMax) {
                        hasilKalkulasiInput.classList.add('text-green-500');
                        pesanHasil.innerText = 'Hasil pengujian memenuhi spesifikasi standar.';
                        pesanHasil.classList.add('text-green-600', 'dark:text-green-400');
                    } else {
                        hasilKalkulasiInput.classList.add('text-red-500');
                        pesanHasil.innerText = 'Hasil pengujian tidak memenuhi spesifikasi standar.';
                        pesanHasil.classList.add('text-rose-600', 'dark:text-rose-400');
                    }
                }
            } else {
                hasilKalkulasiInput.value = '';
                hasilKalkulasiInput.classList.add('text-slate-750', 'dark:text-slate-250');
            }
            updateResultCardVisuals();
        }

        function updateFaktorKoreksi() {
            const suhuValueRaw = suhuInput.value.replace(',', '.');
            const suhuNumber = parseFloat(suhuValueRaw);
            faktorKoreksiInput.value = '';
            if (!isNaN(suhuNumber)) {
                const suhuKey = String(Math.round(suhuNumber));
                const konduktorValue = konduktorSelect.value;
                const currentFactors = correctionFactors[konduktorValue];
                if (currentFactors && currentFactors[suhuKey]) {
                    faktorKoreksiInput.value = currentFactors[suhuKey];
                } else {
                    // Fallback formula ICEA: basis 25°C, alpha = 0.00393 (CU) / 0.00403 (AL)
                    const alpha = (konduktorValue === 'AL') ? 0.00403 : 0.00393;
                    const factor = (1 + alpha * 25) / (1 + alpha * suhuNumber);
                    if (factor > 0) faktorKoreksiInput.value = factor.toFixed(4);
                }
            }
            hitungHasil();
        }

        function updateSpekMax() {
            const konduktorValue = konduktorSelect.value;
            const penampangValue = penampangSelect.value;
            const currentSpec = specMaxValues[konduktorValue];
            if (currentSpec && currentSpec[penampangValue]) {
                spekMaxInput.value = currentSpec[penampangValue];
                if (currentMode === 'panjang') {
                    panjangInput.value = currentSpec[penampangValue];
                }
            } else {
                spekMaxInput.value = '';
                if (currentMode === 'panjang') {
                    panjangInput.value = '';
                }
            }
            hitungHasil();
        }

        function updateSpekTabel() {
            const konduktorValue = konduktorSelect.value;
            const penampangValue = penampangSelect.value;
            const currentData = specSesuaiTabelValues[konduktorValue];
            if (currentData && currentData[penampangValue]) {
                spekTabelSpan.innerText = currentData[penampangValue];
            } else {
                spekTabelSpan.innerText = '-';
            }
        }

        function hapus() {
            pembacaanAlatInput.value = '';
            panjangInput.value = '';
            suhuInput.value = '';
            faktorKoreksiInput.value = '';
            hasilKalkulasiInput.value = '';
            pesanHasil.innerText = '';
            updateFaktorKoreksi();
            updateResultCardVisuals();
        }

        function updateResultCardVisuals() {
            const card = document.getElementById('resultCard');
            const statusIcon = document.getElementById('statusIcon');

            if (currentMode === 'panjang' && hasilKalkulasiInput.value !== '') {
                card.className = "transition-all duration-300 rounded-2xl p-4 bg-emerald-500/10 dark:bg-emerald-950/20 border border-emerald-500/30 dark:border-emerald-500/25 shadow-lg shadow-emerald-100/30 dark:shadow-none text-center relative overflow-hidden my-1 flex flex-col justify-center items-center flex-1";
                statusIcon.innerHTML = `<svg class="w-5 h-5 text-emerald-500 dark:text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>`;
                statusIcon.classList.remove('hidden');
                return;
            }

            const hasPass = hasilKalkulasiInput.classList.contains('text-green-500');
            const hasFail = hasilKalkulasiInput.classList.contains('text-red-500');
            if (hasPass) {
                card.className = "transition-all duration-300 rounded-2xl p-4 bg-emerald-500/10 dark:bg-emerald-950/20 border border-emerald-500/30 dark:border-emerald-500/25 shadow-lg shadow-emerald-100/30 dark:shadow-none text-center relative overflow-hidden my-1 flex flex-col justify-center items-center flex-1";
                statusIcon.innerHTML = `<svg class="w-5 h-5 text-green-500 dark:text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
                statusIcon.classList.remove('hidden');
            } else if (hasFail) {
                card.className = "transition-all duration-300 rounded-2xl p-4 bg-rose-500/10 dark:bg-rose-950/20 border border-rose-500/30 dark:border-rose-500/25 shadow-lg shadow-rose-100/30 dark:shadow-none text-center relative overflow-hidden my-1 flex flex-col justify-center items-center flex-1";
                statusIcon.innerHTML = `<svg class="w-5 h-5 text-rose-500 dark:text-rose-450" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
                statusIcon.classList.remove('hidden');
            } else {
                card.className = "transition-all duration-300 rounded-2xl p-4 bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/50 text-center relative overflow-hidden my-1 flex flex-col justify-center items-center flex-1";
                statusIcon.innerHTML = '';
                statusIcon.classList.add('hidden');
            }
        }

        // Dark Mode
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            if (localStorage.getItem('color-theme') === 'light') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            }
        });

        pembacaanAlatInput.addEventListener('input', validateNumericInput);
        panjangInput.addEventListener('input', validateNumericInput);
        suhuInput.addEventListener('input', validateNumericInput);
        pembacaanAlatInput.addEventListener('input', hitungHasil);
        panjangInput.addEventListener('input', hitungHasil);
        suhuInput.addEventListener('input', updateFaktorKoreksi);
        const modeHambatanBtn = document.getElementById('modeHambatanBtn');
        const modePanjangBtn = document.getElementById('modePanjangBtn');
        const labelPanjang = document.getElementById('labelPanjang');
        const resultTitle = document.getElementById('resultTitle');
        const resultUnit = document.getElementById('resultUnit');

        modeHambatanBtn.addEventListener('click', () => {
            currentMode = 'hambatan';
            modeHambatanBtn.className = "flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition-all duration-200 bg-white dark:bg-slate-700 text-green-600 dark:text-green-300 shadow-sm border border-slate-200/50 dark:border-slate-600/30";
            modePanjangBtn.className = "flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
            labelPanjang.innerText = "Panjang (feet)";
            panjangInput.placeholder = "feet";
            panjangInput.value = "";
            resultTitle.innerText = "Hasil Kalkulasi";
            resultUnit.innerText = "Ohm / Kilo-Feet (Ω/kfeet)";
            hitungHasil();
        });

        modePanjangBtn.addEventListener('click', () => {
            currentMode = 'panjang';
            modePanjangBtn.className = "flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition-all duration-200 bg-white dark:bg-slate-700 text-green-600 dark:text-green-300 shadow-sm border border-slate-200/50 dark:border-slate-600/30";
            modeHambatanBtn.className = "flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200";
            labelPanjang.innerText = "Acuan (Ω/kfeet)";
            panjangInput.placeholder = "Ω/kfeet (Spek)";
            panjangInput.value = spekMaxInput.value;
            resultTitle.innerText = "Estimasi Panjang Kabel";
            resultUnit.innerText = "Feet (ft)";
            hitungHasil();
        });

        konduktorSelect.addEventListener('change', () => {
            updateFaktorKoreksi();
            updateSpekMax();
            updateSpekTabel();
        });
        penampangSelect.addEventListener('change', () => {
            updateSpekMax();
            updateSpekTabel();
        });
        hapusBtn.addEventListener('click', () => {
            hapus();
            if (currentMode === 'panjang') {
                panjangInput.value = spekMaxInput.value;
            }
            hitungHasil();
        });

        updateFaktorKoreksi();
        updateSpekMax();
        updateSpekTabel();
        hitungHasil();
    });
    </script>
