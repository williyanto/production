<!DOCTYPE html>
<html lang="id" class="transition-all duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Faktor Koreksi Suhu</title>
    <link rel="icon" type="image/png" href="./icons/williyanto_logo_rounded.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        select {
            background-image: none !important;
        }
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gradient-to-tr from-slate-100 via-indigo-50/30 to-slate-100 dark:from-slate-950 dark:via-slate-900/60 dark:to-slate-950 min-h-[100dvh] flex flex-col justify-center items-center py-2 px-3 overflow-x-hidden transition-colors duration-300">

    <!-- Ambient Background Blobs -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40 dark:opacity-20 hidden md:block">
        <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-indigo-400 blur-[100px] animate-pulse"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-sky-400 blur-[100px] animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-3xl border border-slate-200/50 dark:border-slate-800/80 shadow-xl p-4 sm:p-5 transition-all duration-300 flex flex-col w-full max-h-[calc(100dvh-1rem)] my-auto overflow-hidden">
        
        <!-- Header -->
        <div class="flex items-center justify-between pb-2.5 sm:pb-3 border-b border-slate-200/80 dark:border-slate-800 shrink-0">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-200 dark:shadow-none shrink-0">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14 14.76V3.5a2.5 2.5 0 00-5 0v11.26a4.5 4.5 0 105 0z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-800 dark:text-slate-100 tracking-tight">Faktor Koreksi Suhu</h1>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">IEC • ICEA • AS/NZS • SPLN</p>
                </div>
            </div>
            
            <!-- Dark Mode Toggle Button -->
            <button id="theme-toggle" type="button" class="p-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 hover:bg-slate-100 dark:hover:bg-slate-700 active:scale-95 transition-all shrink-0" title="Ganti Tema">
                <svg id="theme-toggle-dark-icon" class="w-4 h-4 text-slate-500 dark:text-slate-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <svg id="theme-toggle-light-icon" class="w-4 h-4 text-amber-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
                </svg>
            </button>
        </div>

        <!-- Segmented Standard Switcher (Persis gaya iec_final) -->
        <div class="grid grid-cols-4 p-1 bg-slate-100 dark:bg-slate-800/80 rounded-xl my-2 border border-slate-200/20 dark:border-slate-700/20 shrink-0">
            <button type="button" onclick="setStandard('IEC')" id="tabIEC" class="tab-std text-center py-1.5 px-1 rounded-lg text-xs font-bold transition-all duration-200 bg-white dark:bg-slate-700 text-sky-600 dark:text-sky-300 shadow-sm border border-slate-200/50 dark:border-slate-600/30">IEC</button>
            <button type="button" onclick="setStandard('ICEA')" id="tabICEA" class="tab-std text-center py-1.5 px-1 rounded-lg text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">ICEA</button>
            <button type="button" onclick="setStandard('AS/NZS')" id="tabASNZS" class="tab-std text-center py-1.5 px-1 rounded-lg text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">AS/NZS</button>
            <button type="button" onclick="setStandard('SPLN')" id="tabSPLN" class="tab-std text-center py-1.5 px-1 rounded-lg text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">SPLN</button>
        </div>

        <!-- Inputs and controls container -->
        <div class="space-y-3 flex-1 flex flex-col justify-between my-1 px-1 -mx-1 overflow-y-auto scrollbar-none">
            
            <div class="space-y-2.5">
                <!-- Group 1: Material Konduktor Toggle (Persis Mode Selector di iec_final) -->
                <div>
                    <span class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest block mb-1.5">Jenis Konduktor</span>
                    <div class="flex p-1 bg-slate-100 dark:bg-slate-800/80 rounded-xl border border-slate-200/20 dark:border-slate-700/20">
                        <button type="button" onclick="setConductor('Cu')" id="btnCondCu" class="flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition-all duration-200 bg-white dark:bg-slate-700 text-sky-600 dark:text-sky-300 shadow-sm border border-slate-200/50 dark:border-slate-600/30">
                            🥉 Tembaga (Cu)
                        </button>
                        <button type="button" onclick="setConductor('Al')" id="btnCondAl" class="flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200">
                            ⚪ Aluminium (Al)
                        </button>
                    </div>
                </div>

                <!-- Group 2: Suhu Pengujian -->
                <div>
                    <div class="flex items-center justify-between mb-1.5">
                        <span class="text-[10px] font-extrabold text-slate-400 dark:text-slate-500 uppercase tracking-widest block">Suhu Pengujian</span>
                        <span class="text-[9px] font-mono text-slate-400 dark:text-slate-500">Rentang: -40°C ~ 300°C</span>
                    </div>

                    <!-- Input Suhu -->
                    <div class="relative group">
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-sky-500 transition-colors">
                                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M14 14.76V3.5a2.5 2.5 0 00-5 0v11.26a4.5 4.5 0 105 0z" />
                                </svg>
                            </div>
                            <input type="text" inputmode="decimal" id="suhuInput" oninput="hitungKoreksi()" class="pl-9 pr-9 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all text-xs font-semibold font-mono" placeholder="20">
                            <div class="absolute inset-y-0 right-0 pr-2.5 flex items-center pointer-events-none">
                                <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 font-mono">°C</span>
                            </div>
                        </div>
                    </div>

                    <!-- Preset Quick Temperature Buttons -->
                    <div class="grid grid-cols-5 gap-1.5 mt-2">
                        <button type="button" onclick="setPresetTemp(20)" class="py-1 px-1 rounded-lg text-center text-[10px] font-bold transition-all bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-sky-50 hover:text-sky-600 dark:hover:bg-slate-700/80 border border-slate-200/50 dark:border-slate-700/50 font-mono active:scale-95" title="Standar 20°C">20°C</button>
                        <button type="button" onclick="setPresetTemp(25)" class="py-1 px-1 rounded-lg text-center text-[10px] font-bold transition-all bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-sky-50 hover:text-sky-600 dark:hover:bg-slate-700/80 border border-slate-200/50 dark:border-slate-700/50 font-mono active:scale-95" title="Ambien 25°C">25°C</button>
                        <button type="button" onclick="setPresetTemp(30)" class="py-1 px-1 rounded-lg text-center text-[10px] font-bold transition-all bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-sky-50 hover:text-sky-600 dark:hover:bg-slate-700/80 border border-slate-200/50 dark:border-slate-700/50 font-mono active:scale-95" title="Tropis 30°C">30°C</button>
                        <button type="button" onclick="setPresetTemp(70)" class="py-1 px-1 rounded-lg text-center text-[10px] font-bold transition-all bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-sky-50 hover:text-sky-600 dark:hover:bg-slate-700/80 border border-slate-200/50 dark:border-slate-700/50 font-mono active:scale-95" title="PVC Max 70°C">70°C</button>
                        <button type="button" onclick="setPresetTemp(90)" class="py-1 px-1 rounded-lg text-center text-[10px] font-bold transition-all bg-slate-100 dark:bg-slate-800/80 text-slate-600 dark:text-slate-300 hover:bg-sky-50 hover:text-sky-600 dark:hover:bg-slate-700/80 border border-slate-200/50 dark:border-slate-700/50 font-mono active:scale-95" title="XLPE Max 90°C">90°C</button>
                    </div>
                </div>

                <!-- Hidden legacy selects for full backward compatibility -->
                <select id="specSelect" onchange="hitungKoreksi()" class="hidden">
                    <option value="IEC" selected>IEC Standard</option>
                    <option value="ICEA">ICEA Standard</option>
                    <option value="AS/NZS">AS/NZS Standard</option>
                    <option value="SPLN">SPLN Standard</option>
                </select>
                <select id="conductorTypeSelect" onchange="hitungKoreksi()" class="hidden">
                    <option value="Cu" selected>Tembaga (Cu)</option>
                    <option value="Al">Aluminium (Al)</option>
                </select>
            </div>

            <!-- Dynamic Result Card (Persis gaya iec_final) -->
            <div id="resultCard" class="transition-all duration-300 rounded-2xl p-3.5 sm:p-4 bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/50 text-center relative overflow-hidden my-1 flex flex-col justify-center items-center flex-1 min-h-[140px]">
                <div class="absolute -right-10 -bottom-10 w-24 h-24 rounded-full bg-sky-500/5 blur-xl pointer-events-none"></div>
                
                <div class="w-full flex items-center justify-between mb-1">
                    <span id="resultTitle" class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">Faktor Koreksi Suhu (k₂₀)</span>
                    <span id="badgeStandardActive" class="text-[9px] font-mono font-bold text-sky-600 dark:text-sky-400 bg-sky-100/70 dark:bg-sky-900/40 px-2 py-0.5 rounded-md">IEC • Cu</span>
                </div>
                
                <div class="my-auto py-1 w-full">
                    <span id="hasilKoreksi" class="w-full text-center bg-transparent font-extrabold text-3xl sm:text-4xl text-sky-600 dark:text-sky-300 font-mono tracking-tight transition-colors duration-300 block py-0">---</span>
                    <span id="resultUnit" class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest block mt-1">Koefisien Pengali (R₂₀ = Rt × k)</span>
                </div>
                
                <div class="mt-auto pt-1 w-full flex items-center justify-center">
                    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-white dark:bg-slate-800/90 border border-slate-200/60 dark:border-slate-700/60 shadow-xs">
                        <span class="text-[9px] font-extrabold text-sky-500 dark:text-sky-400 uppercase tracking-wider">Rumus</span>
                        <span id="formulaText" class="text-[10.5px] font-mono font-semibold text-slate-600 dark:text-slate-300">k = 254.5 / (234.5 + t)</span>
                    </div>
                </div>
            </div>
            
            <!-- Controls Menu -->
            <div class="grid grid-cols-3 gap-2.5 pt-2.5 border-t border-slate-100 dark:border-slate-800">
                <button type="button" onclick="if(window.top!==window.self&&window.parent.closePreviewModal){window.parent.closePreviewModal();}else{history.back();}" class="flex items-center justify-center gap-1.5 py-1.5 sm:py-2 px-2 border border-slate-200 dark:border-slate-700/80 rounded-full text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Kembali
                </button>
                
                <button type="button" id="btnReset" class="flex items-center justify-center gap-1.5 py-1.5 sm:py-2 px-2 border border-transparent rounded-full text-xs font-bold text-white bg-rose-500 hover:bg-rose-600 active:scale-95 transition-all shadow-md shadow-rose-100 dark:shadow-none">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    Reset
                </button>
                
                <a href="index.html" class="flex items-center justify-center gap-1.5 py-1.5 sm:py-2 px-2 border border-slate-200 dark:border-slate-700/80 rounded-full text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    Beranda
                </a>
            </div>

        </div>

        <!-- Footer -->
        <footer class="text-center text-slate-400 dark:text-slate-600 text-[10px] mt-2 pt-2 border-t border-slate-100 dark:border-slate-800 font-medium shrink-0">
            Williyanto Adi 2026
        </footer>

    </div>

    <!-- Script Logic -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const specSelect = document.getElementById('specSelect');
        const conductorTypeSelect = document.getElementById('conductorTypeSelect');
        const inputSuhu = document.getElementById('suhuInput');
        const displayHasil = document.getElementById('hasilKoreksi');
        const formulaDisplay = document.getElementById('formulaText');
        const activeBadge = document.getElementById('badgeStandardActive');

        const specs = {
          IEC: {
            Cu: { base: 'k = 254.5 / (234.5 + t)', constant1: 254.5, constant2: 234.5 },
            Al: { base: 'k = 248 / (228 + t)', constant1: 248, constant2: 228 }
          },
          ICEA: {
            Cu: { base: 'k = 259.5 / (234.5 + t)', constant1: 259.5, constant2: 234.5 },
            Al: { base: 'k = 253.0 / (228.0 + t)', constant1: 253.0, constant2: 228.0 }
          },
          'AS/NZS': {
            Cu: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 },
            Al: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 }
          },
          SPLN: {
            Cu: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 },
            Al: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 }
          }
        };

        const stdTabIds = {
            'IEC': 'tabIEC',
            'ICEA': 'tabICEA',
            'AS/NZS': 'tabASNZS',
            'SPLN': 'tabSPLN'
        };

        function updateTabStyles() {
            const currentStd = specSelect.value;
            Object.keys(stdTabIds).forEach(std => {
                const btn = document.getElementById(stdTabIds[std]);
                if (!btn) return;
                if (std === currentStd) {
                    btn.className = "tab-std text-center py-1.5 px-1 rounded-lg text-xs font-bold transition-all duration-200 bg-white dark:bg-slate-700 text-sky-600 dark:text-sky-300 shadow-sm border border-slate-200/50 dark:border-slate-600/30";
                } else {
                    btn.className = "tab-std text-center py-1.5 px-1 rounded-lg text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-white/40 dark:hover:bg-slate-800/50 border border-transparent";
                }
            });
        }

        function updateConductorStyles() {
            const currentCond = conductorTypeSelect.value;
            const btnCu = document.getElementById('btnCondCu');
            const btnAl = document.getElementById('btnCondAl');
            if (btnCu && btnAl) {
                if (currentCond === 'Cu') {
                    btnCu.className = "flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition-all duration-200 bg-white dark:bg-slate-700 text-sky-600 dark:text-sky-300 shadow-sm border border-slate-200/50 dark:border-slate-600/30";
                    btnAl.className = "flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 border border-transparent";
                } else {
                    btnAl.className = "flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition-all duration-200 bg-white dark:bg-slate-700 text-sky-600 dark:text-sky-300 shadow-sm border border-slate-200/50 dark:border-slate-600/30";
                    btnCu.className = "flex-1 py-1.5 px-2 rounded-lg text-xs font-bold transition-all duration-200 text-slate-500 dark:text-slate-400 hover:text-slate-800 dark:hover:text-slate-200 border border-transparent";
                }
            }
        }

        window.setStandard = function(std) {
            specSelect.value = std;
            updateTabStyles();
            hitungKoreksi();
        };

        window.setConductor = function(cond) {
            conductorTypeSelect.value = cond;
            updateConductorStyles();
            hitungKoreksi();
        };

        window.setPresetTemp = function(tempVal) {
            inputSuhu.value = tempVal;
            hitungKoreksi();
        };

        window.hitungKoreksi = function() {
          const spesifikasi = specSelect.value;
          const conductorType = conductorTypeSelect.value;
          let rawVal = inputSuhu.value.replace(/,/g, '.');
          const suhu = parseFloat(rawVal);
          const currentFormulaData = specs[spesifikasi][conductorType];

          if (activeBadge) {
            activeBadge.textContent = `${spesifikasi} • ${conductorType}`;
          }

          displayHasil.classList.remove('text-rose-600', 'dark:text-rose-400');
          displayHasil.classList.add('text-sky-600', 'dark:text-sky-300');
          inputSuhu.classList.remove('border-rose-400', 'dark:border-rose-500');

          if (isNaN(suhu)) {
            displayHasil.textContent = '---';
            formulaDisplay.textContent = currentFormulaData.base;
            return;
          }

          const penyebut = currentFormulaData.constant2 + suhu;

          if (penyebut === 0 || suhu < -40 || suhu > 300) {
            displayHasil.textContent = 'Tidak Valid';
            displayHasil.classList.remove('text-sky-600', 'dark:text-sky-300');
            displayHasil.classList.add('text-rose-600', 'dark:text-rose-400');
            inputSuhu.classList.add('border-rose-400', 'dark:border-rose-500');
            formulaDisplay.textContent = currentFormulaData.base.replace('t', suhu);
            return;
          }

          const faktorKoreksi = currentFormulaData.constant1 / penyebut;

          if (spesifikasi === 'ICEA' || spesifikasi === 'AS/NZS' || spesifikasi === 'SPLN') {
            displayHasil.textContent = faktorKoreksi.toFixed(3);
          } else {
            displayHasil.textContent = faktorKoreksi.toFixed(4);
          }

          formulaDisplay.textContent = currentFormulaData.base.replace('t', suhu);
        };

        updateTabStyles();
        updateConductorStyles();
        hitungKoreksi();

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        function updateThemeIcons() {
            if (document.documentElement.classList.contains('dark')) {
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
            } else {
                themeToggleLightIcon.classList.add('hidden');
                themeToggleDarkIcon.classList.remove('hidden');
            }
        }
        updateThemeIcons();

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
                updateThemeIcons();
            });
        }

        const btnReset = document.getElementById('btnReset');
        if(btnReset) {
          btnReset.addEventListener('click', () => {
            specSelect.value = 'IEC';
            conductorTypeSelect.value = 'Cu';
            inputSuhu.value = '20';
            updateTabStyles();
            updateConductorStyles();
            hitungKoreksi();
          });
        }
    });
    </script>
</body>
</html>
