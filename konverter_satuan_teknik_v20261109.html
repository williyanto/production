            }

            function populateUnitDropdowns() {
                const cfg = getActiveCatConfig();
                selectSatuanMainLength.innerHTML = '';
                selectSatuanOutputLength.innerHTML = '';

                cfg.units.forEach(u => {
                    const optFrom = document.createElement('option');
                    optFrom.value = u.value;
                    optFrom.textContent = u.text;
                    if (u.value === cfg.defaultFrom) optFrom.selected = true;
                    selectSatuanMainLength.appendChild(optFrom);

                    const optTo = document.createElement('option');
                    optTo.value = u.value;
                    optTo.textContent = u.text;
                    if (u.value === cfg.defaultTo) optTo.selected = true;
                    selectSatuanOutputLength.appendChild(optTo);
                });

                if (labelInputValue) labelInputValue.textContent = cfg.inputLabel;
                if (inputValueLength) inputValueLength.placeholder = cfg.placeholder;
            }

            function updateSubtitle() {
                const cfg = getActiveCatConfig();
                const fromObj = findUnitObj(selectSatuanMainLength.value);
                const toObj = findUnitObj(selectSatuanOutputLength.value);
                const fromName = fromObj ? fromObj.name : selectSatuanMainLength.value;
                const toName = toObj ? toObj.name : selectSatuanOutputLength.value;
                if (headerSubtitle) {
                    const pairText = (selectSatuanMainLength.value === selectSatuanOutputLength.value)
                        ? fromName
                        : `${fromName} ke ${toName}`;
                    headerSubtitle.textContent = `${cfg.label} • ${pairText}`;
                }
            }

            function formatHasil(hasil) {
                if (hasil === 0 || Object.is(hasil, -0)) return '0';
                const absVal = Math.abs(hasil);
                if (absVal >= 0.01) {
                    return hasil.toLocaleString('id-ID', { maximumFractionDigits: 4 });
                } else if (absVal >= 0.000001) {
                    let str = hasil.toLocaleString('id-ID', { maximumFractionDigits: 8 });
                    str = str.replace(/(\,\d*?[1-9])0+$/, '$1').replace(/\,0+$/, '');
                    return str;
                } else {
                    return hasil.toExponential(4).replace('.', ',');
                }
            }

            // Konversi Suhu via basis Celsius
            function toCelsius(val, unit) {
                switch (unit) {
                    case 'C': return val;
                    case 'F': return (val - 32) * 5 / 9;
                    case 'K': return val - 273.15;
                    case 'Re': return val * 5 / 4;
                    case 'R': return (val - 491.67) * 5 / 9;
                    default: return val;
                }
            }

            function fromCelsius(c, unit) {
                switch (unit) {
                    case 'C': return c;
                    case 'F': return (c * 9 / 5) + 32;
                    case 'K': return c + 273.15;
                    case 'Re': return c * 4 / 5;
                    case 'R': return (c + 273.15) * 9 / 5;
                    default: return c;
                }
            }

            function getTemperatureFormulaInfo(fromUnit, toUnit) {
                if (fromUnit === toUnit) {
                    const uObj = findUnitObj(fromUnit);
                    return `Satuan asal dan tujuan sama (<span class="text-teal-600 dark:text-teal-300 font-bold">${uObj.text}</span>).`;
                }
                const refC = 0;
                const refFrom = fromCelsius(refC, fromUnit);
                const refTo = fromCelsius(refC, toUnit);
                const fromObj = findUnitObj(fromUnit);
                const toObj = findUnitObj(toUnit);
                return `Acuan titik beku: <span class="text-teal-600 dark:text-teal-300 font-bold">${formatHasil(refFrom)} ${fromObj.text}</span> setara dengan <span class="text-teal-600 dark:text-teal-300 font-bold">${formatHasil(refTo)} ${toObj.text}</span>.`;
            }

            function getInfoExtraFactor(satuanFrom, satuanTo) {
                if (satuanFrom === satuanTo) return '';
                const fromObj = findUnitObj(satuanFrom);
                const toObj = findUnitObj(satuanTo);
                if (!fromObj || !toObj) return '';

                let nilaiFrom = 1;
                let nilaiTo = fromObj.factor / toObj.factor;
                let satuanFromText = fromObj.text;
                let satuanToText = toObj.text;

                if (Math.abs(nilaiTo) < 1) {
                    nilaiTo = 1;
                    nilaiFrom = toObj.factor / fromObj.factor;
                    let temp = satuanFromText;
                    satuanFromText = satuanToText;
                    satuanToText = temp;
                }

                let nilaiToStr = formatHasil(nilaiTo);
                let nilaiFromStr = formatHasil(nilaiFrom);

                return `<span class="text-teal-600 dark:text-teal-300 font-bold">${nilaiFromStr} ${satuanFromText}</span> sama dengan <span class="text-teal-600 dark:text-teal-300 font-bold">${nilaiToStr} ${satuanToText}</span>.`;
            }

            function updateResultLength() {
                updateSubtitle();
                const cfg = getActiveCatConfig();
                let rawVal = inputValueLength.value.trim().replace(/,/g, '.');
                const val = parseFloat(rawVal);
                const satuanAsal = selectSatuanMainLength.value;
                const satuanTujuan = selectSatuanOutputLength.value;
                const toObj = findUnitObj(satuanTujuan);
                const fromObj = findUnitObj(satuanAsal);

                if (rawVal === '' || isNaN(val) || (!cfg.allowNegative && val < 0)) {
                    resultInputLength.value = "0";
                    infoTextLength.innerHTML = cfg.emptyHint;
                    return;
                }

                let hasil = 0;
                if (currentCategory === 'temperature') {
                    const c = toCelsius(val, satuanAsal);
                    hasil = fromCelsius(c, satuanTujuan);
                    resultInputLength.value = `${formatHasil(hasil)} ${toObj.text}`;
                    infoTextLength.innerHTML = getTemperatureFormulaInfo(satuanAsal, satuanTujuan);
                } else {
                    const baseVal = val * fromObj.factor;
                    hasil = baseVal / toObj.factor;
                    resultInputLength.value = `${formatHasil(hasil)} ${toObj.text}`;
                    const infoExtraStr = getInfoExtraFactor(satuanAsal, satuanTujuan);
                    infoTextLength.innerHTML = infoExtraStr
                        ? infoExtraStr
                        : `Konversi dari <span class="text-teal-600 dark:text-teal-300 font-bold">${fromObj.text}</span> ke <span class="text-teal-600 dark:text-teal-300 font-bold">${toObj.text}</span>.`;
                }
            }

            // Event Listeners untuk Tab Kategori
            catTabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetCat = btn.getAttribute('data-cat');
                    if (!targetCat || targetCat === currentCategory) return;

                    currentCategory = targetCat;
                    catTabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    populateUnitDropdowns();
                    updateResultLength();
                });
            });

            inputValueLength.addEventListener('input', updateResultLength);
            selectSatuanMainLength.addEventListener('change', updateResultLength);
            selectSatuanOutputLength.addEventListener('change', updateResultLength);
            btnSwitchLength.addEventListener('click', function () {
                const idxMain = selectSatuanMainLength.selectedIndex;
                const idxOut = selectSatuanOutputLength.selectedIndex;
                selectSatuanMainLength.selectedIndex = idxOut;
                selectSatuanOutputLength.selectedIndex = idxMain;
                updateResultLength();
            });

            // Inisialisasi awal
            populateUnitDropdowns();
            updateResultLength();

            // Theme Toggle Logic
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

            function updateThemeIcons() {
                if (document.documentElement.classList.contains('dark')) {
                    themeToggleLightIcon.classList.remove('hidden');
                    themeToggleDarkIcon.classList.add('hidden');
                } else {
                    themeToggleLightIcon.classList.add('hidden');
                    themeToggleDarkIcon.classList.remove('hidden');
                }
            }
            updateThemeIcons();

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', () => {
                    if (document.documentElement.classList.contains('dark')) {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                    }
                    updateThemeIcons();
                });
            }

            // Reset logic
            const tombolReset = document.getElementById('tombolReset');
            if (tombolReset) {
                tombolReset.addEventListener('click', function () {
                    const cfg = getActiveCatConfig();
                    inputValueLength.value = '';
                    selectSatuanMainLength.value = cfg.defaultFrom;
                    selectSatuanOutputLength.value = cfg.defaultTo;
                    updateResultLength();
                });
            }
        });
    </script>
</body>

</html>
