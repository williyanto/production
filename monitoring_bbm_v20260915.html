                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>

                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>

    <!-- JavaScript Code -->
    <script>
        // Ambil data dari Local Storage atau inisialisasi array kosong
        let riwayat = JSON.parse(localStorage.getItem('riwayatPengisian')) || [];

        // Set tanggal pengisian secara otomatis saat halaman dimuat
        document.addEventListener("DOMContentLoaded", function() {
            let now = new Date();
            let formattedDate = now.toISOString().slice(0, 10); // Format YYYY-MM-DD
            document.getElementById('tanggalPengisian').value = formattedDate;
            tampilkanRiwayat(); // Tampilkan riwayat yang tersimpan
            tampilkanLaporan(); // Tampilkan laporan
        });

        // Format harga per liter (misal: 15000 -> 15.000)
        function formatHarga(input) {
            let value = input.value.replace(/\D/g, '');
            input.value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        // Hitung total harga berdasarkan jumlah BBM dan harga per liter
        function hitungTotalHarga() {
            let jumlahBBM = parseFloat(document.getElementById('jumlahBBM').value) || 0;
            let hargaPerLiter = parseFloat(document.getElementById('hargaPerLiter').value.replace(/\./g, '')) || 0;
            let totalHarga = jumlahBBM * hargaPerLiter;
            document.getElementById('totalHarga').value = totalHarga.toLocaleString('id-ID');
        }

        // Validasi input sebelum menambahkan data
        function validasiInput() {
            let odoMeter = document.getElementById('odoMeterSekarang').value;
            let jumlahBBM = document.getElementById('jumlahBBM').value;
            let hargaPerLiter = document.getElementById('hargaPerLiter').value;
            if (!odoMeter || !jumlahBBM || !hargaPerLiter) {
                alert("Harap isi semua field!");
                return false;
            }
            return true;
        }

        // Reset form setelah data ditambahkan
        function resetForm() {
            document.getElementById('odoMeterSekarang').value = '';
            document.getElementById('jumlahBBM').value = '';
            document.getElementById('hargaPerLiter').value = '';
            document.getElementById('totalHarga').value = '';
            document.getElementById('tangkiPenuh').checked = false;
        }

        // Format tanggal ke DD-MM-YYYY
        function formatTanggal(tanggal) {
            let [tahun, bulan, hari] = tanggal.split('-');
            return `${hari}-${bulan}-${tahun}`;
        }

        // Tambahkan data pengisian ke riwayat dan simpan ke Local Storage
        function tambahPengisian() {
            if (!validasiInput()) return;

            let data = {
                tanggal: formatTanggal(document.getElementById('tanggalPengisian').value),
                jenisKendaraan: document.getElementById('jenisKendaraan').value,
                odoMeter: document.getElementById('odoMeterSekarang').value,
                spbu: document.getElementById('spbu').value,
                jenisBBM: document.getElementById('jenisBBM').value,
                jumlahBBM: document.getElementById('jumlahBBM').value,
                hargaPerLiter: document.getElementById('hargaPerLiter').value,
                totalHarga: document.getElementById('totalHarga').value,
                tangkiPenuh: document.getElementById('tangkiPenuh').checked ? "Ya" : "Tidak"
            };

            riwayat.push(data);
            localStorage.setItem('riwayatPengisian', JSON.stringify(riwayat));
            tampilkanRiwayat();
            tampilkanLaporan();
            resetForm();
        }

        // Tampilkan riwayat pengisian dari Local Storage
        function tampilkanRiwayat() {
            let riwayatList = document.getElementById('riwayatList');
            riwayatList.innerHTML = '';
            if (riwayat.length === 0) {
                riwayatList.innerHTML = '<div class="p-4 text-center text-xs text-slate-400 dark:text-slate-500 italic bg-slate-50/50 dark:bg-slate-800/20 rounded-2xl border border-slate-200/50 dark:border-slate-800">Belum ada riwayat pengisian BBM.</div>';
                return;
            }
            riwayat.forEach((data, index) => {
                let riwayatItem = document.createElement('div');
                riwayatItem.className = 'riwayat-item bg-white dark:bg-slate-800/80 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700/70 shadow-sm space-y-1.5 transition-all hover:border-emerald-500/40';
                riwayatItem.innerHTML = `
                    <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700/50 pb-2">
                        <div class="flex items-center gap-2">
                            <span class="px-2 py-0.5 rounded-md bg-emerald-50 dark:bg-emerald-950/40 text-rose-600 dark:text-emerald-400 text-[11px] font-bold border border-emerald-200/50 dark:border-emerald-800/40">${data.jenisKendaraan}</span>
                            <span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 text-[11px] font-semibold">${data.spbu} - ${data.jenisBBM}</span>
                        </div>
                        <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500">${data.tanggal}</span>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs py-1">
                        <div><span class="text-[10px] text-slate-400 block uppercase">Odometer</span><span class="font-bold text-slate-700 dark:text-slate-200">${data.odoMeter} Km</span></div>
                        <div><span class="text-[10px] text-slate-400 block uppercase">Jumlah BBM</span><span class="font-bold text-slate-700 dark:text-slate-200">${data.jumlahBBM} L</span></div>
                        <div><span class="text-[10px] text-slate-400 block uppercase">Harga / L</span><span class="font-bold text-slate-700 dark:text-slate-200">Rp ${data.hargaPerLiter}</span></div>
                        <div><span class="text-[10px] text-slate-400 block uppercase">Tangki Penuh</span><span class="font-bold ${data.tangkiPenuh === 'Ya' ? 'text-rose-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'}">${data.tangkiPenuh}</span></div>
                    </div>
                    <div class="flex items-center justify-between border-t border-slate-100 dark:border-slate-700/50 pt-2">
                        <div>
                            <span class="text-[10px] text-slate-400 uppercase font-semibold">Total Harga: </span>
                            <span class="font-extrabold text-sm text-rose-600 dark:text-emerald-400">Rp ${data.totalHarga}</span>
                        </div>
                        <button class="px-2.5 py-1 text-xs font-bold text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 rounded-lg transition-colors" onclick="hapusRiwayatItem(${index})"><svg class="w-4 h-4 mr-1 inline-block" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg> Hapus</button>
                    </div>
                `;
                riwayatList.appendChild(riwayatItem);
            });
        }

        // Tampilkan laporan pengisian BBM
        function tampilkanLaporan() {
            let laporan = document.getElementById('laporan');
            let totalBBM = 0;
            let totalHarga = 0;
            let totalJarak = 0;

            riwayat.forEach((data, index) => {
                totalBBM += parseFloat(data.jumlahBBM) || 0;
                totalHarga += parseFloat(data.totalHarga.replace(/\./g, '')) || 0;

                if (index > 0) {
                    let jarak = (parseFloat(data.odoMeter) || 0) - (parseFloat(riwayat[index - 1].odoMeter) || 0);
                    if (jarak > 0) totalJarak += jarak;
                }
            });

            let konsumsiBBM = totalBBM > 0 ? (totalJarak / totalBBM).toFixed(2) : "0.00";
            let rataRataKonsumsi = konsumsiBBM;

            laporan.innerHTML = `
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="bg-white/60 dark:bg-slate-900/40 p-2.5 rounded-xl border border-emerald-500/20">
                        <span class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block uppercase">Total Jumlah BBM</span>
                        <span class="font-extrabold text-sm text-slate-800 dark:text-slate-100 font-mono">${totalBBM.toFixed(2)} <span class="text-xs text-slate-500">Liter</span></span>
                    </div>
                    <div class="bg-white/60 dark:bg-slate-900/40 p-2.5 rounded-xl border border-emerald-500/20">
                        <span class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block uppercase">Total Pengeluaran</span>
                        <span class="font-extrabold text-sm text-rose-600 dark:text-emerald-400 font-mono">Rp ${totalHarga.toLocaleString('id-ID')}</span>
                    </div>
                    <div class="bg-white/60 dark:bg-slate-900/40 p-2.5 rounded-xl border border-emerald-500/20">
                        <span class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block uppercase">Konsumsi BBM</span>
                        <span class="font-extrabold text-sm text-slate-800 dark:text-slate-100 font-mono">${konsumsiBBM} <span class="text-xs text-slate-500">km/L</span></span>
                    </div>
                    <div class="bg-white/60 dark:bg-slate-900/40 p-2.5 rounded-xl border border-emerald-500/20">
                        <span class="text-[10px] font-semibold text-slate-500 dark:text-slate-400 block uppercase">Rata-rata Konsumsi</span>
                        <span class="font-extrabold text-sm text-slate-800 dark:text-slate-100 font-mono">${rataRataKonsumsi} <span class="text-xs text-slate-500">km/L</span></span>
                    </div>
                </div>
            `;
        }

        // Hapus semua riwayat dari Local Storage
        function hapusRiwayat() {
            if (riwayat.length === 0) return;
            if (confirm("Apakah Anda yakin ingin menghapus semua riwayat pengisian BBM?")) {
                localStorage.removeItem('riwayatPengisian');
                riwayat = [];
                tampilkanRiwayat();
                tampilkanLaporan();
            }
        }

        // Hapus satu item riwayat berdasarkan index
        function hapusRiwayatItem(index) {
            riwayat.splice(index, 1);
            localStorage.setItem('riwayatPengisian', JSON.stringify(riwayat));
            tampilkanRiwayat();
            tampilkanLaporan();
        }

        // Ekspor data ke Excel
        function eksporKeExcel() {
            if (riwayat.length === 0) {
                alert("Belum ada data riwayat untuk diekspor!");
                return;
            }
            const data = riwayat.map(item => ({
                Tanggal: item.tanggal,
                "Jenis Kendaraan": item.jenisKendaraan,
                "Odometer (Km)": item.odoMeter,
                SPBU: item.spbu,
                "Jenis BBM": item.jenisBBM,
                "Jumlah BBM (L)": item.jumlahBBM,
                "Harga per Liter (IDR)": item.hargaPerLiter,
                "Total Harga (IDR)": item.totalHarga,
                "Tangki Penuh": item.tangkiPenuh
            }));

            const worksheet = XLSX.utils.json_to_sheet(data);
            const range = XLSX.utils.decode_range(worksheet["!ref"]);
            const startCell = XLSX.utils.encode_cell({ r: range.s.r, c: range.s.c });
            const endCell = XLSX.utils.encode_cell({ r: range.e.r, c: range.e.c });

            worksheet["!autofilter"] = null;
            worksheet["!table"] = {
                ref: `${startCell}:${endCell}`,
                displayName: "RiwayatPengisian",
                name: "RiwayatPengisian",
                columns: [
                    { name: "Tanggal" },
                    { name: "Jenis Kendaraan" },
                    { name: "Odometer (Km)" },
                    { name: "SPBU" },
                    { name: "Jenis BBM" },
                    { name: "Jumlah BBM (L)" },
                    { name: "Harga per Liter (IDR)" },
                    { name: "Total Harga (IDR)" },
                    { name: "Tangki Penuh" }
                ],
                style: {
                    theme: "TableStyleMedium2",
                    showFirstColumn: false,
                    showLastColumn: false,
                    showRowStripes: true,
                    showColumnStripes: false
                }
            };

            for (let C = range.s.c; C <= range.e.c; C++) {
                let maxWidth = 0;
                for (let R = range.s.r; R <= range.e.r; R++) {
                    const cell = worksheet[XLSX.utils.encode_cell({ r: R, c: C })];
                    if (cell && cell.v) {
                        const cellWidth = cell.v.toString().length;
                        if (cellWidth > maxWidth) maxWidth = cellWidth;
                    }
                }
                worksheet["!cols"] = worksheet["!cols"] || [];
                worksheet["!cols"][C] = { wch: maxWidth + 2 };
            }

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "RiwayatPengisian");
            workbook.Props = {
                Title: "Riwayat Pengisian BBM",
                Author: "Williyanto Adi",
                CreatedDate: new Date()
            };

            XLSX.writeFile(workbook, "Riwayat_Pengisian_BBM_v20260911.xlsx");
        }

        // Ekspor data ke PDF
        function eksporKePDF() {
            if (riwayat.length === 0) {
                alert("Belum ada data riwayat untuk diekspor!");
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFontSize(18);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(40, 40, 40);
            doc.text("Laporan Pengisian BBM", 10, 10);

            doc.setFontSize(12);
            doc.setFont("helvetica", "normal");
            doc.setTextColor(100, 100, 100);
            doc.text("Berikut adalah riwayat pengisian BBM kendaraan Anda.", 10, 20);

            const columns = [
                { title: "Tanggal", dataKey: "tanggal" },
                { title: "Jenis Kendaraan", dataKey: "jenisKendaraan" },
                { title: "Odometer (Km)", dataKey: "odoMeter" },
                { title: "SPBU", dataKey: "spbu" },
                { title: "Jenis BBM", dataKey: "jenisBBM" },
                { title: "Jumlah BBM (L)", dataKey: "jumlahBBM" },
                { title: "Harga per Liter (IDR)", dataKey: "hargaPerLiter" },
                { title: "Total Harga (IDR)", dataKey: "totalHarga" },
                { title: "Tangki Penuh", dataKey: "tangkiPenuh" }
            ];

            const rows = riwayat.map(item => ({
                tanggal: item.tanggal,
                jenisKendaraan: item.jenisKendaraan,
                odoMeter: item.odoMeter,
                spbu: item.spbu,
                jenisBBM: item.jenisBBM,
                jumlahBBM: item.jumlahBBM,
                hargaPerLiter: item.hargaPerLiter,
                totalHarga: item.totalHarga,
                tangkiPenuh: item.tangkiPenuh
            }));

            doc.autoTable({
                head: [columns.map(col => col.title)],
                body: rows.map(row => columns.map(col => row[col.dataKey])),
                startY: 30,
                theme: "striped",
                styles: {
                    fontSize: 10,
                    cellPadding: 2,
                    halign: "center",
                    valign: "middle"
                },
                headStyles: {
                    fillColor: [16, 185, 129],
                    textColor: [255, 255, 255],
                    fontStyle: "bold"
                },
                columnStyles: {
                    0: { halign: "left" },
                    1: { halign: "left" },
                    6: { halign: "right" },
                    7: { halign: "right" }
                }
            });

            doc.setFontSize(10);
            doc.setTextColor(100, 100, 100);
            doc.text("Williyanto Adi 2026", 10, doc.internal.pageSize.height - 10);

            doc.save("Laporan_Pengisian_BBM_v20260911.pdf");
        }

        // Dark Mode Controller
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            if (localStorage.getItem('color-theme') === 'light') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            }
        });
    </script>
</body>
</html>
