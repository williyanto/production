            -ms-overflow-style: none;
            scrollbar-width: none;

        .tab-btn {

            color: #475569;
            border: 1px solid #e2e8f0;

            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.2) !important;

</head>

<body

                                <option value="PE_SH">PE Sheath ST7 (≥12,5 MPa | ≥300%)</option>

                    </div>
                </div>

                    <div>

                <button type="button"
                    onclick="if(window.top!==window.self&&window.parent.closePreviewModal){window.parent.closePreviewModal();}else{history.back();}"
                    class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Kembali
                </button>

                <button type="button" id="btnReset"
                    class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-transparent rounded-xl text-xs font-bold text-white bg-rose-500 hover:bg-rose-600 active:scale-95 transition-all shadow-md shadow-rose-100 dark:shadow-none">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Reset
                </button>

                <a href="index.html"
                    class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    Beranda
                </a>
            </div>
        </div>

        <!-- Footer -->
        <footer
            class="text-center text-slate-400 dark:text-slate-600 text-[10px] mt-1.5 pt-2 border-t border-slate-100 dark:border-slate-800 font-medium">
            Williyanto Adi 2026
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const headerSubtitle = document.getElementById('headerSubtitle');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const panelTensile = document.getElementById('panel-tensile');
            const panelAging = document.getElementById('panel-aging');
            const panelHotset = document.getElementById('panel-hotset');

            const sampleShape = document.getElementById('sampleShape');
            const materialSpec = document.getElementById('materialSpec');
            const labelDim1 = document.getElementById('labelDim1');
            const inputDim1 = document.getElementById('inputDim1');
            const inputDim2 = document.getElementById('inputDim2');
            const forceUnit = document.getElementById('forceUnit');
            const inputForce = document.getElementById('inputForce');
            const inputL0 = document.getElementById('inputL0');
            const inputL1 = document.getElementById('inputL1');

            const agingSpecLimit = document.getElementById('agingSpecLimit');
            const tsBefore = document.getElementById('tsBefore');
            const tsAfter = document.getElementById('tsAfter');
            const ebBefore = document.getElementById('ebBefore');
            const ebAfter = document.getElementById('ebAfter');

            const hsArea = document.getElementById('hsArea');
            const hsStress = document.getElementById('hsStress');
            const hsL0 = document.getElementById('hsL0');
            const hsL1 = document.getElementById('hsL1');
            const hsL2 = document.getElementById('hsL2');

            const statusBadge = document.getElementById('statusBadge');
            const metric1Label = document.getElementById('metric1Label');
            const metric1Value = document.getElementById('metric1Value');
            const metric2Label = document.getElementById('metric2Label');
            const metric2Value = document.getElementById('metric2Value');
            const infoExtraText = document.getElementById('infoExtraText');
            const btnReset = document.getElementById('btnReset');

            let activeTab = 'tensile';

            const specRequirements = {
                XLPE: { minTS: 12.5, minEB: 200, name: 'XLPE' },
                PVC_ISO: { minTS: 12.5, minEB: 125, name: 'PVC Isolasi' },
                PVC_SH: { minTS: 12.5, minEB: 150, name: 'PVC Sheath ST2' },
                PE_SH: { minTS: 12.5, minEB: 300, name: 'PE Sheath ST7' },
                LSOH: { minTS: 9.0, minEB: 125, name: 'LSOH ST8' }
            };

            function parseNum(el) {
                if (!el || !el.value) return NaN;
                return parseFloat(el.value.trim().replace(/,/g, '.'));
            }

            function fmt(num, digits = 2) {
                if (isNaN(num) || !isFinite(num)) return '0';
                return num.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: digits });
            }

            function setBadgeState(state, text) {
                statusBadge.textContent = text;
                if (state === 'pass') {
                    statusBadge.className = 'text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-900/50 text-emerald-700 dark:text-emerald-300 border border-emerald-300/60 dark:border-emerald-700/60';
                } else if (state === 'fail') {
                    statusBadge.className = 'text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-rose-100 dark:bg-rose-900/50 text-rose-700 dark:text-rose-300 border border-rose-300/60 dark:border-rose-700/60';
                } else {
                    statusBadge.className = 'text-[10px] font-extrabold px-2.5 py-0.5 rounded-full bg-slate-200/70 dark:bg-slate-700 text-slate-600 dark:text-slate-300';
                }
            }

            function calculateTensile() {
                metric1Label.textContent = 'Tensile Strength';
                metric2Label.textContent = 'Elongation (EB)';

                const shape = sampleShape.value;
                const d1 = parseNum(inputDim1);
                const t = parseNum(inputDim2);
                const fRaw = parseNum(inputForce);
                const l0 = parseNum(inputL0);
                const l1 = parseNum(inputL1);
                const spec = specRequirements[materialSpec.value] || specRequirements.XLPE;

                let area = NaN;
                if (!isNaN(d1) && !isNaN(t) && d1 > 0 && t > 0) {
                    if (shape === 'dumbbell') {
                        area = d1 * t;
                    } else if (d1 > t) {
                        area = Math.PI * (d1 - t) * t;
                    }
                }

                let ts = NaN;
                if (!isNaN(area) && area > 0 && !isNaN(fRaw) && fRaw > 0) {
                    const fNewton = (forceUnit.value === 'kgf') ? fRaw * 9.80665 : fRaw;
                    ts = fNewton / area;
                }

                let eb = NaN;
                if (!isNaN(l0) && l0 > 0 && !isNaN(l1) && l1 >= l0) {
                    eb = ((l1 - l0) / l0) * 100;
                }

                metric1Value.textContent = !isNaN(ts) ? `${fmt(ts, 2)} MPa` : '0 MPa';
                metric2Value.textContent = !isNaN(eb) ? `${fmt(eb, 1)} %` : '0 %';

                if (isNaN(area) || area <= 0) {
                    setBadgeState('neutral', 'Menunggu Input');
                    infoExtraText.innerHTML = 'Masukkan dimensi sampel, beban tarik, dan panjang putus.';
                    return;
                }

                if (!isNaN(ts) && !isNaN(eb)) {
                    const passTS = ts >= spec.minTS;
                    const passEB = eb >= spec.minEB;
                    if (passTS && passEB) {
                        setBadgeState('pass', 'LULUS (PASS)');
                    } else {
                        setBadgeState('fail', 'TIDAK LULUS (FAIL)');
                    }
                    infoExtraText.innerHTML = `Luas A = <span class="font-bold text-sky-600 dark:text-sky-300">${fmt(area, 3)} mm²</span> • Syarat ${spec.name}: Min <span class="font-bold">${fmt(spec.minTS, 1)} MPa</span> &amp; <span class="font-bold">${spec.minEB}%</span>.`;
                } else {
                    setBadgeState('neutral', `Luas A: ${fmt(area, 3)} mm²`);
                    infoExtraText.innerHTML = `Luas penampang sampel <span class="font-bold text-sky-600 dark:text-sky-300">${fmt(area, 3)} mm²</span>. Lengkapi gaya tarik &amp; panjang putus.`;
                }
            }

            function calculateAging() {
                metric1Label.textContent = 'Variasi TS (Δ%)';
                metric2Label.textContent = 'Variasi EB (Δ%)';

                const limit = parseFloat(agingSpecLimit.value) || 25;
                const ts0 = parseNum(tsBefore);
                const ts1 = parseNum(tsAfter);
                const eb0 = parseNum(ebBefore);
                const eb1 = parseNum(ebAfter);

                const varTS = (!isNaN(ts0) && ts0 > 0 && !isNaN(ts1)) ? ((ts1 - ts0) / ts0) * 100 : NaN;
                const varEB = (!isNaN(eb0) && eb0 > 0 && !isNaN(eb1)) ? ((eb1 - eb0) / eb0) * 100 : NaN;

                metric1Value.textContent = !isNaN(varTS) ? `${varTS > 0 ? '+' : ''}${fmt(varTS, 2)} %` : '0 %';
                metric2Value.textContent = !isNaN(varEB) ? `${varEB > 0 ? '+' : ''}${fmt(varEB, 2)} %` : '0 %';

                if (isNaN(varTS) && isNaN(varEB)) {
                    setBadgeState('neutral', 'Menunggu Input');
                    infoExtraText.innerHTML = 'Masukkan nilai TS dan Elongation sebelum &amp; sesudah aging oven.';
                    return;
                }

                const passTS = isNaN(varTS) || Math.abs(varTS) <= limit;
                const passEB = isNaN(varEB) || Math.abs(varEB) <= limit;

                if (passTS && passEB) {
                    setBadgeState('pass', 'LULUS AGING');
                } else {
                    setBadgeState('fail', 'MELEBIHI BATAS');
                }
                infoExtraText.innerHTML = `Batas spesifikasi variasi aging: <span class="font-bold text-sky-600 dark:text-sky-300">Maks ±${limit}%</span> (IEC 60811-401).`;
            }

            function calculateHotSet() {
                metric1Label.textContent = 'Mulur Beban (≤175%)';
                metric2Label.textContent = 'Set Permanen (≤15%)';

                const area = parseNum(hsArea);
                const stress = parseFloat(hsStress.value) || 0.20;
                const l0 = parseNum(hsL0);
                const l1 = parseNum(hsL1);
                const l2 = parseNum(hsL2);

                const loadNewton = (!isNaN(area) && area > 0) ? area * stress : NaN;
                const loadGram = (!isNaN(loadNewton)) ? (loadNewton / 9.80665) * 1000 : NaN;

                const hotElong = (!isNaN(l0) && l0 > 0 && !isNaN(l1) && l1 >= l0) ? ((l1 - l0) / l0) * 100 : NaN;
                const permSet = (!isNaN(l0) && l0 > 0 && !isNaN(l2) && l2 >= l0) ? ((l2 - l0) / l0) * 100 : NaN;

                metric1Value.textContent = !isNaN(hotElong) ? `${fmt(hotElong, 1)} %` : '0 %';
                metric2Value.textContent = !isNaN(permSet) ? `${fmt(permSet, 1)} %` : '0 %';

                if (!isNaN(hotElong) && !isNaN(permSet)) {
                    const passHot = hotElong <= 175;
                    const passPerm = permSet <= 15;
                    if (passHot && passPerm) {
                        setBadgeState('pass', 'LULUS HOT SET');
                    } else {
                        setBadgeState('fail', 'TIDAK LULUS');
                    }
                } else if (!isNaN(loadGram)) {
                    setBadgeState('neutral', `Beban: ${fmt(loadGram, 1)} g`);
                } else {
                    setBadgeState('neutral', 'Menunggu Input');
                }

                if (!isNaN(loadGram)) {
                    infoExtraText.innerHTML = `Beban gantung wajib: <span class="font-bold text-sky-600 dark:text-sky-300">${fmt(loadGram, 1)} gram</span> (${fmt(loadNewton, 2)} N) pada suhu 200°C.`;
                } else {
                    infoExtraText.innerHTML = 'Masukkan luas penampang A (mm²) untuk menghitung beban gantung Hot Set.';
                }
            }

            function updateAll() {
                if (activeTab === 'tensile') calculateTensile();
                else if (activeTab === 'aging') calculateAging();
                else calculateHotSet();
            }

            sampleShape.addEventListener('change', () => {
                if (sampleShape.value === 'dumbbell') {
                    labelDim1.textContent = 'Lebar Pita w (mm)';
                    inputDim1.placeholder = 'Contoh: 4.0';
                } else {
                    labelDim1.textContent = 'Diameter Luar D (mm)';
                    inputDim1.placeholder = 'Contoh: 5.2';
                }
                updateAll();
            });

            tabBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    activeTab = btn.getAttribute('data-tab');
                    tabBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    panelTensile.classList.toggle('hidden', activeTab !== 'tensile');
                    panelAging.classList.toggle('hidden', activeTab !== 'aging');
                    panelHotset.classList.toggle('hidden', activeTab !== 'hotset');

                    if (activeTab === 'tensile') {
                        headerSubtitle.textContent = 'IEC 60811-501 • Tensile & Elongation';
                    } else if (activeTab === 'aging') {
                        headerSubtitle.textContent = 'IEC 60811-401 • Variasi Aging Oven';
                    } else {
                        headerSubtitle.textContent = 'IEC 60811-507 • Hot Set Test XLPE';
                    }
                    updateAll();
                });
            });

            [materialSpec, inputDim1, inputDim2, forceUnit, inputForce, inputL0, inputL1,
                agingSpecLimit, tsBefore, tsAfter, ebBefore, ebAfter,
                hsArea, hsStress, hsL0, hsL1, hsL2].forEach(el => {
                    el.addEventListener('input', updateAll);
                    el.addEventListener('change', updateAll);
                });

            btnReset.addEventListener('click', () => {
                if (activeTab === 'tensile') {
                    inputDim1.value = sampleShape.value === 'dumbbell' ? '4' : '';
                    inputDim2.value = '';
                    inputForce.value = '';
                    inputL0.value = '20';
                    inputL1.value = '';
                } else if (activeTab === 'aging') {
                    tsBefore.value = '';
                    tsAfter.value = '';
                    ebBefore.value = '';
                    ebAfter.value = '';
                } else {
                    hsArea.value = '';
                    hsL0.value = '20';
                    hsL1.value = '';
                    hsL2.value = '';
                }
                updateAll();
            });

            // Theme Toggle Logic
            const themeToggleBtn = document.getElementById('theme-toggle');
            const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
            const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

            function updateThemeIcons() {
                if (document.documentElement.classList.contains('dark')) {
                    themeToggleLightIcon.classList.remove('hidden');
                    themeToggleDarkIcon.classList.add('hidden');
                } else {
                    themeToggleLightIcon.classList.add('hidden');
                    themeToggleDarkIcon.classList.remove('hidden');
                }
            }
            updateThemeIcons();

            if (themeToggleBtn) {
                themeToggleBtn.addEventListener('click', () => {
                    if (document.documentElement.classList.contains('dark')) {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('color-theme', 'light');
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('color-theme', 'dark');
                    }
                    updateThemeIcons();
                });
            }

            updateAll();
        });
    </script>
</body>

</html>
