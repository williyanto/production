    <script>
        // ----------------- Dark Mode Controller -----------------
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function () {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            if (localStorage.getItem('color-theme') === 'light') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            }
        });

        // ----------------- Tab Navigation -----------------
        let activeTabId = 'tab-og';

        function switchTab(tabId, el) {
            activeTabId = tabId;
            const tabs = ['tab-og', 'tab-oa', 'tab-et', 'tab-ws'];
            tabs.forEach(id => {
                const target = document.getElementById(id);
                if (target) {
                    target.classList.add('hidden');
                    target.classList.remove('block');
                }
            });
            const activePanel = document.getElementById(tabId);
            if (activePanel) {
                activePanel.classList.remove('hidden');
                activePanel.classList.add('block');
            }

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (el) {
                el.classList.add('active');
            } else if (window.event && window.event.currentTarget) {
                window.event.currentTarget.classList.add('active');
            }
        }

        // ----------------- Tombol Navigasi -----------------
        function handleKembali() {
            if (window.top !== window.self && window.parent && window.parent.closePreviewModal) {
                window.parent.closePreviewModal();
            } else if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        // ----------------- Kalkulasi Logic -----------------
        function updateStatus(elementId, isPassed) {
            const el = document.getElementById(elementId);
            if (!el) return;
            if (isPassed === null) {
                el.textContent = "STANDBY";
                el.className = "px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider bg-slate-100 text-slate-400 border border-slate-200 dark:bg-slate-800/80 dark:text-slate-500 dark:border-slate-700";
            } else if (isPassed) {
                el.textContent = "PASS";
                el.className = "px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider bg-green-100 text-green-600 border border-green-200 dark:bg-green-900/30 dark:text-green-400 dark:border-green-800";
            } else {
                el.textContent = "FAIL";
                el.className = "px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider bg-red-100 text-red-600 border border-red-200 dark:bg-red-900/30 dark:text-red-400 dark:border-red-800";
            }
        }

        function calcOpenGap() {
            const ukurVal = document.getElementById("og_ukur").value.trim();
            const tapeVal = document.getElementById("og_tape").value.trim();
            const specVal = document.getElementById("og_spec").value.trim();

            if (!ukurVal || !tapeVal) {
                document.getElementById("og_res").textContent = "0.00 %";
                updateStatus("og_status", null);
                return;
            }
            const ukur = parseFloat(ukurVal) || 0;
            const tape = parseFloat(tapeVal) || 1;
            const maxSpec = specVal !== "" ? parseFloat(specVal) : 50;
            const res = tape !== 0 ? (ukur / tape) * 100 : 0;
            document.getElementById("og_res").textContent = res.toFixed(2) + " %";
            updateStatus("og_status", res <= maxSpec);
        }

        function calcOverlap() {
            const ukurVal = document.getElementById("oa_ukur").value.trim();
            const tapeVal = document.getElementById("oa_tape").value.trim();
            const specVal = document.getElementById("oa_spec").value.trim();

            if (!ukurVal || !tapeVal) {
                document.getElementById("oa_res").textContent = "0.00 %";
                updateStatus("oa_status", null);
                return;
            }
            const ukur = parseFloat(ukurVal) || 0;
            const tape = parseFloat(tapeVal) || 1;
            const minSpec = specVal !== "" ? parseFloat(specVal) : 15;
            const res = tape !== 0 ? (ukur / tape) * 100 : 0;
            document.getElementById("oa_res").textContent = res.toFixed(2) + " %";
            updateStatus("oa_status", res >= minSpec);
        }

        function calcEqualizing() {
            const ukurVal = document.getElementById("et_ukur").value.trim();
            const tapeVal = document.getElementById("et_tape").value.trim();
            const specVal = document.getElementById("et_spec").value.trim();

            if (!ukurVal || !tapeVal) {
                document.getElementById("et_res").textContent = "0.00";
                updateStatus("et_status", null);
                return;
            }
            const ukur = parseFloat(ukurVal) || 0;
            const tape = parseFloat(tapeVal) || 1;
            const maxSpec = specVal !== "" ? parseFloat(specVal) : 3;
            const res = tape !== 0 ? ukur / tape : 0;
            document.getElementById("et_res").textContent = res.toFixed(2);
            updateStatus("et_status", res <= maxSpec);
        }

        function calcWireScreen() {
            const diaVal = document.getElementById("aws_dia").value.trim();
            const qtyVal = document.getElementById("aws_qty").value.trim();
            const specVal = document.getElementById("aws_spec").value.trim();

            if (!diaVal || !qtyVal) {
                document.getElementById("aws_res").textContent = "0.000";
                updateStatus("aws_status", null);
                return;
            }
            const dia = parseFloat(diaVal) || 0;
            const qty = parseFloat(qtyVal) || 0;
            const minSpec = specVal !== "" ? parseFloat(specVal) : 25.00;
            const res = dia * dia * 0.785 * qty;
            document.getElementById("aws_res").textContent = res.toFixed(3);
            updateStatus("aws_status", res >= minSpec);
        }

        function resetForm() {
            // Kosongkan input pada tab yang sedang aktif agar pengguna bisa menginput nilai baru
            if (activeTabId === 'tab-og') {
                document.getElementById("og_ukur").value = "";
                document.getElementById("og_tape").value = "";
                document.getElementById("og_spec").value = "";
                calcOpenGap();
                document.getElementById("og_ukur").focus();
            } else if (activeTabId === 'tab-oa') {
                document.getElementById("oa_ukur").value = "";
                document.getElementById("oa_tape").value = "";
                document.getElementById("oa_spec").value = "";
                calcOverlap();
                document.getElementById("oa_ukur").focus();
            } else if (activeTabId === 'tab-et') {
                document.getElementById("et_ukur").value = "";
                document.getElementById("et_tape").value = "";
                document.getElementById("et_spec").value = "";
                calcEqualizing();
                document.getElementById("et_ukur").focus();
            } else if (activeTabId === 'tab-ws') {
                document.getElementById("aws_dia").value = "";
                document.getElementById("aws_qty").value = "";
                document.getElementById("aws_spec").value = "";
                calcWireScreen();
                document.getElementById("aws_dia").focus();
            }
        }

        window.onload = function () {
            calcOpenGap();
            calcOverlap();
            calcEqualizing();
            calcWireScreen();
        };
    </script>
</body>

</html>
