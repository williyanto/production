<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>BersihIn — Pengingat Aktivitas Rumah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- 1. Top App Header (Sticky Compact) -->
    <header class="app-header">
      <button class="header-switcher" id="headerSwitcherBtn" type="button" aria-label="Pilih profil rumah">
        <div class="header-avatar" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V9.5"/><path d="M9 21v-6h6v6"/></svg>
        </div>
        <div class="header-identity">
          <div class="header-title-row">
            <span class="header-title" id="headerHouseName">Rumah Utama</span>
            <svg class="icon icon-xs chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <span class="header-subtitle" id="headerSubtitle">9 tugas • Pengingat 07:00</span>
        </div>
      </button>

      <div class="header-actions">
        <button class="status-chip" id="streakBadgeBtn" type="button" title="Streak Harian">
          <svg class="icon icon-xs" viewBox="0 0 24 24"><path d="M12 2c.5 3.5-2 5.5-2 8.5a4 4 0 0 0 8 0c0-2.5-1.5-4.5-3-6.5.5 2-1 3.5-2 3.5-.5-2 0-4-1-5.5Z"/><path d="M8.5 14.5A4.5 4.5 0 0 0 13 21a4.5 4.5 0 0 0 4.5-4.5"/></svg>
          <span id="headerStreakText">0 hari</span>
        </button>
        <button class="icon-btn" id="themeToggleBtn" type="button" aria-label="Ubah tema">
          <svg class="icon" id="themeIconSun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
          <svg class="icon hidden" id="themeIconMoon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button class="icon-btn" id="notifyTestBtn" type="button" aria-label="Uji notifikasi">
          <svg class="icon" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="notify-dot" id="notifyDot"></span>
        </button>
      </div>
    </header>

    <!-- 2. Scrollable App Content -->
    <main class="app-content" id="appContent">
      <!-- TAB 1: TIMELINE -->
      <section class="tab-view active" id="view-timeline" aria-label="Timeline Harian"></section>

      <!-- TAB 2: TUGAS -->
      <section class="tab-view" id="view-tasks" aria-label="Semua Tugas"></section>

      <!-- TAB 3: STATISTIK -->
      <section class="tab-view" id="view-stats" aria-label="Statistik dan Tren"></section>

      <!-- TAB 4: PENGATURAN -->
      <section class="tab-view" id="view-settings" aria-label="Pengaturan"></section>
    </main>

    <!-- Floating Toast / Undo Banner -->
    <div class="toast-banner" id="toastBanner" role="status" aria-live="polite">
      <div class="toast-content">
        <span class="toast-dot"></span>
        <span class="toast-message" id="toastMessage">Tugas selesai ✨</span>
      </div>
      <button class="toast-action hidden" id="toastUndoBtn" type="button">Urungkan</button>
    </div>

    <!-- 3. Bottom Navigation Bar -->
    <nav class="bottom-nav" aria-label="Navigasi Utama">
      <button class="nav-item active" data-tab="timeline" type="button">
        <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/><path d="m9 15 2 2 4-4"/></svg>
        <span>Timeline</span>
      </button>
      <button class="nav-item" data-tab="tasks" type="button">
        <svg class="icon" viewBox="0 0 24 24"><path d="M9 6h11"/><path d="M9 12h11"/><path d="M9 18h11"/><path d="M4 6h.01"/><path d="M4 12h.01"/><path d="M4 18h.01"/></svg>
        <span>Tugas</span>
      </button>
      <button class="nav-item" data-tab="stats" type="button">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16v-5"/><path d="M12 16V8"/><path d="M17 16v-8"/></svg>
        <span>Statistik</span>
      </button>
      <button class="nav-item" data-tab="settings" type="button">
        <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        <span>Pengaturan</span>
      </button>
    </nav>

    <!-- Bottom Sheet Modal Container -->
    <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true">
      <div class="bottom-sheet" id="bottomSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-handle"></div>
        <div class="sheet-header">
          <h2 class="sheet-title" id="sheetTitle">Judul</h2>
          <button class="icon-btn" id="sheetCloseBtn" type="button" aria-label="Tutup">
            <svg class="icon" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
