    const slangDict = {

    function matchCase(sourceWord, replacementWord) {
      if (sourceWord === sourceWord.toUpperCase()) {
        return replacementWord.toUpperCase();
      }
      if (sourceWord.length > 0 && sourceWord[0] === sourceWord[0].toUpperCase()) {
        return replacementWord.charAt(0).toUpperCase() + replacementWord.slice(1).toLowerCase();
      }
      return replacementWord.toLowerCase();
    }

    // Fungsi Utama Koreksi Typo & Kata Baku
    function applyTypoCorrection(text, logCallback) {
      if (!text) {
        if (logCallback) logCallback([]);
        return text;
      }

      let result = text;
      const log = [];

      // 1. Tanda Baca & Spasi (Jika aktif)
      if (optPunctuation && optPunctuation.checked) {
        // Hilangkan spasi sebelum tanda baca: "kata ," -> "kata,"
        result = result.replace(/\s+([,.:;!?])/g, "$1");
        // Rapikan tanda baca koma berulang: ",," -> ","
        result = result.replace(/,{2,}/g, ",");
        // Rapikan tanda tanya/seru berlebih: "???" -> "?"
        result = result.replace(/\?{2,}/g, "?");
        result = result.replace(/!{2,}/g, "!");
      }

      // Gabungkan kamus sesuai opsi yang aktif
      const combinedDict = {};
      if (optKbbi && optKbbi.checked) {
        Object.assign(combinedDict, kbbiDict);
      }
      if (optSlang && optSlang.checked) {
        Object.assign(combinedDict, slangDict);
      }

      // Jalankan penggantian kata dengan batas kata (\b)
      for (const [wrong, correct] of Object.entries(combinedDict)) {
        // Escape regex karakter khusus
        const safeWrong = wrong.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&");
        const regex = new RegExp(`\\b${safeWrong}\\b`, "gi");

        result = result.replace(regex, (matched) => {
          const replacement = matchCase(matched, correct);
          if (matched !== replacement) {
            log.push({ from: matched, to: replacement });
          }
          return replacement;
        });
      }

      if (logCallback) logCallback(log);
      return result;
    }

    function toggleTypoList() {
      if (!typoListPanel) return;
      typoListPanel.classList.toggle("hidden");
    }

    function renderTypoList(list) {
      activeTypoLog = list;
      if (!typoListItems || !typoCountBadge || !btnToggleTypoList || !typoBadge || !typoStatsText) return;

      if (!toggleTypo.checked || list.length === 0) {
        typoBadge.style.display = "none";
        btnToggleTypoList.classList.add("hidden");
        btnToggleTypoList.classList.remove("inline-flex");
        typoListPanel.classList.add("hidden");
        return;
      }

      typoStatsText.textContent = `Dikoreksi: ${list.length} kata`;
      typoCountBadge.textContent = list.length;
      typoBadge.style.display = "inline-flex";
      btnToggleTypoList.classList.remove("hidden");
      btnToggleTypoList.classList.add("inline-flex");

      // Unique summary
      const summaryMap = new Map();
      list.forEach(item => {
        const key = `${item.from.toLowerCase()} ➔ ${item.to.toLowerCase()}`;
        summaryMap.set(key, (summaryMap.get(key) || 0) + 1);
      });

      typoListItems.innerHTML = "";
      summaryMap.forEach((count, key) => {
        const badge = document.createElement("span");
        badge.className = "bg-white dark:bg-slate-800 border border-emerald-300 dark:border-emerald-700/60 text-emerald-800 dark:text-emerald-300 px-2 py-0.5 rounded text-[11px] font-semibold shadow-xs flex items-center gap-1";
        badge.innerHTML = `<span>${key}</span>${count > 1 ? `<span class="bg-emerald-100 dark:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 text-[10px] px-1 rounded-full font-bold">×${count}</span>` : ''}`;
        typoListItems.appendChild(badge);
      });
    }

    function resetForm() {
      inputText.value = "";
      excludeWords.value = "";
      outputText.value = "";
      if (toggleTypo) toggleTypo.checked = false;
      renderTypoList([]);
      setMode('proper');
      processText();
      inputText.focus();
    }

    // Fungsi Hitung Kata
    function countWords(text) {
      const trimmed = text.trim();
      if (trimmed === "") return 0;
      return trimmed.split(/\s+/).length;
    }

    // Fungsi Filter Hilangkan Kata
    function filterExcludedWords(text, statsCallback) {
      const filterValue = excludeWords.value.trim();
      const originalWordCount = countWords(text);

      if (!filterValue || !text.trim()) {
        if (statsCallback) statsCallback(0);
        return text;
      }

      const wordsToRemove = filterValue
        .split(/[.,]/)
        .map((w) => w.trim())
        .filter((w) => w.length > 0);

      if (wordsToRemove.length === 0) {
        if (statsCallback) statsCallback(0);
        return text;
      }

      let filteredText = text;
      wordsToRemove.forEach((word) => {
        const mapEscaped = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&");
        const regex = new RegExp("\\b" + mapEscaped + "\\b", "gi");
        filteredText = filteredText.replace(regex, "");
      });

      filteredText = filteredText
        .replace(/\s+/g, " ")
        .replace(/\s+([.,!?])/g, "$1")
        .trim();

      const finalWordCount = countWords(filteredText);
      const diff = originalWordCount - finalWordCount;
      if (statsCallback) statsCallback(diff > 0 ? diff : 0);

      return filteredText;
    }

    // 1. Mode Huruf Besar di Awal Kalimat saja (Proper / Sentence Case)
    function convertToProperCase(text) {
      if (!text) return "";
      let lower = text.toLowerCase();
      return lower.replace(
        /(^\s*|[.!?]\s+)([a-z])/g,
        function (match, separator, char) {
          return separator + char.toUpperCase();
        },
      );
    }

    // 2. Mode Huruf Besar di Setiap Awalan Kata (Title Case)
    function convertToTitleCase(text) {
      if (!text) return "";
      return text.toLowerCase().replace(/\b\w/g, function (char) {
        return char.toUpperCase();
      });
    }

    // 3. Mode Huruf Kapital Semua (UPPERCASE)
    function convertToUpperCase(text) {
      if (!text) return "";
      return text.toUpperCase();
    }

    // 4. Mode Split Teks Menjadi Baris Per Kata
    function convertToSplitLines(text) {
      if (!text) return "";
      return text.trim().split(/\s+/).join("\n");
    }

    // 5. Mode Berantakan (Random Case)
    function convertToChaosCase(text) {
      if (!text) return "";
      return text
        .split("")
        .map((char) => {
          return Math.random() > 0.5
            ? char.toUpperCase()
            : char.toLowerCase();
        })
        .join("");
    }

    // Jalankan pemrosesan teks utama
    function processText() {
      let currentText = inputText.value;

      // 1. Koreksi Typo jika toggle aktif
      let detectedTypos = [];
      if (toggleTypo && toggleTypo.checked && currentText.trim()) {
        currentText = applyTypoCorrection(currentText, (list) => {
          detectedTypos = list;
        });
      }
      renderTypoList(detectedTypos);

      // 2. Filter Hilangkan Kata
      let deletedWordsTotal = 0;
      const cleanedText = filterExcludedWords(currentText, (count) => {
        deletedWordsTotal = count;
      });

      // Reset styling kelas output
      outputText.className = outputText.className
        .replace("text-amber-400", "text-pink-400")
        .replace("text-cyan-400", "text-pink-400")
        .replace("text-purple-400", "text-pink-400");
      outputLabel.className =
        "text-xs font-semibold uppercase tracking-wider mb-2 flex items-center gap-1.5 text-pink-500 dark:text-pink-400";

      // 3. Eksekusi Kategori Format
      if (currentMode === "proper") {
        outputText.value = convertToProperCase(cleanedText);
        outputLabel.innerHTML = `<i data-lucide="align-left" class="w-3.5 h-3.5"></i> Hasil: Format Kalimat`;
      } else if (currentMode === "title") {
        outputText.value = convertToTitleCase(cleanedText);
        outputLabel.innerHTML = `<i data-lucide="heading" class="w-3.5 h-3.5"></i> Hasil: Format Awalan Kata`;
      } else if (currentMode === "upper") {
        outputText.value = convertToUpperCase(cleanedText);
        outputText.className = outputText.className.replace(
          "text-pink-400",
          "text-purple-400",
        );
        outputLabel.className =
          "text-xs font-semibold uppercase tracking-wider mb-2 flex items-center gap-1.5 text-purple-600 dark:text-purple-400";
        outputLabel.innerHTML = `<i data-lucide="case-upper" class="w-3.5 h-3.5"></i> Hasil: Huruf Kapital (UPPERCASE)`;
      } else if (currentMode === "split") {
        outputText.value = convertToSplitLines(cleanedText);
        outputText.className = outputText.className.replace(
          "text-pink-400",
          "text-cyan-400",
        );
        outputLabel.className =
          "text-xs font-semibold uppercase tracking-wider mb-2 flex items-center gap-1.5 text-cyan-600 dark:text-cyan-400";
        outputLabel.innerHTML = `<i data-lucide="scissors" class="w-3.5 h-3.5"></i> Hasil: Pecah Per Kata`;
      } else if (currentMode === "chaos") {
        outputText.value = convertToChaosCase(cleanedText);
        outputText.className = outputText.className.replace(
          "text-pink-400",
          "text-amber-400",
        );
        outputLabel.className =
          "text-xs font-semibold uppercase tracking-wider mb-2 flex items-center gap-1.5 text-amber-600 dark:text-amber-400";
        outputLabel.innerHTML = `<i data-lucide="zap-off" class="w-3.5 h-3.5"></i> Hasil: Berantakan`;
      }

      const rawText = inputText.value;
      charCount.textContent = `Karakter: ${rawText.length}`;
      wordCount.textContent = `Kata: ${countWords(rawText)}`;

      if (deletedWordsTotal > 0 && excludeWords.value.trim() !== "") {
        removedCount.textContent = `Dihilangkan: ${deletedWordsTotal} kata`;
        removedBadge.style.display = "inline-flex";
      } else {
        removedBadge.style.display = "none";
      }

      lucide.createIcons();
    }

    function setMode(mode) {
      currentMode = mode;
      const buttons = [
        { el: modeProper, key: "proper" },
        { el: modeTitle, key: "title" },
        { el: modeUpper, key: "upper" },
        { el: modeSplit, key: "split" },
        { el: modeChaos, key: "chaos" },
      ];

      buttons.forEach((btn) => {
        if (btn.key === currentMode) {
          btn.el.className =
            "flex-1 min-w-[100px] sm:min-w-[120px] py-2 px-2.5 rounded-lg cursor-pointer transition-all duration-200 flex items-center justify-center gap-1.5 bg-fuchsia-600 text-white shadow";
        } else {
          btn.el.className =
            "flex-1 min-w-[100px] sm:min-w-[120px] py-2 px-2.5 rounded-lg cursor-pointer transition-all duration-200 flex items-center justify-center gap-1.5 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200";
        }
      });

      processText();
    }

    // Event Listeners
    inputText.addEventListener("input", processText);
    excludeWords.addEventListener("input", processText);

    if (toggleTypo) toggleTypo.addEventListener("change", processText);
    if (optKbbi) optKbbi.addEventListener("change", processText);
    if (optSlang) optSlang.addEventListener("change", processText);
    if (optPunctuation) optPunctuation.addEventListener("change", processText);

    // Share to WhatsApp
    function shareToWhatsApp() {
      const text = outputText.value.trim();
      if (!text) {
        alert("Teks hasil masih kosong! Silakan ketik atau tempel teks terlebih dahulu.");
        return;
      }
      const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(text);
      window.open(url, "_blank");
    }

    // Salin ke Clipboard
    function copyToClipboard() {
      if (!outputText.value) return;

      navigator.clipboard
        .writeText(outputText.value)
        .then(() => {
          const originalContent = btnCopy.innerHTML;
          btnCopy.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-500"></i> <span class="text-emerald-500">Tersalin!</span>`;
          btnCopy.classList.add("border-emerald-500/30", "bg-emerald-500/10");
          lucide.createIcons();

          setTimeout(() => {
            btnCopy.innerHTML = originalContent;
            btnCopy.classList.remove(
              "border-emerald-500/30",
              "bg-emerald-500/10",
            );
            lucide.createIcons();
          }, 2000);
        })
        .catch((err) => console.error(err));
    }
  </script>
