  <script>
    lucide.createIcons();

    // Dark Mode Controller
    const themeToggleBtn = document.getElementById('theme-toggle');
    const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
    const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

    if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
        themeToggleLightIcon.classList.remove('hidden');
    } else {
        document.documentElement.classList.remove('dark');
        themeToggleDarkIcon.classList.remove('hidden');
    }

    themeToggleBtn.addEventListener('click', function () {
        themeToggleDarkIcon.classList.toggle('hidden');
        themeToggleLightIcon.classList.toggle('hidden');
        if (localStorage.getItem('color-theme') === 'light') {
            document.documentElement.classList.add('dark');
            localStorage.setItem('color-theme', 'dark');
        } else {
            document.documentElement.classList.remove('dark');
            localStorage.setItem('color-theme', 'light');
        }
    });

    const inputText = document.getElementById("inputText");
    const excludeWords = document.getElementById("excludeWords");
    const outputText = document.getElementById("outputText");
    const outputDisplay = document.getElementById("outputDisplay");
    const outputLabel = document.getElementById("outputLabel");
    const charCount = document.getElementById("charCount");
    const wordCount = document.getElementById("wordCount");
    const removedCount = document.getElementById("removedCount");
    const removedBadge = document.getElementById("removedBadge");
    const btnCopy = document.getElementById("btnCopy");
    const btnWhatsapp = document.getElementById("btnWhatsapp");

    // Typo Elements
    const toggleTypo = document.getElementById("toggleTypo");
    const typoBadge = document.getElementById("typoBadge");
    const typoStatsText = document.getElementById("typoStatsText");
    const btnToggleTypoList = document.getElementById("btnToggleTypoList");
    const typoCountBadge = document.getElementById("typoCountBadge");
    const typoListPanel = document.getElementById("typoListPanel");
    const typoListItems = document.getElementById("typoListItems");
    const typoMarkHeader = document.getElementById("typoMarkHeader");
    const typoMarkCount = document.getElementById("typoMarkCount");
    const markStyleLabel = document.getElementById("markStyleLabel");

    // Mode Buttons
    const modeProper = document.getElementById("modeProper");
    const modeTitle = document.getElementById("modeTitle");
    const modeUpper = document.getElementById("modeUpper");
    const modeSplit = document.getElementById("modeSplit");
    const modeChaos = document.getElementById("modeChaos");

    let currentMode = "proper";
    let markStyle = "highlight"; // 'highlight' (sorot visual), 'bracket' ([kata]), 'clean' (teks polos)

    // --- KAMUS BESAR TYPO, SINGKATAN CHAT & KATA BAKU BAHASA INDONESIA ---
    const typoDict = {
      // Kata & Singkatan Percakapan / Typo Harian (Termasuk 'jangn' -> 'jangan')
      "jangn": "jangan", "jgn": "jangan", "jgan": "jangan", "jngn": "jangan", "jngan": "jangan",
      "yg": "yang", "yng": "yang", "ygg": "yang",
      "dgn": "dengan", "dngn": "dengan", "dg": "dengan", "dengn": "dengan",
      "utk": "untuk", "untk": "untuk", "utuk": "untuk",
      "sdh": "sudah", "udh": "sudah", "udah": "sudah", "suda": "sudah", "sda": "sudah",
      "blm": "belum", "blom": "belum", "belom": "belum", "blum": "belum", "blon": "belum",

      "jangan", "dengan", "untuk", "sudah", "belum", "karena", "banget", "tidak", "bisa", "makan",

    // Algoritma Damerau-Levenshtein jarak 1 (transposisi huruf, sisip, hapus, ganti 1 huruf)
    function damerau1(a, b) {
      if (a === b) return false;
      const la = a.length, lb = b.length;
      if (Math.abs(la - lb) > 1) return false;
      if (la === lb) {
        let diffs = [];
        for (let i = 0; i < la; i++) {
          if (a[i] !== b[i]) diffs.push(i);
        }
        if (diffs.length === 1) return true;
        if (diffs.length === 2 && diffs[1] === diffs[0] + 1) {
          return a[diffs[0]] === b[diffs[1]] && a[diffs[1]] === b[diffs[0]];
        }
        return false;
      }
      const [longer, shorter] = la > lb ? [a, b] : [b, a];
      let i = 0, j = 0, diff = 0;
      while (i < longer.length && j < shorter.length) {
        if (longer[i] !== shorter[j]) {
          diff++;
          if (diff > 1) return false;
          i++;
        } else {
          i++; j++;
        }
      }
      return true;
    }

    function findFuzzyMatch(word) {
      if (word.length < 4) return null;
      if (commonVocabulary.has(word)) return null;
      for (const vocab of commonVocabulary) {
        if (damerau1(word, vocab)) return vocab;
      }
      return null;
    }

    // Fungsi pencocokan casing (mempertahankan huruf kapital asal)
    function matchCase(sourceWord, replacementWord) {
      if (sourceWord === sourceWord.toUpperCase() && sourceWord.length > 1) {
        return replacementWord.toUpperCase();
      }
      if (sourceWord.length > 0 && sourceWord[0] === sourceWord[0].toUpperCase()) {
        return replacementWord.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
      }
      return replacementWord.toLowerCase();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function toggleTypoList() {
      if (!typoListPanel) return;
      typoListPanel.classList.toggle("hidden");
    }

    // Toggle Gaya Penanda Typo pada Hasil Format (Sorot Visual ⇆ Kurung Siku [kata] ⇆ Bersih)
    function toggleMarkStyle() {
      if (markStyle === "highlight") {
        markStyle = "bracket";
        markStyleLabel.textContent = "Tanda: [kata]";
      } else if (markStyle === "bracket") {
        markStyle = "clean";
        markStyleLabel.textContent = "Tanda: Bersih";
      } else {
        markStyle = "highlight";
        markStyleLabel.textContent = "Tanda: Sorot";
      }
      processText();
    }

    function renderTypoList(list) {
      if (!typoListItems || !typoCountBadge || !btnToggleTypoList || !typoBadge || !typoStatsText) return;

      if (!toggleTypo.checked || list.length === 0) {
        typoBadge.style.display = "none";
        btnToggleTypoList.classList.add("hidden");
        btnToggleTypoList.classList.remove("inline-flex");
        typoListPanel.classList.add("hidden");
        typoMarkHeader.classList.add("hidden");
        typoMarkHeader.classList.remove("flex");
        return;
      }

      typoStatsText.textContent = `${list.length} dikoreksi`;
      typoCountBadge.textContent = `${list.length} kata`;
      typoBadge.style.display = "inline-flex";
      btnToggleTypoList.classList.remove("hidden");
      btnToggleTypoList.classList.add("inline-flex");

      // Tampilkan indikator & pilihan tanda di atas kartu Hasil Format
      typoMarkHeader.classList.remove("hidden");
      typoMarkHeader.classList.add("flex");
      typoMarkCount.textContent = `${list.length} diganti`;

      // Rangkum kata unik untuk panel popover
      const summaryMap = new Map();
      list.forEach(item => {
        const key = `${item.from} ➔ ${item.to}`;
        summaryMap.set(key, (summaryMap.get(key) || 0) + 1);
      });

      typoListItems.innerHTML = "";
      summaryMap.forEach((count, key) => {
        const badge = document.createElement("span");
        badge.className = "bg-slate-100 dark:bg-slate-700/80 border border-emerald-300 dark:border-emerald-700 text-emerald-800 dark:text-emerald-300 px-2 py-0.5 rounded-lg text-[10px] font-bold shadow-xs flex items-center gap-1";
        badge.innerHTML = `<span>${escapeHtml(key)}</span>${count > 1 ? `<span class="bg-emerald-200 dark:bg-emerald-900 text-emerald-800 dark:text-emerald-200 text-[9px] px-1 rounded-full font-black">×${count}</span>` : ''}`;
        typoListItems.appendChild(badge);
      });
    }

    function resetForm() {
      inputText.value = "";
      excludeWords.value = "";
      outputText.value = "";
      outputDisplay.innerHTML = '<span class="text-slate-400 dark:text-slate-500 select-none">Hasil format akan muncul di sini...</span>';
      toggleTypo.checked = true; // Aktif default
      markStyle = "highlight";
      markStyleLabel.textContent = "Tanda: Sorot";
      renderTypoList([]);
      setMode('proper');
      processText();
      inputText.focus();
    }

    // Fungsi Tukar Teks (Swap Input & Output)
    function swapInputOutput() {
      if (!outputText.value && !inputText.value) return;
      const temp = inputText.value;
      inputText.value = outputText.value;
      processText();
    }

    // Fungsi Hitung Kata
    function countWords(text) {
      const trimmed = text.trim();
      if (trimmed === "") return 0;
      return trimmed.split(/\s+/).length;
    }

    // Jalankan pemrosesan teks utama
    function processText() {
      let currentText = inputText.value;

      // 1. Filter Hilangkan Kata (excludeWords)
      const excludedInput = excludeWords.value.trim();
      let deletedWordsTotal = 0;
      if (excludedInput && currentText) {
        const wordsToRemove = excludedInput
          .split(/[,.\s]+/)
          .filter((w) => w.length > 0);
        if (wordsToRemove.length > 0) {
          wordsToRemove.forEach((word) => {
            const escapedWord = word.replace(/[-\/\\^$*+?.()|[\]{}]/g, "\\$&");
            const regex = new RegExp(`\\b${escapedWord}\\b`, "gi");
            const matches = currentText.match(regex);
            if (matches) {
              deletedWordsTotal += matches.length;
            }
            currentText = currentText.replace(regex, "");
          });
          currentText = currentText.replace(/\s+/g, " ").trim();
        }
      }

      // 2. Tokenisasi teks dengan batas kata & spasi/tanda baca
      const tokens = currentText.split(/([a-zA-Z0-9_\u00C0-\u024F]+)/);
      const tokenObjects = [];
      const detectedTypos = [];

      for (const token of tokens) {
        if (!token) continue;
        const isWord = /^[a-zA-Z0-9_\u00C0-\u024F]+$/.test(token);
        if (!isWord) {
          tokenObjects.push({ raw: token, text: token, isWord: false, isTypo: false });
          continue;
        }

        if (toggleTypo && toggleTypo.checked) {
          const lower = token.toLowerCase();
          let rep = null;

          if (typoDict[lower]) {
            rep = matchCase(token, typoDict[lower]);
          } else {
            const fuzzy = findFuzzyMatch(lower);
            if (fuzzy) {
              rep = matchCase(token, fuzzy);
            }
          }

          if (rep && rep.toLowerCase() !== lower) {
            detectedTypos.push({ from: token, to: rep });
            tokenObjects.push({ raw: token, text: rep, isWord: true, isTypo: true, from: token });
          } else {
            tokenObjects.push({ raw: token, text: token, isWord: true, isTypo: false });
          }
        } else {
          tokenObjects.push({ raw: token, text: token, isWord: true, isTypo: false });
        }
      }

      renderTypoList(detectedTypos);

      // 3. Transformasi Casing Berdasarkan Mode Aktif
      let transformed = tokenObjects;

      if (currentMode === "upper") {
        transformed = tokenObjects.map(t => ({ ...t, text: t.text.toUpperCase() }));
      } else if (currentMode === "title") {
        transformed = tokenObjects.map(t => {
          if (!t.isWord) return t;
          const cap = t.text.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');
          return { ...t, text: cap };
        });
      } else if (currentMode === "proper") {
        let capitalizeNext = true;
        transformed = tokenObjects.map(t => {
          if (t.isWord) {
            if (capitalizeNext) {
              capitalizeNext = false;
              const cap = t.text.split(' ').map((w, idx) => idx === 0 ? (w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()) : w.toLowerCase()).join(' ');
              return { ...t, text: cap };
            } else {
              return { ...t, text: t.text.toLowerCase() };
            }
          } else {
            if (/[.!?]/.test(t.text)) {
              capitalizeNext = true;
            }
            return t;
          }
        });
      } else if (currentMode === "chaos") {
        transformed = tokenObjects.map(t => {
          if (!t.isWord) return t;
          const c = t.text.split('').map(ch => Math.random() > 0.5 ? ch.toUpperCase() : ch.toLowerCase()).join('');
          return { ...t, text: c };
        });
      }

      // Update styling label & container berdasarkan mode
      outputDisplay.className = outputDisplay.className
        .replace("text-pink-600 dark:text-pink-400", "")
        .replace("text-purple-600 dark:text-purple-400", "")
        .replace("text-cyan-600 dark:text-cyan-400", "")
        .replace("text-amber-600 dark:text-amber-400", "");

      if (currentMode === "proper") {
        outputDisplay.className += " text-pink-600 dark:text-pink-400";
        outputLabel.className = "text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 text-pink-500 dark:text-pink-400";
        outputLabel.innerHTML = `<i data-lucide="align-left" class="w-3.5 h-3.5"></i> <span>Hasil: Format Kalimat</span>`;
      } else if (currentMode === "title") {
        outputDisplay.className += " text-pink-600 dark:text-pink-400";
        outputLabel.className = "text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 text-pink-500 dark:text-pink-400";
        outputLabel.innerHTML = `<i data-lucide="heading" class="w-3.5 h-3.5"></i> <span>Hasil: Format Awalan Kata</span>`;
      } else if (currentMode === "upper") {
        outputDisplay.className += " text-purple-600 dark:text-purple-400";
        outputLabel.className = "text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 text-purple-600 dark:text-purple-400";
        outputLabel.innerHTML = `<i data-lucide="case-upper" class="w-3.5 h-3.5"></i> <span>Hasil: Huruf Kapital (UPPERCASE)</span>`;
      } else if (currentMode === "split") {
        outputDisplay.className += " text-cyan-600 dark:text-cyan-400";
        outputLabel.className = "text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 text-cyan-600 dark:text-cyan-400";
        outputLabel.innerHTML = `<i data-lucide="scissors" class="w-3.5 h-3.5"></i> <span>Hasil: Pecah Per Kata</span>`;
      } else if (currentMode === "chaos") {
        outputDisplay.className += " text-amber-600 dark:text-amber-400";
        outputLabel.className = "text-[11px] font-bold uppercase tracking-wider flex items-center gap-1.5 text-amber-600 dark:text-amber-400";
        outputLabel.innerHTML = `<i data-lucide="zap-off" class="w-3.5 h-3.5"></i> <span>Hasil: Berantakan</span>`;
      }

      // 4. Render Hasil ke Plain String dan HTML Display dengan Penanda
      let plainResult = "";
      let htmlResult = "";

      if (currentMode === "split") {
        const wordsOnly = transformed.filter(t => t.isWord);
        plainResult = wordsOnly.map(t => {
          if (t.isTypo && markStyle === "bracket") return `[${t.text}]`;
          return t.text;
        }).join("\n");

        htmlResult = wordsOnly.map(t => {
          const esc = escapeHtml(t.text);
          if (t.isTypo) {
            if (markStyle === "bracket") {
              return `<mark class="bg-amber-200/90 dark:bg-amber-900/60 text-amber-950 dark:text-amber-100 px-1 py-0.5 rounded font-semibold border-b-2 border-amber-500 cursor-help" title="Dikoreksi dari: ${escapeHtml(t.from)}">[${esc}]</mark>`;
            }
            if (markStyle === "highlight") {
              return `<mark class="inline-flex items-center gap-0.5 bg-amber-200/90 dark:bg-amber-900/60 text-amber-950 dark:text-amber-100 px-1.5 py-0.5 rounded font-semibold border-b-2 border-amber-500 cursor-help transition-all" title="Dikoreksi dari: ${escapeHtml(t.from)} ➔ ${esc}">${esc}<span class="text-[9px] text-amber-600 dark:text-amber-400 font-bold ml-0.5 select-none">✓</span></mark>`;
            }
          }
          return esc;
        }).join("\n");
      } else {
        const plainArr = [];
        const htmlArr = [];

        for (const t of transformed) {
          if (!t.isWord) {
            plainArr.push(t.text);
            htmlArr.push(escapeHtml(t.text));
            continue;
          }

          if (t.isTypo) {
            const esc = escapeHtml(t.text);
            if (markStyle === "bracket") {
              plainArr.push(`[${t.text}]`);
              htmlArr.push(`<mark class="bg-amber-200/90 dark:bg-amber-900/60 text-amber-950 dark:text-amber-100 px-1 py-0.5 rounded font-semibold border-b-2 border-amber-500 cursor-help" title="Dikoreksi dari: ${escapeHtml(t.from)}">[${esc}]</mark>`);
            } else if (markStyle === "highlight") {
              plainArr.push(t.text);
              htmlArr.push(`<mark class="inline-flex items-center gap-0.5 bg-amber-200/90 dark:bg-amber-900/60 text-amber-950 dark:text-amber-100 px-1.5 py-0.5 rounded font-semibold border-b-2 border-amber-500 cursor-help transition-all" title="Dikoreksi dari: ${escapeHtml(t.from)} ➔ ${esc}">${esc}<span class="text-[9px] text-amber-600 dark:text-amber-400 font-bold ml-0.5 select-none">✓</span></mark>`);
            } else {
              plainArr.push(t.text);
              htmlArr.push(esc);
            }
          } else {
            plainArr.push(t.text);
            htmlArr.push(escapeHtml(t.text));
          }
        }

        plainResult = plainArr.join("");
        htmlResult = htmlArr.join("");
      }

      outputText.value = plainResult;
      outputDisplay.innerHTML = htmlResult || '<span class="text-slate-400 dark:text-slate-500 select-none">Hasil format akan muncul di sini...</span>';

      // 5. Update Statistik Teks
      const rawText = inputText.value;
      charCount.textContent = `Karakter: ${rawText.length}`;
      wordCount.textContent = `Kata: ${countWords(rawText)}`;

      if (deletedWordsTotal > 0 && excludeWords.value.trim() !== "") {
        removedCount.textContent = `${deletedWordsTotal} dibuang`;
        removedBadge.style.display = "inline-flex";
      } else {
        removedBadge.style.display = "none";
      }

      lucide.createIcons();
    }

    function setMode(mode) {
      currentMode = mode;
      const buttons = [
        { el: modeProper, key: "proper" },
        { el: modeTitle, key: "title" },
        { el: modeUpper, key: "upper" },
        { el: modeSplit, key: "split" },
        { el: modeChaos, key: "chaos" },
      ];

      buttons.forEach((btn) => {
        if (btn.key === currentMode) {
          btn.el.className =
            "flex-1 min-w-[85px] sm:min-w-[110px] py-1.5 px-2 rounded-lg cursor-pointer transition-all duration-200 flex items-center justify-center gap-1 bg-fuchsia-600 text-white shadow";
        } else {
          btn.el.className =
            "flex-1 min-w-[85px] sm:min-w-[110px] py-1.5 px-2 rounded-lg cursor-pointer transition-all duration-200 flex items-center justify-center gap-1 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200";
        }
      });

      processText();
    }

    // Event Listeners
    inputText.addEventListener("input", processText);
    excludeWords.addEventListener("input", processText);
    if (toggleTypo) toggleTypo.addEventListener("change", processText);

    // Share to WhatsApp
    function shareToWhatsApp() {
      const text = outputText.value.trim();
      if (!text) {
        alert("Teks hasil masih kosong! Silakan ketik atau tempel teks terlebih dahulu.");
        return;
      }
      const encoded = encodeURIComponent(text);
      const waUrl = `https://api.whatsapp.com/send?text=${encoded}`;
      window.open(waUrl, "_blank");
    }

    // Salin ke Clipboard
    function copyToClipboard() {
      if (!outputText.value) return;

      navigator.clipboard
        .writeText(outputText.value)
        .then(() => {
          const originalContent = btnCopy.innerHTML;
          btnCopy.innerHTML = `
            <i data-lucide="check" class="w-3.5 h-3.5 text-emerald-500"></i>
            <span class="text-emerald-500">Tersalin!</span>
          `;
          lucide.createIcons();
          setTimeout(() => {
            btnCopy.innerHTML = originalContent;
            lucide.createIcons();
          }, 2000);
        })
        .catch((err) => {
          console.error("Gagal menyalin teks: ", err);
        });
    }

    // Initial Process
    processText();
  </script>
</body>

</html>
