<!DOCTYPE html>
<html lang="id" class="transition-all duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Faktor Koreksi Suhu</title>
    <link rel="icon" type="image/png" href="./icons/williyanto_logo_rounded.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        select {
            background-image: none !important;
        }
        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
    <script>
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-gradient-to-tr from-slate-100 via-indigo-50/30 to-slate-100 dark:from-slate-950 dark:via-slate-900/60 dark:to-slate-950 min-h-[100dvh] flex flex-col justify-center items-center py-2 px-3 overflow-x-hidden transition-colors duration-300">

    <!-- Ambient Background Blobs -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none opacity-40 dark:opacity-20 hidden md:block">
        <div class="absolute -top-40 -left-40 w-96 h-96 rounded-full bg-indigo-400 blur-[100px] animate-pulse"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 rounded-full bg-sky-400 blur-[100px] animate-pulse" style="animation-delay: 2s;"></div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md mx-auto bg-white/95 dark:bg-slate-900/95 backdrop-blur-md rounded-3xl border border-slate-200/50 dark:border-slate-800/80 shadow-xl p-4 sm:p-5 transition-all duration-300 flex flex-col w-full max-h-[calc(100dvh-1rem)] my-auto overflow-hidden">
        
        <!-- Header -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-100 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-sky-200 dark:shadow-none">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 002 2h2a2 2 0 002-2z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-base font-bold text-slate-800 dark:text-slate-100 tracking-tight">Faktor Koreksi Suhu</h1>
                    <p class="text-[10px] text-slate-400 dark:text-slate-500 font-semibold uppercase tracking-wider">IEC • ICEA • AS/NZS • SPLN</p>
                </div>
            </div>
            
            <!-- Dark Mode Toggle Button -->
            <button id="theme-toggle" type="button" class="p-2 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700/60 hover:bg-slate-100 dark:hover:bg-slate-750 active:scale-95 transition-all">
                <svg id="theme-toggle-dark-icon" class="w-4 h-4 text-slate-500 dark:text-slate-400 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                </svg>
                <svg id="theme-toggle-light-icon" class="w-4 h-4 text-amber-500 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m12.728 12.728l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z" />
                </svg>
            </button>
        </div>

        <!-- Inputs and controls container -->
        <div class="space-y-3 flex-1 flex flex-col justify-between my-2 overflow-y-auto scrollbar-none">
            
            <div class="space-y-3">
                <!-- Standard & Konduktor Row -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="relative group">
                        <label for="specSelect" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Standard</label>
                        <div class="relative">
                            <select id="specSelect" onchange="hitungKoreksi()" class="appearance-none block w-full pl-3 pr-7 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all text-xs font-bold cursor-pointer">
                                <option value="IEC" selected>IEC Standard</option>
                                <option value="ICEA">ICEA Standard</option>
                                <option value="AS/NZS">AS/NZS Standard</option>
                                <option value="SPLN">SPLN Standard</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400 dark:text-slate-500">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
                            </div>
                        </div>
                    </div>

                    <div class="relative group">
                        <label for="conductorTypeSelect" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Konduktor</label>
                        <div class="relative">
                            <select id="conductorTypeSelect" onchange="hitungKoreksi()" class="appearance-none block w-full pl-3 pr-7 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all text-xs font-bold cursor-pointer">
                                <option value="Cu" selected>Tembaga (Cu)</option>
                                <option value="Al">Aluminium (Al)</option>
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-400 dark:text-slate-500">
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" /></svg>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Suhu Pengujian Input -->
                <div class="relative group">
                    <label for="suhuInput" class="block text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1">Suhu Pengujian (°C)</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400 dark:text-slate-500 group-focus-within:text-sky-500 transition-colors">
                            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                            </svg>
                        </div>
                        <input type="text" inputmode="decimal" id="suhuInput" oninput="hitungKoreksi()" class="pl-9 block w-full px-3 py-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700/80 rounded-xl text-slate-800 dark:text-slate-100 placeholder-slate-400 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 transition-all text-xs font-semibold" placeholder="-40°C s/d 300°C">
                    </div>
                </div>
            </div>

            <!-- Dynamic Result Card -->
            <div id="resultCard" class="transition-all duration-300 rounded-2xl p-4 bg-slate-50 dark:bg-slate-800/40 border border-slate-200 dark:border-slate-700/50 text-center relative overflow-hidden my-1 flex flex-col justify-center items-center flex-1">
                <div class="absolute -right-10 -bottom-10 w-24 h-24 rounded-full bg-sky-500/5 blur-xl pointer-events-none"></div>
                
                <div class="w-full flex items-center justify-between mb-1">
                    <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest">Faktor Koreksi (k)</span>
                </div>
                
                <div class="my-auto py-1 w-full">
                    <span id="hasilKoreksi" class="w-full text-center bg-transparent font-extrabold text-3xl sm:text-4xl text-sky-600 dark:text-sky-300 transition-colors duration-300 block py-0">---</span>
                </div>
                
                <p id="formulaText" class="text-center text-[11px] font-mono text-slate-400 dark:text-slate-500 leading-snug transition-colors duration-300 mt-auto">Rumus: k = 254.5 / (234.5 + t)</p>
            </div>
            
            <!-- Controls Menu -->
            <div class="grid grid-cols-3 gap-3 pt-2.5 border-t border-slate-100 dark:border-slate-800">
                <button type="button" onclick="if(window.top!==window.self&&window.parent.closePreviewModal){window.parent.closePreviewModal();}else{history.back();}" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg>
                    Kembali
                </button>
                
                <button type="button" id="btnReset" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-transparent rounded-xl text-xs font-bold text-white bg-rose-500 hover:bg-rose-600 active:scale-95 transition-all shadow-md shadow-rose-100 dark:shadow-none">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                    Reset
                </button>
                
                <a href="index.html" class="flex items-center justify-center gap-1.5 py-2.5 px-3 border border-slate-200 dark:border-slate-700/80 rounded-xl text-xs font-bold text-slate-600 dark:text-slate-300 bg-white dark:bg-slate-900/50 hover:bg-slate-50 dark:hover:bg-slate-800/50 active:scale-95 transition-all shadow-sm">
                    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    Beranda
                </a>
            </div>

        </div>

        <!-- Footer -->
        <footer class="text-center text-slate-400 dark:text-slate-600 text-[10px] mt-2 pt-2 border-t border-slate-100 dark:border-slate-800 font-medium">
            Williyanto Adi 2026
        </footer>

    </div>

    <!-- Script Logic -->
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const specSelect = document.getElementById('specSelect');
        const conductorTypeSelect = document.getElementById('conductorTypeSelect');
        const inputSuhu = document.getElementById('suhuInput');
        const displayHasil = document.getElementById('hasilKoreksi');
        const formulaDisplay = document.getElementById('formulaText');

        const specs = {
          IEC: {
            Cu: { base: 'k = 254.5 / (234.5 + t)', constant1: 254.5, constant2: 234.5 },
            Al: { base: 'k = 248 / (228 + t)', constant1: 248, constant2: 228 }
          },
          ICEA: {
            Cu: { base: 'k = 259.5 / (234.5 + t)', constant1: 259.5, constant2: 234.5 },
            Al: { base: 'k = 253.0 / (228.0 + t)', constant1: 253.0, constant2: 228.0 }
          },
          'AS/NZS': {
            Cu: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 },
            Al: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 }
          },
          SPLN: {
            Cu: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 },
            Al: { base: 'k = 250 / (230 + t)', constant1: 250, constant2: 230 }
          }
        };

        window.hitungKoreksi = function() {
          const spesifikasi = specSelect.value;
          const conductorType = conductorTypeSelect.value;
          let rawVal = inputSuhu.value.replace(/,/g, '.');
          const suhu = parseFloat(rawVal);
          const currentFormulaData = specs[spesifikasi][conductorType];

          displayHasil.classList.remove('text-rose-600', 'dark:text-rose-400');
          displayHasil.classList.add('text-sky-600', 'dark:text-sky-300');
          inputSuhu.classList.remove('border-rose-400', 'dark:border-rose-500');

          if (isNaN(suhu)) {
            displayHasil.textContent = '---';
            formulaDisplay.textContent = 'Rumus: ' + currentFormulaData.base;
            return;
          }

          const penyebut = currentFormulaData.constant2 + suhu;

          if (penyebut === 0 || suhu < -40 || suhu > 300) {
            displayHasil.textContent = 'Tidak Valid';
            displayHasil.classList.remove('text-sky-600', 'dark:text-sky-300');
            displayHasil.classList.add('text-rose-600', 'dark:text-rose-400');
            inputSuhu.classList.add('border-rose-400', 'dark:border-rose-500');
            formulaDisplay.textContent = 'Rumus: ' + currentFormulaData.base.replace('t', suhu);
            return;
          }

          const faktorKoreksi = currentFormulaData.constant1 / penyebut;

          if (spesifikasi === 'ICEA' || spesifikasi === 'AS/NZS' || spesifikasi === 'SPLN') {
            displayHasil.textContent = faktorKoreksi.toFixed(3);
          } else {
            displayHasil.textContent = faktorKoreksi.toFixed(4);
          }

          formulaDisplay.textContent = 'Rumus: ' + currentFormulaData.base.replace('t', suhu);
        };

        hitungKoreksi();

        // Theme Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        function updateThemeIcons() {
            if (document.documentElement.classList.contains('dark')) {
                themeToggleLightIcon.classList.remove('hidden');
                themeToggleDarkIcon.classList.add('hidden');
            } else {
                themeToggleLightIcon.classList.add('hidden');
                themeToggleDarkIcon.classList.remove('hidden');
            }
        }
        updateThemeIcons();

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
                updateThemeIcons();
            });
        }

        const btnReset = document.getElementById('btnReset');
        if(btnReset) {
          btnReset.addEventListener('click', () => {
            specSelect.value = 'IEC';
            conductorTypeSelect.value = 'Cu';
            inputSuhu.value = '20';
            hitungKoreksi();
          });
        }
    });
    </script>
</body>
</html>
