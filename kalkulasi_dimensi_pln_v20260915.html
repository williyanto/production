    <!-- JavaScript Code -->
    <script>
        // ----------------- Dark Mode Controller -----------------
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeToggleDarkIcon = document.getElementById('theme-toggle-dark-icon');
        const themeToggleLightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            themeToggleLightIcon.classList.remove('hidden');
        } else {
            themeToggleDarkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', function() {
            themeToggleDarkIcon.classList.toggle('hidden');
            themeToggleLightIcon.classList.toggle('hidden');
            if (localStorage.getItem('color-theme') === 'light') {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            } else {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            }
        });

        // ----------------- Tab Navigation -----------------
        function switchTab(tabId) {
            const tabs = ['tab-og', 'tab-oa', 'tab-et', 'tab-ws'];
            tabs.forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('block');
            });
            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById(tabId).classList.add('block');

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // ----------------- Kalkulasi Logic -----------------
        function updateStatus(elementId, isPassed) {
            const el = document.getElementById(elementId);
            if (isPassed) {
                el.textContent = "PASS";
                el.className = "px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider bg-green-100 text-green-600 border border-green-200 dark:bg-green-900/30 dark:text-green-400 dark:border-green-800";
            } else {
                el.textContent = "FAIL";
                el.className = "px-3 py-1 rounded-lg text-xs font-bold uppercase tracking-wider bg-red-100 text-red-600 border border-red-200 dark:bg-red-900/30 dark:text-red-400 dark:border-red-800";
            }
        }

        function calcOpenGap() {
            const ukur = parseFloat(document.getElementById("og_ukur").value) || 0;
            const tape = parseFloat(document.getElementById("og_tape").value) || 1;
            const maxSpec = parseFloat(document.getElementById("og_spec").value) || 0;
            const res = tape !== 0 ? (ukur / tape) * 100 : 0;
            document.getElementById("og_res").textContent = res.toFixed(2) + " %";
            updateStatus("og_status", res <= maxSpec);
        }

        function calcOverlap() {
            const ukur = parseFloat(document.getElementById("oa_ukur").value) || 0;
            const tape = parseFloat(document.getElementById("oa_tape").value) || 1;
            const minSpec = parseFloat(document.getElementById("oa_spec").value) || 0;
            const res = tape !== 0 ? (ukur / tape) * 100 : 0;
            document.getElementById("oa_res").textContent = res.toFixed(2) + " %";
            updateStatus("oa_status", res >= minSpec);
        }

        function calcEqualizing() {
            const ukur = parseFloat(document.getElementById("et_ukur").value) || 0;
            const tape = parseFloat(document.getElementById("et_tape").value) || 1;
            const maxSpec = parseFloat(document.getElementById("et_spec").value) || 0;
            const res = tape !== 0 ? ukur / tape : 0;
            document.getElementById("et_res").textContent = res.toFixed(2);
            updateStatus("et_status", res <= maxSpec);
        }

        function calcWireScreen() {
            const dia = parseFloat(document.getElementById("aws_dia").value) || 0;
            const qty = parseFloat(document.getElementById("aws_qty").value) || 0;
            const minSpec = parseFloat(document.getElementById("aws_spec").value) || 0;
            const res = dia * dia * 0.785 * qty;
            document.getElementById("aws_res").textContent = res.toFixed(3);
            updateStatus("aws_status", res >= minSpec);
        }

        window.onload = function () {
            calcOpenGap();
            calcOverlap();
            calcEqualizing();
            calcWireScreen();
        };
    </script>
